version: '3'
tasks:
  check:
    desc: Check the implementation, specification and governed plan
    cmds:
      - task: rust
      - task: docs
      - ess specify validate --path spec
      - task: conformance
      - aep plan artifact validate
  docs:
    desc: Check the generated documentation pages and the guides' quoted examples for drift
    cmds:
      - cargo run --locked -p llm-docs -- generate --check
  docs-generate:
    desc: Regenerate the crate reference and the status page
    cmds:
      - cargo run --locked -p llm-docs -- generate
  conformance:
    desc: Check ESS projection drift and run behavioral conformance three times
    cmds:
      - cargo run --locked -p b10x-llm-conformance -- check
  rust:
    cmds:
      - cargo test --workspace --locked
      - cargo test -p b10x-llm-credentials --all-features --locked
      - cargo check -p b10x-llm-credentials --no-default-features --locked
      - cargo test -p b10x-llm-cost --all-features --locked
      - cargo check -p b10x-llm-cost --no-default-features --locked
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
