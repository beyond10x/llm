version: '3'
tasks:
  check:
    desc: Check the implementation, specification and governed plan
    cmds:
      - task: rust
      - task: test
      - task: docs
      - ess specify validate --path spec
      - task: conformance
      - aep plan artifact validate
  docs:
    desc: Check the generated documentation pages and the guides' quoted examples for drift
    cmds:
      - cargo run --locked -p llm-docs -- generate --check
  docs-generate:
    desc: Regenerate the crate reference and the status page
    cmds:
      - cargo run --locked -p llm-docs -- generate
  conformance:
    desc: Check ESS projection drift and run behavioral conformance three times
    cmds:
      - cargo run --locked -p llm-conformance -- check
  test:
    desc: 'Run the tests with cargo-nextest (a test over 60 s is killed and fails), fail over 120 s, print the ten slowest'
    cmds:
      - cargo xtask test
  rust:
    desc: Check the optional features, formatting and lints
    cmds:
      - cargo check -p llm-credentials --no-default-features --locked
      - cargo check -p llm-cost --no-default-features --locked
      - cargo check -p llm-bedrock --locked
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - cargo clippy -p llm-models --all-targets --locked -- -D warnings
      - cargo clippy -p llm-bedrock --all-targets --locked -- -D warnings
