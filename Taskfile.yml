version: '3'
tasks:
  check:
    desc: Check the implementation, specification and governed plan
    cmds:
      - task: rust
      - task: test
      - task: docs
      - cargo run --locked -p llm-conformance -- ess specify validate --path spec
      - task: conformance
      - aep plan artifact validate
  docs:
    desc: Check the generated documentation pages and the guides' quoted examples for drift
    cmds:
      - cargo run --locked -p llm-docs -- generate --check
  docs-generate:
    desc: Regenerate the crate reference and the status page
    cmds:
      - cargo run --locked -p llm-docs -- generate
  ux-install:
    desc: Install the docs UX harness in ux/ (Playwright, axe-core, TypeScript) and its Chromium
    dir: ux
    cmds:
      - npm ci --no-audit --no-fund
      - npx playwright install chromium
  ux-check:
    desc: The every-merge docs UX gate over website/build served locally (typecheck, findings rule, L1, L2, L3, ratchet); not part of task check
    dir: ux
    cmds:
      - npx tsc --noEmit
      - node cli.ts findings
      - npx playwright test --workers=2
      - node cli.ts ratchet
  ux-ratchet:
    desc: The ratchet over the last ux-check results; `task ux-ratchet -- --update [--decision <id>]` takes measured values into ux/baseline.json
    dir: ux
    cmds:
      - node cli.ts ratchet {{.CLI_ARGS}}
  ux-scenarios:
    desc: Add a page scenario under ux/scenarios for every page in website/build/sitemap.xml that has none
    dir: ux
    cmds:
      - node cli.ts scenarios
  ux-round:
    desc: The Measure step of a docs UX round; writes ux/rounds/R-nn/ and ux/rounds/trend.md
    dir: ux
    cmds:
      - node cli.ts round {{.CLI_ARGS}}
  conformance:
    desc: Check ESS projection drift and run behavioral conformance three times
    cmds:
      - cargo run --locked -p llm-conformance -- check
  test:
    desc: 'Run the tests with cargo-nextest (a test over 60 s is killed and fails), fail over 120 s, print the ten slowest'
    cmds:
      - cargo xtask test
  release-tag:
    desc: '`task release-tag -- <version> <sha>` tags and pushes a release only when Gate, Shared source gates and Documentation validation ended success on that commit'
    cmds:
      - cargo xtask release-tag {{.CLI_ARGS}}
  rust:
    desc: Check the optional features, formatting and lints
    cmds:
      - cargo check -p llm-credentials --no-default-features --locked
      - cargo check -p llm-cost --no-default-features --locked
      - cargo check -p llm-bedrock --locked
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - cargo clippy -p llm-models --all-targets --locked -- -D warnings
      - cargo clippy -p llm-bedrock --all-targets --locked -- -D warnings
