type: ess-scenario/1
domain: llm.bedrock
scenario: turn-a-converse-stream-a-content-filter-stopped-without-content-is-refused
summary: "a Converse stream a content filter stopped with no content block is refused and final; usage its metadata left out stays unknown"
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm.bedrock.RunTurn
  input:
    api: "Converse"
    stream: true
    model_id: "us.amazon.nova-micro-v1:0"
    request_json: "{\"format\":\"llm.turn/3\",\"request\":{\"model\":\"us.amazon.nova-micro-v1:0\",\"instructions\":\"\",\"items\":[{\"kind\":\"user-text\",\"text\":\"Hello\"}],\"tools\":[]}}"
    recording: "pydantic-test_bedrock_model_stream.bin"
    keep_frames: 1
    frames_json: "[{\"event\":\"messageStop\",\"payload\":{\"stopReason\":\"content_filtered\"}},{\"event\":\"metadata\",\"payload\":{\"metrics\":{\"latencyMs\":5}}}]"
    cut: false
    session_token: false
  outcome: observed
assert:
- view: llm.bedrock.LastTurn
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastTurn
  contains:
    accepted: false
    error_code: "refused"
    dispatch: "accepted"
    retriable: false
    diagnostics_safe: true
    requests: 1
    items: []
    text: ""
    warnings: []
    stop_reason: null
    final_usage: true
    usage_json: null
