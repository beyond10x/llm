type: ess-scenario/1
domain: llm.bedrock
scenario: web-identity-credentials-are-fetched-once-and-kept-until-the-refresh-window
summary: "three calls for credentials valid for an hour make one unsigned form POST that carries the token"
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.FetchWebIdentityCredentials
  input:
    answer: "Valid"
    token: true
    fetches: 3
  outcome: observed
assert:
- view: llm.bedrock.LastWebIdentityCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastWebIdentityCredentials
  contains:
    accepted: true
    error_code: null
    requests: 1
    form_presented: true
    redirect_target_requests: 0
    access_key_id: "ASIAFIXTUREWEBIDENTITY"
    session_token: true
    debug_redacted: true
    diagnostics_safe: true
