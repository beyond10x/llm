type: ess-scenario/1
domain: llm.bedrock
scenario: container-an-endpoint-that-does-not-listen-is-a-retriable-transport-failure
summary: "a refused connection to the endpoint is transport, not-sent and retriable"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.FetchContainerCredentials
  input:
    answer: "Unreachable"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastContainerCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastContainerCredentials
  contains:
    accepted: false
    error_code: "transport"
    dispatch: "not-sent"
    retriable: true
    requests: 0
    token_presented: null
    access_key_id: null
    diagnostics_safe: true
