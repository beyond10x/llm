type: ess-scenario/1
domain: llm.bedrock
scenario: web-identity-an-invalid-identity-token-is-unauthorized-and-final
summary: "STS refusing the token as InvalidIdentityToken is unauthorized, not-sent and final"
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.FetchWebIdentityCredentials
  input:
    answer: "InvalidIdentityToken"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastWebIdentityCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastWebIdentityCredentials
  contains:
    accepted: false
    error_code: "unauthorized"
    dispatch: "not-sent"
    retriable: false
    requests: 1
    form_presented: true
    access_key_id: null
    diagnostics_safe: true
