type: ess-scenario/1
domain: llm.bedrock
scenario: web-identity-a-redirect-is-unauthorized-and-its-target-hears-nothing
summary: "a 307 from the STS endpoint is unauthorized and final, and the redirect target receives no connection"
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.FetchWebIdentityCredentials
  input:
    answer: "Redirect"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastWebIdentityCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastWebIdentityCredentials
  contains:
    accepted: false
    error_code: "unauthorized"
    dispatch: "not-sent"
    retriable: false
    requests: 1
    form_presented: true
    redirect_target_requests: 0
    diagnostics_safe: true
