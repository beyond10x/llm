type: ess-scenario/1
domain: llm.bedrock
scenario: container-an-answer-without-a-secret-key-is-unauthorized
summary: "an answer without SecretAccessKey is refused without quoting the answer"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.FetchContainerCredentials
  input:
    answer: "MissingSecret"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastContainerCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastContainerCredentials
  contains:
    accepted: false
    error_code: "unauthorized"
    dispatch: "not-sent"
    retriable: false
    requests: 1
    token_presented: true
    access_key_id: null
    diagnostics_safe: true
