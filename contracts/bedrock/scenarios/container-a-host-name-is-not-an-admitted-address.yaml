type: ess-scenario/1
domain: llm.bedrock
scenario: container-a-host-name-is-not-an-admitted-address
summary: "http to localhost by name is refused: only addresses are admitted over plain http"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.FetchContainerCredentials
  input:
    uri: "http://localhost/v1/credentials"
    answer: "Valid"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastContainerCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastContainerCredentials
  contains:
    accepted: false
    error_code: "unauthorized"
    dispatch: "not-sent"
    retriable: false
    requests: 0
    token_presented: null
    access_key_id: null
    diagnostics_safe: true
