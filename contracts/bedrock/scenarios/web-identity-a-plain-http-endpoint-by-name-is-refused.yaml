type: ess-scenario/1
domain: llm.bedrock
scenario: web-identity-a-plain-http-endpoint-by-name-is-refused
summary: "plain http to a named STS host is refused when the source is built, before a connection, without quoting the endpoint"
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.FetchWebIdentityCredentials
  input:
    endpoint: "http://sts.eu-central-1.amazonaws.com/"
    answer: "Valid"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastWebIdentityCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastWebIdentityCredentials
  contains:
    accepted: false
    error_code: "unauthorized"
    dispatch: "not-sent"
    retriable: false
    requests: 0
    form_presented: null
    diagnostics_safe: true
