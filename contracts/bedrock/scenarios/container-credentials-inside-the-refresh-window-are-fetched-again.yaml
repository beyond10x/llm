type: ess-scenario/1
domain: llm.bedrock
scenario: container-credentials-inside-the-refresh-window-are-fetched-again
summary: "credentials that expire within five minutes are answered while one refresh fetches again in the background"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.FetchContainerCredentials
  input:
    answer: "ExpiresSoon"
    token: true
    fetches: 2
  outcome: observed
assert:
- view: llm.bedrock.LastContainerCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastContainerCredentials
  contains:
    accepted: true
    error_code: null
    requests: 2
    token_presented: true
    session_token: true
    debug_redacted: true
