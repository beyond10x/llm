type: ess-scenario/1
domain: llm.bedrock
scenario: turn-an-anthropic-invoke-stream-sends-the-messages-body-with-the-bedrock-version
summary: "InvokeModel with a response stream sends the Messages body without model or stream, signs the session token and replays the chunks"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.RunTurn
  input:
    api: "AnthropicInvoke"
    stream: true
    model_id: "anthropic.claude-3-sonnet-20240229-v1:0"
    request_json: "{\"format\":\"llm.turn/3\",\"request\":{\"model\":\"anthropic.claude-3-sonnet-20240229-v1:0\",\"instructions\":\"\",\"items\":[{\"kind\":\"user-text\",\"text\":\"summarize the plot to the lord of the rings in a dozen words\"}],\"tools\":[],\"max_output_tokens\":50}}"
    recording: "ddtrace-anthropic_message_invoke_stream.bin"
    session_token: true
    cut: false
  outcome: observed
assert:
- view: llm.bedrock.LastTurn
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastTurn
  contains:
    accepted: true
    error_code: null
    requests: 1
    request_line: "POST /model/anthropic.claude-3-sonnet-20240229-v1%3A0/invoke-with-response-stream"
    request_body: "{\"anthropic_version\":\"bedrock-2023-05-31\",\"max_tokens\":50,\"messages\":[{\"content\":[{\"cache_control\":{\"type\":\"ephemeral\"},\"text\":\"summarize the plot to the lord of the rings in a dozen words\",\"type\":\"text\"}],\"role\":\"user\"}]}"
    credential_scope: "AKIDEXAMPLE/<date>/eu-central-1/bedrock/aws4_request"
    signature_verifies: true
    security_token_sent: true
    items:
    - "assistant-text:Hobbits embark on epic quest to destroy powerful ring, battling dark forces."
    text: "Hobbits embark on epic quest to destroy powerful ring, battling dark forces."
    warnings: []
    stop_reason: "end-turn"
    upstream_model: "claude-3-sonnet-28k-20240229"
    response_id: "msg_013MVoqeRpeko9EhHVcBdJvk"
    final_usage: true
    usage_json: "{\"output_tokens\":22}"
