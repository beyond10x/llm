type: ess-scenario/1
domain: llm.bedrock
scenario: web-identity-credentials-inside-the-refresh-window-are-fetched-again
summary: "credentials that expire within five minutes are answered and refreshed by a second form POST that reads the token again"
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.FetchWebIdentityCredentials
  input:
    answer: "ExpiresSoon"
    token: true
    fetches: 2
  outcome: observed
assert:
- view: llm.bedrock.LastWebIdentityCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastWebIdentityCredentials
  contains:
    accepted: true
    error_code: null
    requests: 2
    form_presented: true
    access_key_id: "ASIAFIXTUREWEBIDENTITY"
    session_token: true
    debug_redacted: true
    diagnostics_safe: true
