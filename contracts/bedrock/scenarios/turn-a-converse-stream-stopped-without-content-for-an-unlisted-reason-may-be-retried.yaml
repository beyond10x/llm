type: ess-scenario/1
domain: llm.bedrock
scenario: turn-a-converse-stream-stopped-without-content-for-an-unlisted-reason-may-be-retried
summary: "a Converse stream that stops with no content block for a reason with no row of its own is unavailable and may be retried, with its usage"
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm.bedrock.RunTurn
  input:
    api: "Converse"
    stream: true
    model_id: "us.amazon.nova-micro-v1:0"
    request_json: "{\"format\":\"llm.turn/3\",\"request\":{\"model\":\"us.amazon.nova-micro-v1:0\",\"instructions\":\"\",\"items\":[{\"kind\":\"user-text\",\"text\":\"Hello\"}],\"tools\":[]}}"
    recording: "pydantic-test_bedrock_model_stream.bin"
    keep_frames: 1
    frames_json: "[{\"event\":\"messageStop\",\"payload\":{\"stopReason\":\"stop_sequence\"}},{\"event\":\"metadata\",\"payload\":{\"usage\":{\"inputTokens\":9,\"outputTokens\":0,\"totalTokens\":9}}}]"
    cut: false
    session_token: false
  outcome: observed
assert:
- view: llm.bedrock.LastTurn
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastTurn
  contains:
    accepted: false
    error_code: "unavailable"
    dispatch: "accepted"
    retriable: true
    diagnostics_safe: true
    requests: 1
    items: []
    text: ""
    warnings: []
    stop_reason: null
    final_usage: true
    usage_json: "{\"input_tokens\":9,\"output_tokens\":0,\"cached_input_tokens\":0,\"cache_creation_input_tokens\":0}"
