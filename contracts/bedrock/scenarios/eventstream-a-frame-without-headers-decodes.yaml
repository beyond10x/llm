type: ess-scenario/1
domain: llm.bedrock
scenario: eventstream-a-frame-without-headers-decodes
summary: "a frame with no headers carries only its payload"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.DecodeEventStream
  input:
    file: "eventstream/valid_no_headers"
  outcome: observed
assert:
- view: llm.bedrock.LastFrames
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastFrames
  contains:
    accepted: true
    error_code: null
    messages: 1
    first_headers: []
    first_payload: "another test payload"
    splits_agree: true
    round_trip: true
