type: ess-scenario/1
domain: llm.bedrock
scenario: container-a-401-is-unauthorized-and-final
summary: "an endpoint that answers 401 is an unauthorized failure before any turn is sent"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.FetchContainerCredentials
  input:
    answer: "Unauthorized"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastContainerCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastContainerCredentials
  contains:
    accepted: false
    error_code: "unauthorized"
    dispatch: "not-sent"
    retriable: false
    requests: 1
    token_presented: true
    access_key_id: null
    diagnostics_safe: true
