type: ess-scenario/1
domain: llm.bedrock
scenario: web-identity-an-answer-without-a-secret-key-is-unauthorized
summary: "Credentials without SecretAccessKey are refused as unauthorized and final, quoting no answer value"
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.FetchWebIdentityCredentials
  input:
    answer: "MissingSecret"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastWebIdentityCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastWebIdentityCredentials
  contains:
    accepted: false
    error_code: "unauthorized"
    dispatch: "not-sent"
    retriable: false
    requests: 1
    access_key_id: null
    diagnostics_safe: true
