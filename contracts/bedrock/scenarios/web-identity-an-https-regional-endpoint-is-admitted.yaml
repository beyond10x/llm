type: ess-scenario/1
domain: llm.bedrock
scenario: web-identity-an-https-regional-endpoint-is-admitted
summary: "an https regional STS endpoint is admitted when the source is built; nothing is fetched from it"
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.FetchWebIdentityCredentials
  input:
    endpoint: "https://sts.eu-central-1.amazonaws.com"
    answer: "Valid"
    token: true
    fetches: 1
  outcome: observed
assert:
- view: llm.bedrock.LastWebIdentityCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastWebIdentityCredentials
  contains:
    accepted: true
    error_code: null
    requests: 0
    diagnostics_safe: true
