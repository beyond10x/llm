type: ess-scenario/1
domain: llm.bedrock
scenario: sigv4-a-repeated-header-is-signed-as-one-comma-joined-value
summary: "a header sent three times is signed once, its values joined by commas in the order sent"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.SignSuiteCase
  input:
    case: "get-header-key-duplicate"
  outcome: observed
assert:
- view: llm.bedrock.LastSigning
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastSigning
  contains:
    accepted: true
    error_code: null
    authorization: "AWS4-HMAC-SHA256 Credential=AKIDEXAMPLE/20150830/us-east-1/service/aws4_request, SignedHeaders=host;my-header1;x-amz-date, Signature=c9d5ea9f3f72853aea855b47ea873832890dbdd183b4468f858259531a5138ea"
    amz_date: "20150830T123600Z"
    security_token_added: null
