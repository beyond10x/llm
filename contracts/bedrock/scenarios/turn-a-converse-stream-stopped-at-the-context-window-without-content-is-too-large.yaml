type: ess-scenario/1
domain: llm.bedrock
scenario: turn-a-converse-stream-stopped-at-the-context-window-without-content-is-too-large
summary: "a Converse stream that stops at the model context window with no content block is too-large and final, with its usage"
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm.bedrock.RunTurn
  input:
    api: "Converse"
    stream: true
    model_id: "us.amazon.nova-micro-v1:0"
    request_json: "{\"format\":\"llm.turn/3\",\"request\":{\"model\":\"us.amazon.nova-micro-v1:0\",\"instructions\":\"\",\"items\":[{\"kind\":\"user-text\",\"text\":\"Hello\"}],\"tools\":[]}}"
    recording: "pydantic-test_bedrock_model_stream.bin"
    keep_frames: 1
    frames_json: "[{\"event\":\"messageStop\",\"payload\":{\"stopReason\":\"model_context_window_exceeded\"}},{\"event\":\"metadata\",\"payload\":{\"usage\":{\"inputTokens\":200000,\"outputTokens\":0,\"totalTokens\":200000}}}]"
    cut: false
    session_token: false
  outcome: observed
assert:
- view: llm.bedrock.LastTurn
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastTurn
  contains:
    accepted: false
    error_code: "too-large"
    dispatch: "accepted"
    retriable: false
    diagnostics_safe: true
    requests: 1
    items: []
    text: ""
    reasoning: ""
    tool_stream: []
    warnings: []
    stop_reason: null
    final_usage: true
    usage_json: "{\"input_tokens\":200000,\"output_tokens\":0,\"cached_input_tokens\":0,\"cache_creation_input_tokens\":0}"
