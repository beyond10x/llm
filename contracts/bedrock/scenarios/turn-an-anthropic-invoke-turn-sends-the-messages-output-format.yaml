timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.bedrock.RunTurn
  input:
    api: "AnthropicInvoke"
    stream: false
    model_id: "us.anthropic.claude-3-sonnet-20240229-v1:0"
    request_json: '{"format":"llm.turn/4","request":{"model":"us.anthropic.claude-3-sonnet-20240229-v1:0","instructions":"","items":[{"kind":"user-text","text":"summarize the plot to the lord of the rings in a dozen words"}],"tools":[],"max_output_tokens":50,"controls":{"output_format":{"name":"summary","schema":{"type":"object"}}}}}'
    recording: "ddtrace-anthropic_message_invoke.json"
    cut: false
    session_token: false
  outcome: observed
assert:
- view: llm.bedrock.LastTurn
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastTurn
  contains:
    accepted: true
    error_code: null
    requests: 1
    request_line: "POST /model/us.anthropic.claude-3-sonnet-20240229-v1%3A0/invoke"
    request_body: '{"anthropic_version":"bedrock-2023-05-31","max_tokens":50,"messages":[{"content":[{"cache_control":{"type":"ephemeral"},"text":"summarize the plot to the lord of the rings in a dozen words","type":"text"}],"role":"user"}],"output_config":{"format":{"schema":{"type":"object"},"type":"json_schema"}}}'
    signature_verifies: true
    stop_reason: "end-turn"
