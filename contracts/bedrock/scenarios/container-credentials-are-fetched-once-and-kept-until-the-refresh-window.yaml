type: ess-scenario/1
domain: llm.bedrock
scenario: container-credentials-are-fetched-once-and-kept-until-the-refresh-window
summary: "two calls for credentials valid for an hour make one request, which presents the token"
timeline:
- at: '2026-10-22T12:00:00Z'
  command: llm.bedrock.FetchContainerCredentials
  input:
    answer: "Valid"
    token: true
    fetches: 2
  outcome: observed
assert:
- view: llm.bedrock.LastContainerCredentials
  counts:
    at_least: 1
    at_most: 1
- view: llm.bedrock.LastContainerCredentials
  contains:
    accepted: true
    error_code: null
    requests: 1
    token_presented: true
    access_key_id: "ASIAFIXTUREKEYID"
    session_token: true
    debug_redacted: true
    diagnostics_safe: true
