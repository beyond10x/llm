type: ess-scenario/1
domain: llm.chat
scenario: ingress-text-and-image-parts-of-a-user-message-decode-in-order
summary: a user message of text and image_url parts decodes part by part into user text and user image items in order, a data URL into inline bytes and an https URL into a URL (story:image-input)
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":[{"type":"text","text":"Compare"},{"type":"image_url","image_url":{"url":"data:image/png;base64,iVBORw0KGgo="}},{"type":"text","text":"with"},{"type":"image_url","image_url":{"url":"https://images.example/a.png","detail":"auto"}}]}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: true
    error_code: null
    items:
    - 'user:Compare'
    - 'user-image:bytes:image/png:iVBORw0KGgo='
    - 'user:with'
    - 'user-image:url:https://images.example/a.png'
    turn_valid: true
