type: ess-scenario/1
domain: llm.chat
scenario: incoming-a-second-choice-is-refused
summary: incoming a second choice is refused
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      data: {"choices":[{"index":1,"delta":{"content":"other"}}]}

      data: [DONE]

    streamed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    error_code: unsupported
    error_message: chat completion returned more than one choice
