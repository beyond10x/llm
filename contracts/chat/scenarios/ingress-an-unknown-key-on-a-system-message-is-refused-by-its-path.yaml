type: ess-scenario/1
domain: llm.chat
scenario: ingress-an-unknown-key-on-a-system-message-is-refused-by-its-path
summary: ingress refuses a system message key outside role and content, naming its path (ingress.rs)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"system","content":"Be brief","name":"ops"},{"role":"user","content":"hi"}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: 'chat request field is outside the published subset: messages[].name'
    turn_json: null
    turn_valid: null
