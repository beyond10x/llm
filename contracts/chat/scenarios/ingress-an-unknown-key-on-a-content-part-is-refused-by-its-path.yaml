type: ess-scenario/1
domain: llm.chat
scenario: ingress-an-unknown-key-on-a-content-part-is-refused-by-its-path
summary: ingress refuses a content part key outside type and text, naming its path (ingress.rs)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":[{"type":"text","text":"hi","cache_control":{"type":"ephemeral"}}]}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: 'chat request field is outside the published subset: messages[].content[].cache_control'
    turn_json: null
