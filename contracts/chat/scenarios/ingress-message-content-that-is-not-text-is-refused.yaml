type: ess-scenario/1
domain: llm.chat
scenario: ingress-message-content-that-is-not-text-is-refused
summary: ingress refuses message content that is neither a string nor text parts (ingress.rs)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":7}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: invalid-request
    error_message: chat message content is not text
    turn_valid: null
