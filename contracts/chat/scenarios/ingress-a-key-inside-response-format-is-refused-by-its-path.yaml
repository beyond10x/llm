type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-key-inside-response-format-is-refused-by-its-path
summary: a JSON Schema response_format is read, and a key inside it outside the subset is refused by its path
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"response_format":{"type":"json_schema","json_schema":{"name":"place","schema":{"type":"object"},"description":"a place"}}}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: 'chat request field is outside the published subset: response_format.json_schema.description'
