type: ess-scenario/1
domain: llm.chat
scenario: incoming-llama-server-timings-that-contradict-usage-are-refused
summary: incoming llama-server timings that contradict usage are refused
timeline:
- at: '2026-10-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      data: {"choices":[{"finish_reason":null,"index":0,"delta":{"content":"hi"}}],"id":"chatcmpl-contradicted","model":"qwen3-1.7b","object":"chat.completion.chunk"}

      data: {"choices":[{"finish_reason":"stop","index":0,"delta":{}}],"id":"chatcmpl-contradicted","model":"qwen3-1.7b","object":"chat.completion.chunk"}

      data: {"choices":[],"id":"chatcmpl-contradicted","model":"qwen3-1.7b","object":"chat.completion.chunk","usage":{"completion_tokens":1,"prompt_tokens":23,"total_tokens":24,"prompt_tokens_details":{"cached_tokens":8}},"timings":{"cache_n":8,"prompt_n":15,"predicted_n":2}}

      data: [DONE]

    streamed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    error_code: protocol
    # `predicted_n` and `completion_tokens` are one server counter written twice; neither is believed over the other.
    error_message: chat completion timings contradict its usage report
    stream_text: hi
