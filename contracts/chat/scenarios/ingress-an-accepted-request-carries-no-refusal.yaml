type: ess-scenario/1
domain: llm.chat
scenario: ingress-an-accepted-request-carries-no-refusal
summary: an accepted ingress request carries no diagnostic and no dispatch evidence
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"system","content":"Be brief"},{"role":"user","content":[{"type":"text","text":"Weather?"}]},{"role":"assistant","content":"Looking.","tool_calls":[{"id":"call-1","type":"function","function":{"name":"lookup","arguments":"{\"city\":\"Oslo\"}"}}]},{"role":"tool","tool_call_id":"call-1","content":"sunny"}],"tools":[{"type":"function","function":{"name":"lookup","description":"Look
      up","parameters":{"type":"object"}}}],"tool_choice":{"type":"function","function":{"name":"lookup"}},"max_completion_tokens":512,"temperature":0.25,"stream":true,"stream_options":{"include_usage":true}}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts:
    at_least: 1
    at_most: 1
- view: llm.chat.LastIngressRequest
  contains:
    accepted: true
    error_code: null
    error_message: null
    dispatch: null
