type: ess-scenario/1
domain: llm.chat
scenario: round-trip-an-output-format-is-projected-as-response-format
summary: a turn carrying a named strict JSON Schema output format projects it as response_format; its decode-back half is round-trip-an-output-format-decodes-back-to-the-same-turn (outgoing.rs)
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"controls":{"output_format":{"name":"place","schema":{"properties":{"city":{"type":"string"}},"required":["city"],"type":"object"},"strict":true}}}}'
    protocol: chat-completions
    upstream_model: small
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["low","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: false
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: true
    error_code: null
    wire_request: '{"messages":[{"content":"hi","role":"user"}],"model":"small","response_format":{"json_schema":{"name":"place","schema":{"properties":{"city":{"type":"string"}},"required":["city"],"type":"object"},"strict":true},"type":"json_schema"},"stream":false}'
    omitted_advisories: []
