type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-streamed-call-is-named-where-it-was-announced
summary: ingress a streamed call is named where it was announced and not again at the end
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.EncodeIngress
  input:
    outcome_json: '{"format":"llm.outcome/3","outcome":{"stop_reason":{"kind":"tool-calls"},"items":[{"kind":"tool-call","call_id":"call-1","name":"lookup","arguments":{"city":"Oslo"}}],"observation":{"binding":{"protocol":"chat-completions","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"internal-model","binding_revision":"binding-r1"},"upstream_model":"Qwen/Qwen3-8B","usage":{"input_tokens":3,"output_tokens":4},"final_usage":true}}}'
    events_json: '[{"kind":"tool-call-started","call_id":"call-1","name":"lookup"},{"kind":"tool-arguments-delta","call_id":"call-1","delta":"{\"city\":"},{"kind":"tool-arguments-delta","call_id":"call-1","delta":"\"Oslo\"}"}]'
    streamed: true
    include_usage: true
  outcome: observed
assert:
- view: llm.chat.LastIngressResponse
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressResponse
  contains:
    accepted: true
    # The opening chunk names the call, and each fragment follows under its wire index.
    streamed_tool_calls:
    - '{"function":{"arguments":"","name":"lookup"},"id":"call-1","index":0,"type":"function"}'
    - '{"function":{"arguments":"{\"city\":"},"index":0}'
    - '{"function":{"arguments":"\"Oslo\"}"},"index":0}'
    # Two terminal chunks, the finish reason and the counters: the call the client already
    # assembled is not sent a second time.
    chunk_count: '2'
    tool_calls: []
    finish_reason: tool_calls
    usage_json: '{"completion_tokens":4,"prompt_tokens":3,"total_tokens":7}'
