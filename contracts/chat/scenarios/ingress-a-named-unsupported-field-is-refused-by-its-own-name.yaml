type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-named-unsupported-field-is-refused-by-its-own-name
summary: ingress a named unsupported field is refused by its own name
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"n":2}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: chat request field `n` is outside the published subset
