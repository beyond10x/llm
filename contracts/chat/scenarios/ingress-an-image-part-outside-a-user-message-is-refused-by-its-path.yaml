type: ess-scenario/1
domain: llm.chat
scenario: ingress-an-image-part-outside-a-user-message-is-refused-by-its-path
summary: an image_url part in an assistant message is refused by its path before anything is sent, without quoting the URL (story:image-input)
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"},{"role":"assistant","content":[{"type":"image_url","image_url":{"url":"https://images.example/private.png?signature=fixture-signature"}}]}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: 'chat image part is carried only in a user message: messages[].content[]'
