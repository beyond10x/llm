type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-tool-choice-of-none-is-refused
summary: ingress a tool choice of none is refused
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"tool_choice":"none"}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: chat tool choice is outside the published subset
