type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-key-that-is-not-a-field-name-is-refused-without-copying-it
summary: ingress refuses a nested key that is not of a field name's shape and writes it as ? (ingress.rs, llm_core::field_path)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi","a client secret":1}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    # A key name is client text; only a bounded name of the wire's own shape is copied.
    error_message: 'chat request field is outside the published subset: messages[].?'
    turn_json: null
