type: ess-scenario/1
domain: llm.chat
scenario: outgoing-disabled-thinking-is-sent-as-effort-none
summary: disabled thinking with no effort is sent as reasoning_effort none (outgoing.rs, llm_core::wire_effort)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"controls":{"thinking":{"mode":"disabled"}}}}'
    protocol: chat-completions
    upstream_model: Qwen/Qwen3-8B
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["none","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: false
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: true
    error_code: null
    # This wire has no thinking control; the effort none is how it is told not to think.
    wire_request: '{"messages":[{"content":"hi","role":"user"}],"model":"Qwen/Qwen3-8B","reasoning_effort":"none","stream":false}'
