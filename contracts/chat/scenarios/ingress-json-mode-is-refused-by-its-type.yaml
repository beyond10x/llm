type: ess-scenario/1
domain: llm.chat
scenario: ingress-json-mode-is-refused-by-its-type
summary: a response_format of type json_object asks for any JSON at all, which no JSON Schema the neutral turn holds says, and is refused by its type
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"response_format":{"type":"json_object"}}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: 'chat response_format of type `json_object` is outside the published subset: the neutral output format is a JSON Schema'
