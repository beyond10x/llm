type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-stream-without-include-usage-reports-no-counters
summary: ingress a stream without include usage reports no counters
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.EncodeIngress
  input:
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"end-turn"},"items":[{"kind":"assistant-text","text":"Hi"}],"observation":{"binding":{"protocol":"chat-completions","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"internal-model","binding_revision":"binding-r1"},"usage":{"input_tokens":3,"output_tokens":4},"final_usage":true}}}'
    streamed: true
    include_usage: false
  outcome: observed
assert:
- view: llm.chat.LastIngressResponse
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressResponse
  contains:
    accepted: true
    chunk_count: '1'
    finish_reason: stop
    usage_json: null
    tool_calls: []
