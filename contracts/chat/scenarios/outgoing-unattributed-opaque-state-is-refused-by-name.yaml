type: ess-scenario/1
domain: llm.chat
scenario: outgoing-unattributed-opaque-state-is-refused-by-name
summary: outgoing unattributed opaque state is refused by name, never dropped and never bound by the adapter
timeline:
- at: '2026-09-26T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"},{"kind":"unattributed-opaque","protocol":"chat-completions","payload":{"state":"x"}}],"tools":[]}}'
    protocol: chat-completions
    upstream_model: Qwen/Qwen3-8B
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["low","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: true
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: unattributed opaque state is not sendable until a caller binds it to a target
    wire_model: null
