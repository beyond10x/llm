type: ess-scenario/1
domain: llm.chat
scenario: outgoing-an-accepted-projection-carries-no-refusal
summary: an accepted outgoing projection carries no diagnostic and no dispatch evidence
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"Be brief","items":[{"kind":"user-text","text":"Hello"}],"tools":[],"max_output_tokens":256,"sampling":{"temperature":0.5,"reasoning_effort":"high"}}}'
    protocol: chat-completions
    upstream_model: Qwen/Qwen3-8B
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["low","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: true
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.chat.LastRequestProjection
  contains:
    accepted: true
    error_code: null
    error_message: null
    dispatch: null
