type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-tool-call-that-is-not-a-function-is-refused
summary: ingress refuses an assistant tool call whose type is not function (ingress.rs)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"assistant","tool_calls":[{"id":"call-1","type":"custom","function":{"name":"lookup","arguments":"{}"}}]}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: chat tool call type is outside the published subset
    turn_json: null
