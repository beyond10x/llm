type: ess-scenario/1
domain: llm.chat
scenario: incoming-an-unknown-finish-reason-is-refused
summary: incoming an unknown finish reason is refused
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      data: {"choices":[{"index":0,"delta":{},"finish_reason":"abandoned-by-operator"}]}

      data: [DONE]

    streamed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    error_code: protocol
    # The diagnostic names the rule, and carries no byte of the upstream response.
    error_message: chat completion reported a finish reason outside the supported subset
