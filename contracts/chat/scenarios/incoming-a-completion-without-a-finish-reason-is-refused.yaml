type: ess-scenario/1
domain: llm.chat
scenario: incoming-a-completion-without-a-finish-reason-is-refused
summary: incoming a completion without a finish reason is refused
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      {"choices":[{"index":0,"message":{"role":"assistant","content":"x"}}]}

    streamed: false
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    error_code: protocol
    error_message: chat completion carries no finish reason
