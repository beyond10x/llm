type: ess-scenario/1
domain: llm.chat
scenario: egress-an-output-format-without-a-name-is-refused
summary: response_format needs a name, and llm invents none, so an unnamed output format is refused before any I/O
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"controls":{"output_format":{"schema":{"type":"object"}}}}}'
    protocol: chat-completions
    upstream_model: small
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["low","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: false
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: false
    error_code: unsupported
    error_message: Chat Completions needs a name for a JSON Schema output format
    wire_request: null
