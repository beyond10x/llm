type: ess-scenario/1
domain: llm.chat
scenario: incoming-framed-payloads-project-the-same-text-as-bytes-do
summary: incoming framed payloads project the same text as bytes do
timeline:
- at: '2026-09-21T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: '[{"id":"chatcmpl-framed","model":"Qwen/Qwen3-8B","choices":[{"index":0,"delta":{"content":"Guten "}}]},{"choices":[{"index":0,"delta":{"content":"Tag"},"finish_reason":"stop"}]}]'
    streamed: true
    # Observes StreamProjection::accept directly, with no byte framing and no composing
    # wrapper in front of it. A refusal it raises is still a refusal after the endpoint
    # served the bytes that carried it.
    framed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    # accept never sees a terminal sentinel here, because a caller doing its own framing
    # owns that decision; the deltas it produced are still observable beside the refusal.
    error_code: protocol
    error_message: chat completion stream ended before its terminal sentinel
    stream_text: 'Guten Tag'
