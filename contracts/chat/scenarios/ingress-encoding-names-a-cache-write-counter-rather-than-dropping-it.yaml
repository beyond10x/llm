type: ess-scenario/1
domain: llm.chat
scenario: ingress-encoding-names-a-cache-write-counter-rather-than-dropping-it
summary: ingress encoding names a cache write counter rather than dropping it
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.EncodeIngress
  input:
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"end-turn"},"items":[{"kind":"assistant-text","text":"Hi"}],"observation":{"binding":{"protocol":"chat-completions","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"internal-model","binding_revision":"binding-r1"},"usage":{"input_tokens":10,"cache_creation_input_tokens":4},"final_usage":true}}}'
    streamed: false
    include_usage: false
  outcome: observed
assert:
- view: llm.chat.LastIngressResponse
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressResponse
  contains:
    accepted: true
    # This wire has no cache-write counter of its own, so the reported one travels under a
    # named extension instead of being deleted. A total needs two known parts; there is one.
    usage_json: '{"prompt_tokens":10,"prompt_tokens_details":{"cache_creation_input_tokens":4}}'
