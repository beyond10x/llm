type: ess-scenario/1
domain: llm.chat
scenario: ingress-stream-options-that-are-not-an-object-are-refused
summary: ingress refuses a stream_options value that is not an object (ingress.rs)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"stream":true,"stream_options":true}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: invalid-request
    error_message: chat request stream_options is not an object
    turn_valid: null
