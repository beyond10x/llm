type: ess-scenario/1
domain: llm.chat
scenario: incoming-an-unreported-model-is-not-replaced-by-the-binding
summary: incoming an unreported model is not replaced by the binding
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      data: {"choices":[{"index":0,"delta":{"content":"hi"}}]}

      data: {"choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

      data: [DONE]

    streamed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: true
    # The selected binding serves "internal-model". The response named no model, and the
    # observation stays empty rather than borrowing the configured one.
    binding_model: internal-model
    upstream_model: null
    response_id: null
    usage_reported: false
    final_usage: true
