type: ess-scenario/1
domain: llm.chat
scenario: incoming-a-framed-second-choice-is-refused-as-served
summary: incoming a framed second choice is refused as served
timeline:
- at: '2026-09-21T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: '[{"choices":[{"index":1,"delta":{"content":"x"}}]}]'
    streamed: true
    # Observes StreamProjection::accept directly, with no byte framing and no composing
    # wrapper in front of it. A refusal it raises is still a refusal after the endpoint
    # served the bytes that carried it.
    framed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    error_code: unsupported
    error_message: chat completion returned more than one choice
