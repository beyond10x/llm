type: ess-scenario/1
domain: llm.chat
scenario: ingress-other-json-in-a-tool-message-stays-a-successful-string
summary: ingress other JSON in a tool message stays a successful string
timeline:
- at: '2026-10-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"Weather?"},{"role":"assistant","content":null,"tool_calls":[{"id":"call-1","type":"function","function":{"name":"lookup","arguments":"{}"}},{"id":"call-2","type":"function","function":{"name":"lookup","arguments":"{}"}},{"id":"call-3","type":"function","function":{"name":"lookup","arguments":"{}"}},{"id":"call-4","type":"function","function":{"name":"lookup","arguments":"{}"}}]},{"role":"tool","tool_call_id":"call-1","content":"{\"ok\":false}"},{"role":"tool","tool_call_id":"call-2","content":"{\"error\":\"x\",\"ok\":false,\"code\":404}"},{"role":"tool","tool_call_id":"call-3","content":"{\"error\":\"x\",\"ok\":true}"},{"role":"tool","tool_call_id":"call-4","content":"[{\"error\":\"x\",\"ok\":false}]"}],"tools":[{"type":"function","function":{"name":"lookup","description":"Look up","parameters":{"type":"object"}}}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: true
    error_code: null
    items:
    - 'user:Weather?'
    - 'tool-call:call-1:lookup:{}'
    - 'tool-call:call-2:lookup:{}'
    - 'tool-call:call-3:lookup:{}'
    - 'tool-call:call-4:lookup:{}'
    - 'tool-result:call-1:"{\"ok\":false}":false'
    - 'tool-result:call-2:"{\"error\":\"x\",\"ok\":false,\"code\":404}":false'
    - 'tool-result:call-3:"{\"error\":\"x\",\"ok\":true}":false'
    - 'tool-result:call-4:"[{\"error\":\"x\",\"ok\":false}]":false'
    turn_valid: true
