type: ess-scenario/1
domain: llm.chat
scenario: round-trip-an-output-format-decodes-back-to-the-same-turn
summary: the body round-trip-an-output-format-is-projected-as-response-format pins decodes back to the turn it was projected from (ingress.rs)
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"messages":[{"content":"hi","role":"user"}],"model":"small","response_format":{"json_schema":{"name":"place","schema":{"properties":{"city":{"type":"string"}},"required":["city"],"type":"object"},"strict":true},"type":"json_schema"},"stream":false}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: true
    error_code: null
    # Byte for byte the turn_json the projection half was given.
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"controls":{"output_format":{"name":"place","schema":{"properties":{"city":{"type":"string"}},"required":["city"],"type":"object"},"strict":true}}}}'
    omitted_advisories: []
    turn_valid: true
