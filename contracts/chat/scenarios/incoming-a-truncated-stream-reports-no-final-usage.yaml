type: ess-scenario/1
domain: llm.chat
scenario: incoming-a-truncated-stream-reports-no-final-usage
summary: a truncated stream never reports its counters as final
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      data: {"choices":[{"index":0,"delta":{"content":"all of it"},"finish_reason":"stop"}]}

    streamed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    final_usage: null
    usage_reported: null
