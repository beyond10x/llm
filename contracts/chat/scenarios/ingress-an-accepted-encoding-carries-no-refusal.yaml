type: ess-scenario/1
domain: llm.chat
scenario: ingress-an-accepted-encoding-carries-no-refusal
summary: an accepted ingress encoding carries no diagnostic and no dispatch evidence
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.EncodeIngress
  input:
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"end-turn"},"items":[{"kind":"assistant-text","text":"Hello,
      world"}],"observation":{"binding":{"protocol":"chat-completions","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"internal-model","binding_revision":"binding-r1"},"upstream_model":"Qwen/Qwen3-8B","usage":{"input_tokens":31,"output_tokens":9,"cached_input_tokens":16,"reasoning_output_tokens":4},"final_usage":true}}}'
    streamed: false
    include_usage: false
  outcome: observed
assert:
- view: llm.chat.LastIngressResponse
  counts:
    at_least: 1
    at_most: 1
- view: llm.chat.LastIngressResponse
  contains:
    accepted: true
    error_code: null
    error_message: null
    dispatch: null
