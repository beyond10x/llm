type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-stream-flag-that-is-not-a-boolean-is-refused
summary: ingress refuses a stream flag that is not a boolean (ingress.rs flag)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"stream":"yes"}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: invalid-request
    error_message: chat request field `stream` is not a boolean
    turn_valid: null
