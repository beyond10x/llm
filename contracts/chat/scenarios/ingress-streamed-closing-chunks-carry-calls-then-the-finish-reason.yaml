type: ess-scenario/1
domain: llm.chat
scenario: ingress-streamed-closing-chunks-carry-calls-then-the-finish-reason
summary: ingress streamed closing chunks carry calls then the finish reason
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.EncodeIngress
  input:
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"tool-calls"},"items":[{"kind":"tool-call","call_id":"call-1","name":"lookup","arguments":{"city":"Oslo"}}],"observation":{"binding":{"protocol":"chat-completions","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"internal-model","binding_revision":"binding-r1"},"upstream_model":"Qwen/Qwen3-8B","usage":{"input_tokens":3,"output_tokens":4},"final_usage":true}}}'
    streamed: true
    include_usage: true
  outcome: observed
assert:
- view: llm.chat.LastIngressResponse
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressResponse
  contains:
    accepted: true
    # No events were streamed, so the call was never announced. Three chunks: that call,
    # complete, the finish reason, and the counters the client
    # asked for with stream_options.
    chunk_count: '3'
    finish_reason: tool_calls
    tool_calls:
    - '{"function":{"arguments":"{\"city\":\"Oslo\"}","name":"lookup"},"id":"call-1","index":0,"type":"function"}'
    usage_json: '{"completion_tokens":4,"prompt_tokens":3,"total_tokens":7}'
    model_reported: Qwen/Qwen3-8B
