type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-tool-message-carrying-the-failure-object-decodes-as-failed
summary: ingress a tool message carrying the failure object decodes as failed
timeline:
- at: '2026-10-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"Weather?"},{"role":"assistant","content":null,"tool_calls":[{"id":"call-1","type":"function","function":{"name":"lookup","arguments":"{}"}},{"id":"call-2","type":"function","function":{"name":"lookup","arguments":"{}"}}]},{"role":"tool","tool_call_id":"call-1","content":"{\"error\":\"no such city\",\"ok\":false}"},{"role":"tool","tool_call_id":"call-2","content":"{\"ok\":false,\"error\":{\"code\":404}}"}],"tools":[{"type":"function","function":{"name":"lookup","description":"Look up","parameters":{"type":"object"}}}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: true
    error_code: null
    items:
    - 'user:Weather?'
    - 'tool-call:call-1:lookup:{}'
    - 'tool-call:call-2:lookup:{}'
    - 'tool-result:call-1:"no such city":true'
    - 'tool-result:call-2:{"code":404}:true'
    turn_valid: true
