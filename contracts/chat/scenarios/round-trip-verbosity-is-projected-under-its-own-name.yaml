type: ess-scenario/1
domain: llm.chat
scenario: round-trip-verbosity-is-projected-under-its-own-name
summary: a turn carrying a verbosity hint projects it as verbosity; its decode-back half is round-trip-verbosity-decodes-back-to-the-same-turn (outgoing.rs)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"controls":{"hints":{"verbosity":"low"}}}}'
    protocol: chat-completions
    upstream_model: small
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["low","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: false
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: true
    error_code: null
    wire_request: '{"messages":[{"content":"hi","role":"user"}],"model":"small","stream":false,"verbosity":"low"}'
    omitted_advisories: []
