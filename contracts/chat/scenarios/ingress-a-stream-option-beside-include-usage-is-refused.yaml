type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-stream-option-beside-include-usage-is-refused
summary: ingress refuses stream_options carrying an option outside the published subset, naming its path (ingress.rs)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"stream":true,"stream_options":{"include_usage":true,"include_obfuscation":false}}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: 'chat request field is outside the published subset: stream_options.include_obfuscation'
    turn_valid: null
