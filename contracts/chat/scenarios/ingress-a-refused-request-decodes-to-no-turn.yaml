type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-refused-request-decodes-to-no-turn
summary: a refused ingress request reports no model, instructions, tool choice, output limit or streaming
  choice
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":[{"type":"image_url","image_url":{"url":"https://example.invalid/a.png"}}]}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts:
    at_least: 1
    at_most: 1
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    model: null
    instructions: null
    tool_choice: null
    output_limit: null
    stream: null
    include_usage: null
    turn_valid: null
