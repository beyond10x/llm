type: ess-scenario/1
domain: llm.chat
scenario: outgoing-absent-settings-stay-absent
summary: outgoing absent settings stay absent
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hello"}],"tools":[]}}'
    protocol: chat-completions
    upstream_model: Qwen/Qwen3-8B
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["low","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: false
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: true
    # A setting the caller did not ask for is not sent with a default value.
    body_fields: [messages, model, stream]
    message_roles: [user]
    output_limit_field: null
    output_limit: null
    stream: false
    include_usage: null
