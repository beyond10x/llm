type: ess-scenario/1
domain: llm.chat
scenario: outgoing-an-undeclared-setting-is-refused
summary: outgoing an undeclared setting is refused
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hello"}],"tools":[],"sampling":{"temperature":0.5}}}'
    protocol: chat-completions
    upstream_model: Qwen/Qwen3-8B
    capabilities_json: '{"tools":false,"tool_choice":false,"temperature":false,"top_p":false,"reasoning_efforts":[],"context_window":32768,"max_output_tokens":4096}'
    streaming: true
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: false
    dispatch: not-sent
    # Refused before any request is built, not after a network round trip.
    error_code: unsupported
    error_message: binding does not support a requested tool or sampling setting
