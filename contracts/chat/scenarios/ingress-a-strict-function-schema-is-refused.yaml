type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-strict-function-schema-is-refused
summary: ingress refuses a tool function declaring strict true rather than dropping it (ingress.rs)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"tools":[{"type":"function","function":{"name":"lookup","description":"Look up","parameters":{"type":"object"},"strict":true}}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    # The neutral tool has no strict mode, so a client asking for one is told so.
    error_message: chat strict function schemas are outside the published subset
    turn_json: null
