type: ess-scenario/1
domain: llm.chat
scenario: outgoing-a-thinking-budget-is-refused
summary: an enabled thinking budget is refused because this wire has no budget to send it in (outgoing.rs, llm_core::wire_effort)
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.chat.ProjectRequest
  input:
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"controls":{"thinking":{"mode":"enabled","budget_tokens":2048}}}}'
    protocol: chat-completions
    upstream_model: Qwen/Qwen3-8B
    capabilities_json: '{"tools":true,"tool_choice":true,"temperature":true,"top_p":true,"reasoning_efforts":["none","high"],"context_window":32768,"max_output_tokens":4096}'
    streaming: false
  outcome: observed
assert:
- view: llm.chat.LastRequestProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastRequestProjection
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: Chat Completions has no thinking budget
    wire_request: null
