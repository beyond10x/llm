type: ess-scenario/1
domain: llm.chat
scenario: ingress-a-tool-that-is-not-a-function-is-refused
summary: ingress refuses a tool whose type is not function (ingress.rs decode_tools)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"tools":[{"type":"custom","custom":{"name":"x"}}]}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: unsupported
    error_message: chat tool type is outside the published subset
    turn_valid: null
