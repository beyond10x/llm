type: ess-scenario/1
domain: llm.chat
scenario: incoming-a-stream-without-a-finish-reason-is-refused
summary: incoming a stream without a finish reason is refused
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      data: {"choices":[{"index":0,"delta":{"content":"partial"}}]}

      data: [DONE]

    streamed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: false
    dispatch: accepted
    error_code: protocol
    error_message: chat completion stream carried no finish reason
    # The text already exposed to the caller is retained beside the refusal.
    stream_text: partial
    stop_reason: null
