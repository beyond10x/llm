type: ess-scenario/1
domain: llm.chat
scenario: ingress-contradictory-output-limits-are-refused
summary: ingress contradictory output limits are refused
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.DecodeIngress
  input:
    request_json: '{"model":"code","messages":[{"role":"user","content":"hi"}],"max_tokens":128,"max_completion_tokens":256}'
  outcome: observed
assert:
- view: llm.chat.LastIngressRequest
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastIngressRequest
  contains:
    accepted: false
    dispatch: not-sent
    error_code: invalid-request
    error_message: chat request output limits contradict each other
