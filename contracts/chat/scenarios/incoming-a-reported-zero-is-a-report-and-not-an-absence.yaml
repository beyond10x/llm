type: ess-scenario/1
domain: llm.chat
scenario: incoming-a-reported-zero-is-a-report-and-not-an-absence
summary: incoming a reported zero is a report and not an absence
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.chat.ProjectResponse
  input:
    response: |+
      data: {"choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

      data: {"choices":[],"usage":{"prompt_tokens":0,"completion_tokens":0,"completion_tokens_details":{"reasoning_tokens":0}}}

      data: [DONE]

    streamed: true
  outcome: observed
assert:
- view: llm.chat.LastResponseProjection
  counts: {at_least: 1, at_most: 1}
- view: llm.chat.LastResponseProjection
  contains:
    accepted: true
    usage_reported: true
    # The other direction of the same rule: a zero the upstream actually reported is a
    # report, and is not flattened into an absence.
    input_tokens: '0'
    output_tokens: '0'
    reasoning_output_tokens: '0'
    cached_input_tokens: null
