type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-refused-exchange-quotes-neither-the-answer-nor-the-refresh-token
summary: a 400 from the token endpoint refuses the renewal without quoting its body or the refresh token, and writes nothing
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 400
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: exchange-failed
    exchange_error: refused
    exchange_retriable: false
    resolver_error: refresh-rejected
    requests: 1
    file_unchanged: true
    stray_files: 0
    diagnostics_safe: true
