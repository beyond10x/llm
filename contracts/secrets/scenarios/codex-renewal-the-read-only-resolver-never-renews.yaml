type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-the-read-only-resolver-never-renews
summary: the read-only resolver refuses an expired login and never contacts the endpoint
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: ReadOnlyResolver
    expires_in_s: -60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    resolver_error: expired
    requests: 0
    file_unchanged: true
