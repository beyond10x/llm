type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-an-undated-login-is-still-refused-by-the-resolver
summary: the renewing resolver leaves an undated token alone and still refuses to send it
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: RenewingResolver
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    resolver_error: unavailable
    requests: 0
    file_unchanged: true
    resolved_renewed_token: null
