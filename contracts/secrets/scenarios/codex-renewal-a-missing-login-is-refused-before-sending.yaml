type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-missing-login-is-refused-before-sending
summary: no file at the path is refused as missing and nothing is sent
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
    fixture: MissingFile
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: missing
    resolver_error: missing
    requests: 0
    stray_files: 0
