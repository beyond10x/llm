type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-an-unwritable-directory-refuses-uncertain-and-leaves-the-login
summary: a directory that cannot take a new file refuses write-failed after the grant, as uncertain, and the login is kept
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
    fixture: UnwritableDirectory
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: write-failed
    resolver_error: refresh-uncertain
    requests: 1
    file_unchanged: true
    stray_files: 0
