type: ess-scenario/1
domain: llm.secrets
scenario: codex-read-an-undated-login-is-malformed
summary: the read-only resolver refuses an access token whose exp cannot be read as malformed, a configuration error no fallback takes
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: ReadOnlyResolver
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    resolver_error: malformed
    resolved_renewed_token: null
    requests: 0
    file_unchanged: true
    diagnostics_safe: true
