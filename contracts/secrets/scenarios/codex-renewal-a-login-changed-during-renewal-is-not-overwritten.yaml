type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-login-changed-during-renewal-is-not-overwritten
summary: a file rewritten while the refresh request was in flight is kept and the renewal refuses
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: true
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: null
    error_code: changed-during-renewal
    resolver_error: refresh-uncertain
    requests: 1
    file_unchanged: true
    file_spliced: false
    stray_files: 0
    diagnostics_safe: true
