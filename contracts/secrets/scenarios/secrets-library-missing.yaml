type: ess-scenario/1
domain: llm.secrets
scenario: secrets-library-missing
summary: a name the secrets library does not hold is missing
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbeSecretsLibrary
  input:
    reference: lab-llm-token
    content: "llm-fixture-private-marker\n raw content \n"
    replacement: null
    storage: Keychain
    entry_present: false
    tenant_admitted: true
    backend_fault: false
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: missing
    reread_error: null
    matches_content: null
    matches_replacement: null
    version_changed: null
    refresh_error: null
    diagnostics_safe: true
