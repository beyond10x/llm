type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-an-uncertain-grant-is-not-presented-again-for-the-same-login
summary: after a server failure left a grant uncertain the next resolve of the unchanged login refuses uncertain without sending
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: RenewingResolver
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 503
    answer: Rotated
    concurrent_change: false
    resolve_twice: true
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    resolver_error: refresh-uncertain
    requests: 1
    file_unchanged: true
