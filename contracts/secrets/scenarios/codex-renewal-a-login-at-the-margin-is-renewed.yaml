type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-login-at-the-margin-is-renewed
summary: a token expiring exactly at the margin is due and renewed
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 900
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: renewed
    requests: 1
    file_spliced: true
