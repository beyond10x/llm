type: ess-scenario/1
domain: llm.secrets
scenario: pointer-absent
summary: a JSON document with nothing at the caller-named pointer is missing, and its refusal names the reference
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbePointer
  input:
    token: llm-fixture-private-marker-access-token
    pointer: /claudeAiOauth/accessToken
    document: PointerAbsent
    known_reference: true
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: missing
    matches_content: null
    refusal_names_reference: true
    refusal_names_location: false
    diagnostics_safe: true
