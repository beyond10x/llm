type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-login-outside-the-margin-is-neither-sent-nor-written
summary: a token expiring one second after the margin is not due, nothing is sent and the file is untouched
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 901
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: not-due
    error_code: null
    requests: 0
    file_unchanged: true
    stray_files: 0
