type: ess-scenario/1
domain: llm.secrets
scenario: secrets-library-invalid-name
summary: a reference that is not a secrets name is an invalid reference
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbeSecretsLibrary
  input:
    reference: Lab_LLM_Token
    content: "llm-fixture-private-marker\n raw content \n"
    replacement: null
    storage: Keychain
    entry_present: true
    tenant_admitted: true
    backend_fault: false
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: invalid-reference
    reread_error: null
    matches_content: null
    matches_replacement: null
    version_changed: null
    refresh_error: null
    diagnostics_safe: true
