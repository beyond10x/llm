type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-server-failure-is-sent-once-and-not-retried
summary: a 503 from the token endpoint is final after one request and leaves the outcome uncertain
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 503
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: exchange-failed
    exchange_error: transport
    exchange_retriable: false
    resolver_error: refresh-uncertain
    requests: 1
    file_unchanged: true
    diagnostics_safe: true
