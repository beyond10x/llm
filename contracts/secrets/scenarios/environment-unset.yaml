type: ess-scenario/1
domain: llm.secrets
scenario: environment-unset
summary: an unset caller-named variable is missing, and its refusal names the reference, never the variable
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbeEnvironment
  input:
    content: "llm-fixture-private-marker\n raw content \n"
    variable_set: false
    known_reference: true
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: missing
    matches_content: null
    refusal_names_reference: true
    refusal_names_location: false
    diagnostics_safe: true
