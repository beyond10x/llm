type: ess-scenario/1
domain: llm.secrets
scenario: pointer-unbound-reference
summary: a reference bound to no pointer is missing, even when the document holds the token
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbePointer
  input:
    token: llm-fixture-private-marker-access-token
    pointer: /claudeAiOauth/accessToken
    document: TokenAtPointer
    known_reference: false
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: missing
    matches_content: null
    refusal_names_reference: true
    diagnostics_safe: true
