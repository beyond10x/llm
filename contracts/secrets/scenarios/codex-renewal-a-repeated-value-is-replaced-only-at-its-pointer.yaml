type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-repeated-value-is-replaced-only-at-its-pointer
summary: a refresh token copied under a second key is replaced at its pointer only and every other byte survives
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: RepeatedValue
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: renewed
    refresh_token_rotated: true
    file_spliced: true
