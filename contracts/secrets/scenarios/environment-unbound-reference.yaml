type: ess-scenario/1
domain: llm.secrets
scenario: environment-unbound-reference
summary: a reference bound to no variable is missing even when the fixture variable is set
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbeEnvironment
  input:
    content: "llm-fixture-private-marker\n raw content \n"
    variable_set: true
    known_reference: false
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: missing
    matches_content: null
    refusal_names_reference: true
    refusal_names_location: false
    diagnostics_safe: true
