type: ess-scenario/1
domain: llm.secrets
scenario: pointer-token-at-pointer
summary: a token at a caller-named JSON pointer of a protected file resolves to exactly that string, and is read-only
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbePointer
  input:
    token: llm-fixture-private-marker-access-token
    pointer: /claudeAiOauth/accessToken
    document: TokenAtPointer
    known_reference: true
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: null
    reread_error: null
    matches_content: true
    version_changed: false
    refresh_error: refresh-unsupported
    refusal_names_reference: null
    diagnostics_safe: true
