type: ess-scenario/1
domain: llm.secrets
scenario: secrets-library-unsupported-read
summary: a backend without read capability is unsupported-platform
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbeSecretsLibrary
  input:
    reference: lab-llm-token
    content: "llm-fixture-private-marker\n raw content \n"
    replacement: null
    storage: NoReadCapability
