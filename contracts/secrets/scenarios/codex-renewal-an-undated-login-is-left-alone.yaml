type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-an-undated-login-is-left-alone
summary: an access token whose exp cannot be read is left alone, no refresh token is spent and nothing is written
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: undated
    error_code: null
    requests: 0
    file_unchanged: true
