type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-truncated-login-is-refused-as-unavailable-before-sending
summary: a login cut off mid-document is refused as unavailable, as the read rule refuses it, nothing is sent and the file is kept
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
    fixture: Truncated
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: unavailable
    resolver_error: unavailable
    requests: 0
    file_unchanged: true
