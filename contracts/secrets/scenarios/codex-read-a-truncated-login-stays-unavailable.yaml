type: ess-scenario/1
domain: llm.secrets
scenario: codex-read-a-truncated-login-stays-unavailable
summary: the read-only resolver refuses a login cut off mid-document as unavailable, since a file being rewritten in place reads that way
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: ReadOnlyResolver
    expires_in_s: 3600
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
    fixture: Truncated
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    resolver_error: unavailable
    resolved_renewed_token: null
    requests: 0
    file_unchanged: true
    diagnostics_safe: true
