type: ess-scenario/1
domain: llm.secrets
scenario: keychain-same-value-retains-version
summary: keychain same value retains version
timeline:
- at: '2026-09-19T12:00:00Z'
  command: llm.secrets.ProbeKeychain
  input:
    content: "llm-fixture-private-marker\n raw content \n"
    replacement: "llm-fixture-private-marker\n raw content \n"
    entry_present: true
    known_reference: true
    backend_fault: false
    oversized: false
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: null
    reread_error: null
    matches_content: true
    matches_replacement: true
    version_changed: false
    refresh_error: refresh-unsupported
    diagnostics_safe: true
