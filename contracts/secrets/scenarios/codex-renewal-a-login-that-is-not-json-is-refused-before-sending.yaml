type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-login-that-is-not-json-is-refused-before-sending
summary: a whole document that is not JSON is refused as malformed, nothing is sent and the file is kept
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
    fixture: NotJson
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: malformed
    resolver_error: malformed
    requests: 0
    file_unchanged: true
