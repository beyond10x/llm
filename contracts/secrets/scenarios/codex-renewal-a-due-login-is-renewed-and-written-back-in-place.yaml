type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-due-login-is-renewed-and-written-back-in-place
summary: a login inside its margin is renewed by one refresh grant and only its token values change on disk, mode kept, no stray file
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: renewed
    error_code: null
    requests: 1
    request_well_formed: true
    refresh_token_rotated: true
    file_unchanged: false
    file_spliced: true
    mode_kept: true
    stray_files: 0
    diagnostics_safe: true
