type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-an-answer-without-a-refresh-token-keeps-the-one-on-disk
summary: an answer carrying only an access token replaces it and leaves the refresh and id tokens as they were
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: AccessOnly
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: renewed
    requests: 1
    refresh_token_rotated: false
    file_spliced: true
    diagnostics_safe: true
