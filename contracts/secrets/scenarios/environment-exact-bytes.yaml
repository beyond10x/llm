type: ess-scenario/1
domain: llm.secrets
scenario: environment-exact-bytes
summary: a caller-named environment variable resolves to its exact bytes, trailing newline included, and is read-only
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbeEnvironment
  input:
    content: "llm-fixture-private-marker\n raw content \n"
    variable_set: true
    known_reference: true
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: null
    reread_error: null
    matches_content: true
    matches_replacement: true
    version_changed: false
    refresh_error: refresh-unsupported
    refusal_names_reference: null
    diagnostics_safe: true
