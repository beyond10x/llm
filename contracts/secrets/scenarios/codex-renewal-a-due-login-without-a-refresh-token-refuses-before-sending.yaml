type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-due-login-without-a-refresh-token-refuses-before-sending
summary: a due login with nothing at /tokens/refresh_token refuses naming that pointer before anything is sent
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: false
    group_readable: false
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: no-refresh-token
    resolver_error: missing
    requests: 0
    refusal_names_pointer: true
    file_unchanged: true
    diagnostics_safe: true
