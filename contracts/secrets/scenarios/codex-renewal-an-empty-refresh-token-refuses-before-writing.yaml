type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-an-empty-refresh-token-refuses-before-writing
summary: an answer with an empty refresh token refuses and the file is untouched
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: false
    answer_status: 200
    answer: EmptyRefresh
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    error_code: answer-invalid-refresh-token
    resolver_error: refresh-uncertain
    requests: 1
    file_unchanged: true
    diagnostics_safe: true
