type: ess-scenario/1
domain: llm.secrets
scenario: codex-renewal-a-group-readable-login-keeps-its-mode
summary: a 0640 login is renewed and stays 0640
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.RenewCodexLogin
  input:
    entry: Renew
    expires_in_s: 60
    margin_s: 900
    layout: Codex
    refresh_token_present: true
    group_readable: true
    answer_status: 200
    answer: Rotated
    concurrent_change: false
  outcome: observed
assert:
- view: llm.secrets.LastRenewal
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastRenewal
  contains:
    outcome: renewed
    file_spliced: true
    mode_kept: true
    stray_files: 0
