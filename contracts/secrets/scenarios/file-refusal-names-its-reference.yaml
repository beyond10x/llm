type: ess-scenario/1
domain: llm.secrets
scenario: file-refusal-names-its-reference
summary: a missing file's refusal names the reference that refused, never the path or the value
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.secrets.ProbeFile
  input:
    content: "llm-fixture-private-marker\n raw content \n"
    replacement: null
    shape: Missing
    public_readable: false
    parent_writable: false
    known_reference: true
    oversized: false
  outcome: observed
assert:
- view: llm.secrets.LastProbe
  counts:
    at_least: 1
    at_most: 1
- view: llm.secrets.LastProbe
  contains:
    error_code: missing
    refusal_names_reference: true
    refusal_names_location: false
    diagnostics_safe: true
