type: ess-scenario/1
domain: llm.responses
scenario: a-rate-limited-response-is-its-own-class
summary: a rate limited response is its own class
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.responses.DecodeStream
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    stream_json: '[{"type":"error","code":"rate_limit_exceeded","message":"SECRET-UPSTREAM-TEXT"}]'
  outcome: observed
assert:
- view: llm.responses.LastStream
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastStream
  contains:
    accepted: false
    error_code: rate-limited
    error_message: the provider asked for less traffic
    dispatch: accepted
    final_usage: false
