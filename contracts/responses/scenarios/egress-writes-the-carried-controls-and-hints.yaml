    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"}],"tools":[{"name":"file_read","description":"d","input_schema":{"type":"object"}}],"sampling":{"reasoning_effort":"low"},"controls":{"parallel_tool_calls":false,"hints":{"prompt_cache_key":"conv-1","verbosity":"medium","reasoning_summary":"detailed"}}}}'
