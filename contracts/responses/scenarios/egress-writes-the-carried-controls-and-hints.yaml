    encoded_body: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"Hi","type":"input_text"}],"role":"user","type":"message"}],"model":"example/Small-Model","parallel_tool_calls":false,"prompt_cache_key":"conv-1","reasoning":{"effort":"low","summary":"detailed"},"store":false,"stream":true,"text":{"verbosity":"medium"},"tools":[{"description":"d","name":"file_read","parameters":{"type":"object"},"strict":false,"type":"function"}]}'
