type: ess-scenario/1
domain: llm.responses
scenario: egress-a-cache-key-equal-to-the-conversation-is-sent-once
summary: a turn whose prompt_cache_key is the conversation identifier sends that key and round-trips
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"}],"tools":[],"controls":{"hints":{"prompt_cache_key":"conv-1"}}}}'
    conversation_id: conv-1
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: true
    error_code: null
    prompt_cache_key: conv-1
    omitted_advisories: []
    request_preserved: true
