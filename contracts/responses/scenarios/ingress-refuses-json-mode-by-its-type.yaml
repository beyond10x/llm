type: ess-scenario/1
domain: llm.responses
scenario: ingress-refuses-json-mode-by-its-type
summary: a text.format of type json_object asks for any JSON at all, which no JSON Schema the neutral turn holds says, and is refused by its type
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.Ingest
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    body_json: '{"model":"example/Small-Model","input":[{"type":"message","role":"user","content":[{"type":"input_text","text":"Hi"}]}],"tools":[{"type":"function","name":"file_read","description":"d","parameters":{"type":"object"},"strict":false}],"stream":true,"store":false,"include":["reasoning.encrypted_content"],"text":{"verbosity":"low","format":{"type":"json_object"}}}'
  outcome: observed
assert:
- view: llm.responses.LastIngestion
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastIngestion
  contains:
    accepted: false
    error_code: unsupported
    error_message: '`text.format` of type `json_object` is outside the pinned subset: the neutral output format is a JSON Schema'
    turn_json: null
    reprojected: false
    body_preserved: false
