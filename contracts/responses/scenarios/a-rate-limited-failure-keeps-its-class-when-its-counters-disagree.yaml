type: ess-scenario/1
domain: llm.responses
scenario: a-rate-limited-failure-keeps-its-class-when-its-counters-disagree
summary: a rate limited failure keeps its class when its counters disagree
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.responses.DecodeStream
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    stream_json: '[{"type":"response.failed","response":{"id":"resp_1","model":"example/Small-Model","status":"failed","error":{"code":"rate_limit_exceeded","message":"SECRET-UPSTREAM-TEXT"},"usage":{"input_tokens":10,"input_tokens_details":{"cached_tokens":11}}}}]'
  outcome: observed
assert:
- view: llm.responses.LastStream
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastStream
  contains:
    accepted: false
    error_code: rate-limited
    error_message: the provider asked for less traffic
    dispatch: accepted
    upstream_model: example/Small-Model
    response_id: resp_1
    final_usage: true
    input_tokens: null
    cached_input_tokens: null
