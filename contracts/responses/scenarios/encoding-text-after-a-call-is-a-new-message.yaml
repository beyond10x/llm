type: ess-scenario/1
domain: llm.responses
scenario: encoding-text-after-a-call-is-a-new-message
summary: text streamed after a call opens a new message item, so each message shows its own text once
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.EncodeIngress
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"tool-calls"},"items":[{"kind":"assistant-text","text":"First."},{"kind":"tool-call","call_id":"call-1","name":"clock","arguments":{}},{"kind":"assistant-text","text":"Second."}],"observation":{"binding":{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"},"response_id":"resp_gateway_fixture","final_usage":true}}}'
    events_json: '[{"kind":"text-delta","text":"First."},{"kind":"tool-call-started","call_id":"call-1","name":"clock"},{"kind":"tool-arguments-delta","call_id":"call-1","delta":"{}"},{"kind":"text-delta","text":"Second."}]'
    streamed: true
  outcome: observed
assert:
- view: llm.responses.LastIngressEncoding
  counts: {at_least: 1, at_most: 1}
- view: llm.responses.LastIngressEncoding
  contains:
    accepted: true
    payload_types:
    - response.created
    - response.in_progress
    - response.output_item.added
    - response.content_part.added
    - response.output_text.delta
    - response.output_item.added
    - response.function_call_arguments.delta
    - response.output_item.added
    - response.content_part.added
    - response.output_text.delta
    - response.output_text.done
    - response.content_part.done
    - response.output_item.done
    - response.function_call_arguments.done
    - response.output_item.done
    - response.output_text.done
    - response.content_part.done
    - response.output_item.done
    - response.completed
    decoded_stream_events:
    - text-delta:First.
    - tool-call-started:call-1:clock
    - tool-arguments-delta:call-1:{}
    - text-delta:Second.
    events_preserved: true
    outcome_preserved: true
