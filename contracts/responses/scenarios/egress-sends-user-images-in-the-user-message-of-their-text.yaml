type: ess-scenario/1
domain: llm.responses
scenario: egress-sends-user-images-in-the-user-message-of-their-text
summary: user images are input_image parts with detail auto, inline bytes as a base64 data URL, in one user message with the text beside them in item order, and read back as the same turn (story:image-input)
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"What is in these pictures?"},{"kind":"user-image","source":{"kind":"bytes","media_type":"image/png","data":"iVBORw0KGgo="}},{"kind":"user-image","source":{"kind":"url","url":"https://images.example/a.png"}}],"tools":[]}}'
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: true
    error_code: null
    encoded_body: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"What is in these pictures?","type":"input_text"},{"detail":"auto","image_url":"data:image/png;base64,iVBORw0KGgo=","type":"input_image"},{"detail":"auto","image_url":"https://images.example/a.png","type":"input_image"}],"role":"user","type":"message"}],"model":"example/Small-Model","store":false,"stream":true,"tools":[]}'
    request_preserved: true
