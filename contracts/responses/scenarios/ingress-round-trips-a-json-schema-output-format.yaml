type: ess-scenario/1
domain: llm.responses
scenario: ingress-round-trips-a-json-schema-output-format
summary: a JSON Schema text.format beside verbosity is the turn's output format, and the turn projects back to the same body
timeline:
- at: '2026-11-04T12:00:00Z'
  command: llm.responses.Ingest
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    body_json: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"Hi","type":"input_text"}],"role":"user","type":"message"}],"model":"example/Small-Model","store":false,"stream":true,"text":{"format":{"name":"place","schema":{"properties":{"city":{"type":"string"}},"required":["city"],"type":"object"},"strict":false,"type":"json_schema"},"verbosity":"high"},"tools":[]}'
  outcome: observed
assert:
- view: llm.responses.LastIngestion
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastIngestion
  contains:
    accepted: true
    error_code: null
    omitted_advisories: []
    reprojected: true
    body_preserved: true
    turn_json: '{"format":"llm.turn/4","request":{"controls":{"hints":{"verbosity":"high"},"output_format":{"name":"place","schema":{"properties":{"city":{"type":"string"}},"required":["city"],"type":"object"},"strict":false}},"instructions":"","items":[{"kind":"user-text","text":"Hi"}],"model":"small","tools":[]}}'
