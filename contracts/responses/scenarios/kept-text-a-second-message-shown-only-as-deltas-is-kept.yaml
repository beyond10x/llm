type: ess-scenario/1
domain: llm.responses
scenario: kept-text-a-second-message-shown-only-as-deltas-is-kept
summary: a second message shown only as deltas is kept beside a streamed first message
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.responses.DecodeStream
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    stream_json: '[{"type":"response.output_text.delta","item_id":"msg_b","output_index":1,"content_index":0,"delta":"The answer is 42."},{"type":"response.output_text.delta","item_id":"msg_a","output_index":0,"content_index":0,"delta":"Working on it."},{"type":"response.output_item.done","output_index":0,"item":{"type":"message","id":"msg_a","role":"assistant","content":[{"type":"output_text","text":"Working on it."}]}},{"type":"response.completed","response":{"status":"completed","output":[]}}]'
  outcome: observed
assert:
- view: llm.responses.LastStream
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastStream
  contains:
    accepted: true
    stop_reason: end-turn
    items_json: '[{"kind":"assistant-text","text":"Working on it."},{"kind":"assistant-text","text":"The answer is 42."}]'
    stream_events:
    - text-delta:The answer is 42.
    - text-delta:Working on it.
