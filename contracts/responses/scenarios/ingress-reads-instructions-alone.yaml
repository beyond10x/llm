type: ess-scenario/1
domain: llm.responses
scenario: ingress-reads-instructions-alone
summary: a top-level instructions string is the instructions, sent back as the developer message
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.Ingest
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    body_json: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"Hi","type":"input_text"}],"role":"user","type":"message"}],"instructions":"Be brief","model":"example/Small-Model","store":false,"stream":true,"tools":[{"description":"d","name":"file_read","parameters":{"type":"object"},"strict":false,"type":"function"}]}'
  outcome: observed
assert:
- view: llm.responses.LastIngestion
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastIngestion
  contains:
    accepted: true
    error_code: null
    instructions: Be brief
    reprojected: true
    body_preserved: false
    turn_json: '{"format":"llm.turn/3","request":{"instructions":"Be brief","items":[{"kind":"user-text","text":"Hi"}],"model":"small","tools":[{"description":"d","input_schema":{"type":"object"},"name":"file_read"}]}}'
