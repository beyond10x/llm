type: ess-scenario/1
domain: llm.responses
scenario: kept-text-shown-text-more-than-one-message-could-be-is-carried-in-none
summary: shown text that more than one message could be overwrites none, the server's messages stay as sent, and the caller is warned
timeline:
- at: '2026-10-20T12:00:00Z'
  command: llm.responses.DecodeStream
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    stream_json: '[{"type":"response.output_text.delta","item_id":"msg_2","content_index":0,"delta":"answer"},{"type":"response.completed","response":{"status":"completed","output":[{"type":"message","role":"assistant","content":[{"type":"output_text","text":"preamble"}]},{"type":"message","role":"assistant","content":[{"type":"output_text","text":"the final text"}]}]}}]'
  outcome: observed
assert:
- view: llm.responses.LastStream
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastStream
  contains:
    accepted: true
    stop_reason: end-turn
    items_json: '[{"kind":"assistant-text","text":"preamble"},{"kind":"assistant-text","text":"the final text"}]'
    stream_events:
    - text-delta:answer
    - warning:shown-text-unpaired
