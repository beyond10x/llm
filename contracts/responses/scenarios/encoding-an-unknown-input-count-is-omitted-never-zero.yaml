type: ess-scenario/1
domain: llm.responses
scenario: encoding-an-unknown-input-count-is-omitted-never-zero
summary: an input count the upstream never reported is left out and reads back unknown, never zero
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.EncodeIngress
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"end-turn"},"items":[{"kind":"assistant-text","text":"Hi"}],"observation":{"binding":{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"},"upstream_model":"example/Small-Model","response_id":"resp_gateway_fixture","usage":{"output_tokens":5},"final_usage":true}}}'
    events_json: '[{"kind":"text-delta","text":"Hi"}]'
    streamed: true
  outcome: observed
assert:
- view: llm.responses.LastIngressEncoding
  counts: {at_least: 1, at_most: 1}
- view: llm.responses.LastIngressEncoding
  contains:
    accepted: true
    # No `input_tokens`, and no `total_tokens` derived from an unknown part.
    usage_json: '{"output_tokens":5}'
    decoded_accepted: true
    decoded_usage_json: '{"output_tokens":5}'
    outcome_preserved: true
