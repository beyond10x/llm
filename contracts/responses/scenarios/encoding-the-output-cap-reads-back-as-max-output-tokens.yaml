type: ess-scenario/1
domain: llm.responses
scenario: encoding-the-output-cap-reads-back-as-max-output-tokens
summary: a turn stopped by the output cap ends incomplete and reads back as max output tokens
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.EncodeIngress
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"max-output-tokens"},"items":[{"kind":"assistant-text","text":"The file says"}],"observation":{"binding":{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"},"upstream_model":"example/Small-Model","response_id":"resp_upstream_1","usage":{"input_tokens":12,"output_tokens":4},"final_usage":true}}}'
    events_json: '[{"kind":"text-delta","text":"The file says"}]'
    streamed: true
  outcome: observed
assert:
- view: llm.responses.LastIngressEncoding
  counts: {at_least: 1, at_most: 1}
- view: llm.responses.LastIngressEncoding
  contains:
    accepted: true
    status: incomplete
    incomplete_reason: max_output_tokens
    decoded_accepted: true
    decoded_stop_reason: max-output-tokens
    events_preserved: true
    outcome_preserved: true
