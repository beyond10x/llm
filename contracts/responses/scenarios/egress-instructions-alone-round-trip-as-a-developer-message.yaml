type: ess-scenario/1
domain: llm.responses
scenario: egress-instructions-alone-round-trip-as-a-developer-message
summary: the turn read from a top-level instructions projects one developer message and reads back equal
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/3","request":{"instructions":"Be brief","items":[{"kind":"user-text","text":"Hi"}],"model":"small","tools":[{"description":"d","input_schema":{"type":"object"},"name":"file_read"}]}}'
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: true
    error_code: null
    input_json: '[{"content":[{"text":"Be brief","type":"input_text"}],"role":"developer","type":"message"},{"content":[{"text":"Hi","type":"input_text"}],"role":"user","type":"message"}]'
    request_preserved: true
