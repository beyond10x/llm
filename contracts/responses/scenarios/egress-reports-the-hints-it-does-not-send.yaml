type: ess-scenario/1
domain: llm.responses
scenario: egress-reports-the-hints-it-does-not-send
summary: the prompt cache and unforwarded hints are omitted from the body and reported in order
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/4","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"}],"tools":[],"controls":{"hints":{"prompt_cache":{},"verbosity":"low","unforwarded":["client-metadata","input-item-ids"]}}}}'
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: true
    error_code: null
    encoded_body: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"Hi","type":"input_text"}],"role":"user","type":"message"}],"model":"example/Small-Model","store":false,"stream":true,"text":{"verbosity":"low"},"tools":[]}'
    omitted_advisories:
    - prompt-cache
    - input-item-ids
    - client-metadata
    request_preserved: false
