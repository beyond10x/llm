type: ess-scenario/1
domain: llm.responses
scenario: a-metadata-event-is-not-conversation-state
summary: a response.metadata event is interpreted, not preserved as an item a next request would replay (story:codex-stream-metadata-is-not-replayed)
timeline:
- at: '2026-10-29T12:00:00Z'
  command: llm.responses.DecodeStream
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    stream_json: '[{"type":"response.metadata","metadata":{"fixture":"synthetic"}},{"type":"response.completed","response":{"status":"completed"}}]'
  outcome: observed
assert:
- view: llm.responses.LastStream
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastStream
  contains:
    accepted: true
    stream_events: []
    items_json: '[]'
    stop_reason: end-turn
