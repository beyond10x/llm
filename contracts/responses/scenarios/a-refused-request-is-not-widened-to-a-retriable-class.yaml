type: ess-scenario/1
domain: llm.responses
scenario: a-refused-request-is-not-widened-to-a-retriable-class
summary: a refused request is not widened to a retriable class
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.responses.DecodeStream
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    stream_json: '[{"type":"error","code":"invalid_prompt","message":"SECRET-UPSTREAM-TEXT"}]'
  outcome: observed
assert:
- view: llm.responses.LastStream
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastStream
  contains:
    accepted: false
    error_code: refused
    error_message: the provider refused this request
    dispatch: accepted
