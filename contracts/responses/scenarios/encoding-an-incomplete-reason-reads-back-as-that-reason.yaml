type: ess-scenario/1
domain: llm.responses
scenario: encoding-an-incomplete-reason-reads-back-as-that-reason
summary: an incomplete turn names its reason and reads back with that reason
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.EncodeIngress
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"incomplete","reason":"content_filter"},"items":[{"kind":"assistant-text","text":"I can"}],"observation":{"binding":{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"},"upstream_model":"example/Small-Model","response_id":"resp_upstream_1","final_usage":true}}}'
    events_json: '[{"kind":"text-delta","text":"I can"}]'
    streamed: true
  outcome: observed
assert:
- view: llm.responses.LastIngressEncoding
  counts: {at_least: 1, at_most: 1}
- view: llm.responses.LastIngressEncoding
  contains:
    accepted: true
    status: incomplete
    incomplete_reason: content_filter
    # No usage was reported, so none is answered.
    usage_json: null
    decoded_accepted: true
    decoded_stop_reason: incomplete
    decoded_usage_json: null
    events_preserved: true
    outcome_preserved: true
