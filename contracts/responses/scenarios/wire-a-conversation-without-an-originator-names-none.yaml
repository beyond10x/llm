type: ess-scenario/1
domain: llm.responses
scenario: wire-a-conversation-without-an-originator-names-none
summary: a conversation whose caller named no originator sends no originator header
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"}],"tools":[]}}'
    conversation_id: conv-1
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: true
    error_code: null
    prompt_cache_key: conv-1
    request_headers:
    - 'accept: text/event-stream'
    - 'content-type: application/json'
    - 'session-id: conv-1'
    - 'x-client-request-id: conv-1-0'
