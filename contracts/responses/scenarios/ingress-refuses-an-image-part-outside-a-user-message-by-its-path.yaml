type: ess-scenario/1
domain: llm.responses
scenario: ingress-refuses-an-image-part-outside-a-user-message-by-its-path
summary: an input_image part in a developer message is refused by its path, without quoting the URL (story:image-input)
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.responses.Ingest
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    body_json: '{"model":"example/Small-Model","input":[{"type":"message","role":"developer","content":[{"type":"input_image","image_url":"https://images.example/private.png?signature=fixture-signature","detail":"auto"}]},{"type":"message","role":"user","content":[{"type":"input_text","text":"Hello"}]}],"tools":[],"stream":true,"store":false,"include":["reasoning.encrypted_content"]}'
  outcome: observed
assert:
- view: llm.responses.LastIngestion
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastIngestion
  contains:
    accepted: false
    error_code: unsupported
    error_message: 'an image part is carried only in a user message: input[].content[]'
    turn_json: null
