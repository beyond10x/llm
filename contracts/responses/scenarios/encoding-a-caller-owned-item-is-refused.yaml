type: ess-scenario/1
domain: llm.responses
scenario: encoding-a-caller-owned-item-is-refused
summary: an outcome carrying a tool result, which the caller owns, is refused rather than answered
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.responses.EncodeIngress
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"end-turn"},"items":[{"kind":"assistant-text","text":"Hi"},{"kind":"tool-result","call_id":"call-1","output":"noon","failed":false}],"observation":{"binding":{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"},"final_usage":true}}}'
    streamed: false
  outcome: observed
assert:
- view: llm.responses.LastIngressEncoding
  counts: {at_least: 1, at_most: 1}
- view: llm.responses.LastIngressEncoding
  contains:
    accepted: false
    error_code: protocol
    error_message: model outcome contains caller-owned content
    output_json: null
