type: ess-scenario/1
domain: llm.responses
scenario: a-foreign-text-body-reads-into-a-neutral-turn
summary: a foreign text body reads into a neutral turn
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.responses.Ingest
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    body_json: '{"model":"example/Small-Model","input":[{"type":"message","role":"developer","content":[{"type":"input_text","text":"Be brief"}]},{"type":"message","role":"user","content":[{"type":"input_text","text":"Hello"}]}],"tools":[],"stream":true,"store":false,"include":["reasoning.encrypted_content"]}'
  outcome: observed
assert:
- view: llm.responses.LastIngestion
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastIngestion
  contains:
    accepted: true
    error_code: null
    model: small
    instructions: Be brief
    item_kinds:
    - user-text
    tool_names: []
    reprojected: true
    body_preserved: true
    turn_json: '{"format":"llm.turn/3","request":{"instructions":"Be brief","items":[{"kind":"user-text","text":"Hello"}],"model":"small","tools":[]}}'
