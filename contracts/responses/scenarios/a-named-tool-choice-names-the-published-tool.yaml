type: ess-scenario/1
domain: llm.responses
scenario: a-named-tool-choice-names-the-published-tool
summary: a named tool choice names the published tool
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"}],"tools":[{"name":"file_read","description":"Read one file","input_schema":{"type":"object"}}],"tool_choice":{"named":"file_read"}}}'
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: true
    tool_choice: '{"name":"file_read","type":"function"}'
    tool_names:
    - file_read
    request_preserved: true
