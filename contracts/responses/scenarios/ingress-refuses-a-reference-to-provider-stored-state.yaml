type: ess-scenario/1
domain: llm.responses
scenario: ingress-refuses-a-reference-to-provider-stored-state
summary: an item_reference points at state the provider stored, which store false never creates, so ingress refuses it rather than carrying it
timeline:
- at: '2026-09-26T12:00:00Z'
  command: llm.responses.Ingest
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    body_json: '{"model":"example/Small-Model","input":[{"type":"message","role":"user","content":[{"type":"input_text","text":"Hi"}]},{"type":"item_reference","id":"msg_stored_elsewhere"}],"tools":[],"stream":true,"store":false,"include":["reasoning.encrypted_content"]}'
  outcome: observed
assert:
- view: llm.responses.LastIngestion
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastIngestion
  contains:
    accepted: false
    error_code: unsupported
    turn_json: null
    item_kinds: []
    forward_refusal: null
    bound_input_json: null
