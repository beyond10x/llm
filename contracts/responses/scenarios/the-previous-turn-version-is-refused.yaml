type: ess-scenario/1
domain: llm.responses
scenario: the-previous-turn-version-is-refused
summary: a llm.turn/2 envelope predates the unattributed variant and is refused rather than read
timeline:
- at: '2026-09-26T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/2","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"}],"tools":[]}}'
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: false
    error_code: invalid-request
    input_json: null
