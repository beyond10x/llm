    model_reported: example/Small-Model
    response_id: resp_upstream_1
    usage_json: null
    # The reasoning item verbatim, then each item under an identifier from its position.
    output_json: '[{"encrypted_content":"gAAAAABfixture","id":"rs_upstream_1","summary":[],"type":"reasoning"},{"content":[{"annotations":[],"text":"Let me check.","type":"output_text"}],"id":"msg_resp_gateway_fixture_1","role":"assistant","status":"completed","type":"message"},{"arguments":"{}","call_id":"call-1","id":"fc_resp_gateway_fixture_2","name":"clock","status":"completed","type":"function_call"}]'
    decoded_accepted: true
    decoded_stop_reason: tool-calls
    decoded_stream_events: []
    outcome_preserved: true
