type: ess-scenario/1
domain: llm.responses
scenario: egress-leaves-out-a-saved-metadata-item
summary: a response.metadata item saved under 0.16.0 is left out of the request and every other item is sent
timeline:
- at: '2026-10-29T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"","items":[{"kind":"user-text","text":"Hi"},{"kind":"opaque","provenance":{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"},"payload":{"type":"reasoning","id":"rs_1","summary":[]}},{"kind":"assistant-text","text":"Hello"},{"kind":"opaque","provenance":{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"},"payload":{"type":"response.metadata","sequence_number":30,"metadata":{}}},{"kind":"user-text","text":"Again"}],"tools":[]}}'
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
