    input_json: '[{"content":[{"text":"Hi","type":"input_text"}],"role":"user","type":"message"},{"id":"rs_1","summary":[],"type":"reasoning"},{"content":[{"text":"Hello","type":"output_text"}],"role":"assistant","type":"message"},{"content":[{"text":"Again","type":"input_text"}],"role":"user","type":"message"}]'
    request_preserved: false
