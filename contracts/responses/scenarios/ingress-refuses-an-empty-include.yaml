type: ess-scenario/1
domain: llm.responses
scenario: ingress-refuses-an-empty-include
summary: ingress refuses an empty include rather than adding one nobody asked for
timeline:
- at: '2026-09-20T12:00:00Z'
  command: llm.responses.Ingest
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    body_json: '{"model":"example/Small-Model","input":[{"type":"message","role":"user","content":[{"type":"input_text","text":"Hi"}]}],"tools":[],"stream":true,"store":false,"include":[]}'
  outcome: observed
assert:
- view: llm.responses.LastIngestion
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastIngestion
  contains:
    accepted: false
    error_code: unsupported
    turn_json: null
    reprojected: false
    body_preserved: false
