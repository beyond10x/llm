type: ess-scenario/1
domain: llm.responses
scenario: wire-the-encoded-body-is-the-bytes-the-client-sends
summary: the encoded body is the bytes the client sends, and no conversation sends no identity
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.responses.Project
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    turn_json: '{"format":"llm.turn/3","request":{"model":"small","instructions":"Keep instructions","items":[{"kind":"user-text","text":"Keep message"}],"tools":[],"max_output_tokens":128}}'
  outcome: observed
assert:
- view: llm.responses.LastProjection
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastProjection
  contains:
    accepted: true
    error_code: null
    encoded_body: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"Keep instructions","type":"input_text"}],"role":"developer","type":"message"},{"content":[{"text":"Keep message","type":"input_text"}],"role":"user","type":"message"}],"max_output_tokens":128,"model":"example/Small-Model","store":false,"stream":true,"tools":[]}'
    body_fields:
    - include
    - input
    - max_output_tokens
    - model
    - store
    - stream
    - tools
    prompt_cache_key: null
    request_headers:
    - 'accept: text/event-stream'
    - 'content-type: application/json'
    request_preserved: true
