type: ess-scenario/1
domain: llm.responses
scenario: wire-a-streamed-unknown-output-item-is-preserved-with-a-warning
summary: an unknown output item streamed before an empty terminal output is kept and warned about once
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.responses.DecodeStream
  input:
    binding_json: '{"protocol":"responses","provider":"my-lab","account":"local","endpoint":"local-vllm","model":"small","binding_revision":"rev-1"}'
    upstream_model: example/Small-Model
    stream_json: '[{"type":"response.output_item.done","output_index":0,"item":{"type":"web_search_call","id":"ws_1"}},{"type":"response.completed","response":{"status":"completed","output":[]}}]'
  outcome: observed
assert:
- view: llm.responses.LastStream
  counts:
    at_least: 1
    at_most: 1
- view: llm.responses.LastStream
  contains:
    accepted: true
    stream_events:
    - warning:unknown-output-item
    items_json: '[{"kind":"opaque","payload":{"id":"ws_1","type":"web_search_call"},"provenance":{"account":"local","binding_revision":"rev-1","endpoint":"local-vllm","model":"small","protocol":"responses","provider":"my-lab"}}]'
    stop_reason: end-turn
