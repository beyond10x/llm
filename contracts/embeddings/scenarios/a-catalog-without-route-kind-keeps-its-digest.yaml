type: ess-scenario/1
domain: llm.embeddings
scenario: a-catalog-without-route-kind-keeps-its-digest
summary: the example catalog, written before routes had a kind, keeps the digest the routing scenarios pin; its route is a turn route, so an embed request to it is refused before I/O
timeline:
- at: '2026-11-06T12:00:00Z'
  command: llm.embeddings.Embed
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      # Replace the endpoint, upstream model name and capabilities with your deployment's facts.
      format = "llm.catalog/1"

      [[providers]]
      id = "my-lab"
      category = "self-hosted"

      [[accounts]]
      id = "local"
      provider_id = "my-lab"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[accounts]]
      id = "remote"
      provider_id = "my-lab"
      auth_kind = "bearer"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-token"

      [[endpoints]]
      id = "local-vllm"
      account_id = "local"
      base_url = "http://127.0.0.1:8000/v1"

      [[endpoints]]
      id = "remote-models"
      account_id = "remote"
      base_url = "https://models.example.invalid/v1"

      [[models]]
      id = "small"
      upstream_name = "example/Small-Model"

      [[models]]
      id = "large"
      upstream_name = "example/Large-Model"

      [[serving_models]]
      id = "local-small"
      endpoint_id = "local-vllm"
      model_id = "small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[serving_models]]
      id = "remote-large"
      endpoint_id = "remote-models"
      model_id = "large"
      protocol = "responses"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = true
      reasoning_efforts = ["medium", "high"]
      context_window = 32768
      max_output_tokens = 8192

      [[routes]]
      id = "coding"
      alias = "code"
      # Omission is false. Set true to permit selection from the explicitly named alternatives.
      fallback_enabled = false

      [[targets]]
      id = "coding-primary"
      route_id = "coding"
      serving_model_id = "local-small"
      position = 0

      [[targets]]
      id = "coding-secondary"
      route_id = "coding"
      serving_model_id = "remote-large"
      position = 1
    request_json: '{"request_id":"req-1","alias":"code","texts":["one"],"timeout_ms":10000}'
    program_json: '{"start_unix_ms":1762430400000,"answers":[{"status":500}]}'
  outcome: observed
assert:
- view: llm.embeddings.LastEmbed
  counts:
    at_least: 1
    at_most: 1
- view: llm.embeddings.LastEmbed
  contains:
    valid_program: true
    error_code: unsupported
    config_digest: 1365b05fe63542f8211e21a9a2566c71f2a6d44ec9bdc564ba46c592a861825f
    vectors: 0
    request_bodies: []
    records: []
