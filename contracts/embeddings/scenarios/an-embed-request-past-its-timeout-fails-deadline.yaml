type: ess-scenario/1
domain: llm.embeddings
scenario: an-embed-request-past-its-timeout-fails-deadline
summary: a server that takes the request and never answers holds the call only until the caller's 300 ms timeout; the request fails deadline, dispatch unknown, returns no vector and records its batch failed
timeline:
- at: '2026-11-06T12:00:00Z'
  command: llm.embeddings.Embed
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "openai-compatible"
      category = "hosted"

      [[accounts]]
      id = "main"
      provider_id = "openai-compatible"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[endpoints]]
      id = "fixture"
      account_id = "main"
      base_url = "http://fixture.invalid/v1"

      [[models]]
      id = "embedding-small"
      upstream_name = "text-embedding-3-small"

      [[models]]
      id = "chat-small"
      upstream_name = "gpt-4o-mini"

      [[serving_models]]
      id = "embedder"
      endpoint_id = "fixture"
      model_id = "embedding-small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 8191
      max_output_tokens = 1

      [[serving_models]]
      id = "chatter"
      endpoint_id = "fixture"
      model_id = "chat-small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[routes]]
      id = "embedding"
      alias = "embed"
      kind = "embed"

      [[routes]]
      id = "chatting"
      alias = "chat"

      [[targets]]
      id = "embed-primary"
      route_id = "embedding"
      serving_model_id = "embedder"
      position = 0

      [[targets]]
      id = "chat-primary"
      route_id = "chatting"
      serving_model_id = "chatter"
      position = 0
    request_json: '{"request_id":"req-1","alias":"embed","texts":["one","two"],"timeout_ms":300}'
    program_json: '{"start_unix_ms":1762430400000,"answers":[{"hang":true}]}'
  outcome: observed
assert:
- view: llm.embeddings.LastEmbed
  counts:
    at_least: 1
    at_most: 1
- view: llm.embeddings.LastEmbed
  contains:
    valid_program: true
    error_code: deadline
    vectors: 0
    batch_texts: [2]
    input_tokens: null
    ended_within: true
    records:
    - '{"id":"req-1/0","role":"primary","kind":"embed-batch","route_id":"embedding","route_target_id":"embed-primary","upstream_model":null,"outcome":"failed","error_code":"deadline","dispatch":"unknown","attempts":1,"started_at_unix_ms":1762430400000,"latency_ms":0,"time_to_first_event_ms":null,"usage":{},"cost":null,"primary_record_id":null}'
