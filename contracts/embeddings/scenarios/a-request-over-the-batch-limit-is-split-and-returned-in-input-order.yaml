type: ess-scenario/1
domain: llm.embeddings
scenario: a-request-over-the-batch-limit-is-split-and-returned-in-input-order
summary: five texts under a batch limit of two go out as three requests of two, two and one text in order; the vectors return in input order and the input tokens add up
timeline:
- at: '2026-11-06T12:00:00Z'
  command: llm.embeddings.Embed
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "openai-compatible"
      category = "hosted"

      [[accounts]]
      id = "main"
      provider_id = "openai-compatible"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[endpoints]]
      id = "fixture"
      account_id = "main"
      base_url = "http://fixture.invalid/v1"

      [[models]]
      id = "embedding-small"
      upstream_name = "text-embedding-3-small"

      [[models]]
      id = "chat-small"
      upstream_name = "gpt-4o-mini"

      [[serving_models]]
      id = "embedder"
      endpoint_id = "fixture"
      model_id = "embedding-small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 8191
      max_output_tokens = 1
      embed_batch_limit = 2

      [[serving_models]]
      id = "chatter"
      endpoint_id = "fixture"
      model_id = "chat-small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[routes]]
      id = "embedding"
      alias = "embed"
      kind = "embed"

      [[routes]]
      id = "chatting"
      alias = "chat"

      [[targets]]
      id = "embed-primary"
      route_id = "embedding"
      serving_model_id = "embedder"
      position = 0

      [[targets]]
      id = "chat-primary"
      route_id = "chatting"
      serving_model_id = "chatter"
      position = 0
    request_json: '{"request_id":"req-1","alias":"embed","texts":["one","two","three","four","five"],"timeout_ms":10000}'
    program_json: '{"start_unix_ms":1762430400000,"answers":[{"body":{"object":"list","data":[{"object":"embedding","embedding":[1.25,-1.5,0.5],"index":1},{"object":"embedding","embedding":[0.25,-0.5,0.5],"index":0}],"model":"text-embedding-3-small","usage":{"prompt_tokens":4,"total_tokens":4}}},{"body":{"object":"list","data":[{"object":"embedding","embedding":[2.25,-2.5,0.5],"index":0},{"object":"embedding","embedding":[3.25,-3.5,0.5],"index":1}],"model":"text-embedding-3-small","usage":{"prompt_tokens":5,"total_tokens":5}}},{"body":{"object":"list","data":[{"object":"embedding","embedding":[4.25,-4.5,0.5],"index":0}],"model":"text-embedding-3-small","usage":{"prompt_tokens":2,"total_tokens":2}}}]}'
  outcome: observed
assert:
- view: llm.embeddings.LastEmbed
  counts:
    at_least: 1
    at_most: 1
- view: llm.embeddings.LastEmbed
  contains:
    valid_program: true
    error_code: null
    vectors: 5
    dimensions: [3, 3, 3, 3, 3]
    leading: ['0.25', '1.25', '2.25', '3.25', '4.25']
    batch_texts: [2, 2, 1]
    input_tokens: 11
    request_bodies:
    - '{"model":"text-embedding-3-small","input":["one","two"],"encoding_format":"float"}'
    - '{"model":"text-embedding-3-small","input":["three","four"],"encoding_format":"float"}'
    - '{"model":"text-embedding-3-small","input":["five"],"encoding_format":"float"}'
