type: ess-scenario/1
domain: llm.embeddings
scenario: each-batch-yields-a-call-record-of-kind-embed-batch
summary: three texts under a batch limit of two go out as two batches, each writing one embed-batch record with route, target, reported model and its input tokens, and no text
