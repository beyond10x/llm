type: ess-scenario/1
domain: llm.transport
scenario: silence-past-the-idle-bound-ends-the-stream
summary: a stream that goes silent for longer than the idle bound ends in a deadline, dispatch accepted
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"limits":{"response_headers_ms":5000,"idle_ms":200,"total_ms":10000},"within_ms":5000,"server":{"chunks":["data: {\"n\":1}\n\n"],"end":"hold"}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: deadline
    dispatch: accepted
    events:
    - payload:-:{"n":1}
    end: error
    ended_within: true
