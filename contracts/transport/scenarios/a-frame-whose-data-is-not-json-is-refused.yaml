type: ess-scenario/1
domain: llm.transport
scenario: a-frame-whose-data-is-not-json-is-refused
summary: a data frame that is not JSON is a protocol refusal
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"chunks":["data: not json\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: protocol
    dispatch: accepted
    events: []
