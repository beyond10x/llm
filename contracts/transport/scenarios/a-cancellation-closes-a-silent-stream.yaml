type: ess-scenario/1
domain: llm.transport
scenario: a-cancellation-closes-a-silent-stream
summary: cancelling a stream that is waiting on a silent server ends it at once, dispatch accepted
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"cancel":{"after_events":1},"server":{"chunks":["data: {\"n\":1}\n\n"],"end":"hold"}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: cancelled
    dispatch: accepted
    events:
    - payload:-:{"n":1}
    end: error
    sticky: true
