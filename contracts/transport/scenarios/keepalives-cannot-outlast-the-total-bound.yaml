type: ess-scenario/1
domain: llm.transport
scenario: keepalives-cannot-outlast-the-total-bound
summary: comment keepalives reset nothing that bounds the whole exchange; the total deadline still ends it
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"limits":{"response_headers_ms":5000,"idle_ms":5000,"total_ms":400},"within_ms":5000,"server":{"keepalive_ms":20,"end":"hold"}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: deadline
    dispatch: accepted
    events: []
    end: error
    ended_within: true
