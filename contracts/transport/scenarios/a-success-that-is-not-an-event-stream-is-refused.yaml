type: ess-scenario/1
domain: llm.transport
scenario: a-success-that-is-not-an-event-stream-is-refused
summary: a 200 without text/event-stream is a protocol refusal after acceptance
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"content_type":"application/json","chunks":["{}"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: protocol
    dispatch: accepted
    end: null
