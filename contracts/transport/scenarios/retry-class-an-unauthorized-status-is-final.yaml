type: ess-scenario/1
domain: llm.transport
scenario: retry-class-an-unauthorized-status-is-final
summary: 401 is unauthorized and final; another attempt with the same credential is refused the same way
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":401}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: unauthorized
    dispatch: rejected
    retriable: false
    requests: 1
