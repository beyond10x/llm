type: ess-scenario/1
domain: llm.transport
scenario: the-first-redirect-status-is-refused-with-dispatch-unknown
summary: 300 is the lower edge of the redirect range and is refused with dispatch unknown
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":300}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: refused
    dispatch: unknown
    requests: 1
