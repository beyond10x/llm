type: ess-scenario/1
domain: llm.transport
scenario: a-clean-end-of-stream-yields-every-payload-then-ends
summary: payloads arrive in order with their event names, and a clean end of stream ends the stream once (sse.rs, transport.rs SseStream::next)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"chunks":["data: {\"n\":1}\n\n","event: delta\ndata: {\"n\":2}\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    valid_program: true
    error_code: null
    events:
    - payload:-:{"n":1}
    - payload:delta:{"n":2}
    end: end
    requests: 1
    request_line: POST /arbitrary/prefix HTTP/1.1
