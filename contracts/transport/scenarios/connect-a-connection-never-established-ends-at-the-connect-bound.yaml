type: ess-scenario/1
domain: llm.transport
scenario: connect-a-connection-never-established-ends-at-the-connect-bound
summary: a connection the far side never establishes ends at the connect bound as a retriable transport failure, before the response-header deadline
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"limits":{"connect_ms":200,"response_headers_ms":5000,"idle_ms":5000,"total_ms":10000},"within_ms":2000,"server":{"accepting":false}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    valid_program: true
    error_code: transport
    dispatch: unknown
    retriable: true
    end: null
    requests: 0
    ended_within: true
