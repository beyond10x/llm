type: ess-scenario/1
domain: llm.transport
scenario: a-server-failure-leaves-dispatch-unknown
summary: a 5xx is a transport failure whose dispatch is unknown, because the work may have run
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":503}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: transport
    dispatch: unknown
    retry_after_ms: null
    requests: 1
