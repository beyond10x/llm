type: ess-scenario/1
domain: llm.transport
scenario: a-cancellation-before-sending-sends-nothing
summary: a caller already cancelled is refused before any connection is made
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"cancel":{"before":true},"server":{"chunks":["data: {\"n\":1}\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: cancelled
    dispatch: not-sent
    end: null
    requests: 0
