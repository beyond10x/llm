type: ess-scenario/1
domain: llm.transport
scenario: json-exchange-nothing-listening-is-a-final-transport-failure
summary: a refused connection is a transport failure that is not retriable
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.PostJson
  input:
    program_json: '{"server":{"listening":false}}'
  outcome: observed
assert:
- view: llm.transport.LastJsonExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastJsonExchange
  contains:
    error_code: transport
    retriable: false
    requests: 0
