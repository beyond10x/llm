type: ess-scenario/1
domain: llm.transport
scenario: json-exchange-a-redirect-is-never-followed
summary: a 307 is refused and the redirect target is never contacted
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.PostJson
  input:
    program_json: '{"server":{"status":307,"redirect":true}}'
  outcome: observed
assert:
- view: llm.transport.LastJsonExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastJsonExchange
  contains:
    error_code: refused
    dispatch: unknown
    retriable: false
    requests: 1
    redirected_requests: 0
