type: ess-scenario/1
domain: llm.transport
scenario: retry-class-a-clean-stream-has-no-retry-class
summary: an exchange that refused nothing reports no retry class
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"chunks":["data: {\"n\":1}\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: null
    retriable: null
    end: end
    requests: 1
