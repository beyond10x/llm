type: ess-scenario/1
domain: llm.transport
scenario: json-exchange-a-server-failure-is-final
summary: a 503 is a transport failure with dispatch unknown that is not retriable, after one request
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.PostJson
  input:
    program_json: '{"server":{"status":503}}'
  outcome: observed
assert:
- view: llm.transport.LastJsonExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastJsonExchange
  contains:
    error_code: transport
    dispatch: unknown
    retriable: false
    requests: 1
    diagnostics_safe: true
