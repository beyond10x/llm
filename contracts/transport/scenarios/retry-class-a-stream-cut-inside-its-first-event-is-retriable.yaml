type: ess-scenario/1
domain: llm.transport
scenario: retry-class-a-stream-cut-inside-its-first-event-is-retriable
summary: an end of stream inside the first event yields nothing and is a retriable protocol refusal; dispatch stays accepted and nothing is resent here
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"chunks":["data: {\"partial\":"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: protocol
    dispatch: accepted
    retriable: true
    events: []
    end: error
    requests: 1
