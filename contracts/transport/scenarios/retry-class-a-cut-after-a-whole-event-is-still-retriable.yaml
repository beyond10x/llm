type: ess-scenario/1
domain: llm.transport
scenario: retry-class-a-cut-after-a-whole-event-is-still-retriable
summary: the class says what was observed, not whether anything was shown; a cut after a whole event is retriable and routing decides on visibility
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"chunks":["data: {\"text\":\"prefix\"}\n\n","data: {\"partial\":"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: protocol
    dispatch: accepted
    retriable: true
    events:
    - payload:-:{"text":"prefix"}
    end: error
    requests: 1
