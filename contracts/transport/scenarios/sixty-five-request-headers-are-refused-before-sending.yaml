type: ess-scenario/1
domain: llm.transport
scenario: sixty-five-request-headers-are-refused-before-sending
summary: a request with 65 caller headers is refused as too large and never sent
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"extra_headers":65,"server":{"chunks":["data: {\"n\":1}\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: too-large
    dispatch: not-sent
    requests: 0
