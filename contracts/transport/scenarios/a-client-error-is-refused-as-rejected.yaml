type: ess-scenario/1
domain: llm.transport
scenario: a-client-error-is-refused-as-rejected
summary: any other 4xx is refused with dispatch rejected
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":404}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: refused
    dispatch: rejected
    requests: 1
