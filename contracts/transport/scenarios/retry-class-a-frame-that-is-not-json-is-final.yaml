type: ess-scenario/1
domain: llm.transport
scenario: retry-class-a-frame-that-is-not-json-is-final
summary: a malformed frame is a protocol refusal the identical request meets again, so unlike a cut stream it is final
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"chunks":["data: not json\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: protocol
    dispatch: accepted
    retriable: false
    events: []
    requests: 1
