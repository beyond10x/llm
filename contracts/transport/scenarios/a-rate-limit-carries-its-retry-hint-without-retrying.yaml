type: ess-scenario/1
domain: llm.transport
scenario: a-rate-limit-carries-its-retry-hint-without-retrying
summary: 429 is rate-limited with dispatch rejected and its delta-seconds hint, and nothing is resent
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":429,"retry_after":"7"}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: rate-limited
    dispatch: rejected
    retry_after_ms: 7000
    requests: 1
    diagnostics_safe: true
