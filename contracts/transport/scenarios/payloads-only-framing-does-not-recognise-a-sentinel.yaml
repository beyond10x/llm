type: ess-scenario/1
domain: llm.transport
scenario: payloads-only-framing-does-not-recognise-a-sentinel
summary: without sentinel framing [DONE] is data that is not JSON, and is refused rather than read as an ending
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"framing":"PayloadsOnly","server":{"chunks":["data: [DONE]\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: protocol
    dispatch: accepted
    events: []
    end: error
