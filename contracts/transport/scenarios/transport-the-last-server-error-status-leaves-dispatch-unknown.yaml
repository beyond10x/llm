type: ess-scenario/1
domain: llm.transport
scenario: adversary-w2-the-last-server-error-status-leaves-dispatch-unknown
summary: 599 is the upper edge of the server-failure range (transport.rs:246) and is a transport failure with dispatch unknown
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":599}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: transport
    dispatch: unknown
    requests: 1
