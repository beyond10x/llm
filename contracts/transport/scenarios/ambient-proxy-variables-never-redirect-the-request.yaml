type: ess-scenario/1
domain: llm.transport
scenario: ambient-proxy-variables-never-redirect-the-request
summary: with every proxy variable naming a local listener and no exemption, the request still goes only to the caller-selected endpoint (transport.rs HttpClient::new no_proxy)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"ambient_proxy":true,"limits":{"response_headers_ms":2000,"idle_ms":2000,"total_ms":4000},"server":{"chunks":["data: {\"n\":1}\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    valid_program: true
    error_code: null
    events:
    - payload:-:{"n":1}
    end: end
    requests: 1
    request_line: POST /arbitrary/prefix HTTP/1.1
    proxied_requests: 0
