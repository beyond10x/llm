type: ess-scenario/1
domain: llm.transport
scenario: retry-class-a-rate-limit-is-retriable
summary: 429 is retriable, rejected, and carries its server delay; the transport itself still sends once
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":429,"retry_after":"7"}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: rate-limited
    dispatch: rejected
    retriable: true
    retry_after_ms: 7000
    requests: 1
