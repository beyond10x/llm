type: ess-scenario/1
domain: llm.transport
scenario: json-exchange-an-answer-one-byte-over-the-bound-is-refused
summary: an answer of 65537 bytes is refused as too large and not retriable
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.PostJson
  input:
    program_json: '{"server":{"body_bytes":65537}}'
  outcome: observed
assert:
- view: llm.transport.LastJsonExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastJsonExchange
  contains:
    error_code: too-large
    retriable: false
    requests: 1
