type: ess-scenario/1
domain: llm.transport
scenario: json-exchange-a-rate-limit-is-final
summary: a 429 is rate-limited and not retriable, after one request
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.PostJson
  input:
    program_json: '{"server":{"status":429}}'
  outcome: observed
assert:
- view: llm.transport.LastJsonExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastJsonExchange
  contains:
    error_code: rate-limited
    dispatch: rejected
    retriable: false
    requests: 1
