type: ess-scenario/1
domain: llm.transport
scenario: a-body-one-byte-over-the-request-bound-is-refused-before-sending
summary: a body one byte over 16 MiB is refused as too large and never sent
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"body_bytes":16777217,"server":{"chunks":["data: {\"n\":1}\n\n"]}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: too-large
    dispatch: not-sent
    end: null
    requests: 0
