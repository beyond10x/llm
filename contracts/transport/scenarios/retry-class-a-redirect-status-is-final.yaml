type: ess-scenario/1
domain: llm.transport
scenario: retry-class-a-redirect-status-is-final
summary: a redirect status is refused, never followed and final
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.transport.Exchange
  input:
    program_json: '{"server":{"status":302}}'
  outcome: observed
assert:
- view: llm.transport.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm.transport.LastExchange
  contains:
    error_code: refused
    dispatch: unknown
    retriable: false
    requests: 1
