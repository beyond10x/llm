type: ess-scenario/1
domain: llm.routing
scenario: the-configuration-digest-ignores-declaration-order-and-comments
summary: the same catalog declared in reverse order and without comments has the same configuration digest
timeline:
- at: '2026-09-19T12:00:00Z'
  command: llm.routing.Evaluate
  input:
    catalog_toml: |
      format = "llm.catalog/1"

      [[targets]]
      id = "coding-secondary"
      route_id = "coding"
      serving_model_id = "remote-large"
      position = 1

      [[targets]]
      id = "coding-primary"
      route_id = "coding"
      serving_model_id = "local-small"
      position = 0

      [[routes]]
      id = "coding"
      alias = "code"
      fallback_enabled = false

      [[serving_models]]
      id = "remote-large"
      endpoint_id = "remote-models"
      model_id = "large"
      protocol = "responses"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = true
      reasoning_efforts = ["medium", "high"]
      context_window = 32768
      max_output_tokens = 8192

      [[serving_models]]
      id = "local-small"
      endpoint_id = "local-vllm"
      model_id = "small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[models]]
      id = "large"
      upstream_name = "example/Large-Model"

      [[models]]
      id = "small"
      upstream_name = "example/Small-Model"

      [[endpoints]]
      id = "remote-models"
      account_id = "remote"
      base_url = "https://models.example.invalid/v1"

      [[endpoints]]
      id = "local-vllm"
      account_id = "local"
      base_url = "http://127.0.0.1:8000/v1"

      [[accounts]]
      id = "remote"
      provider_id = "my-lab"
      auth_kind = "bearer"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-token"

      [[accounts]]
      id = "local"
      provider_id = "my-lab"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[providers]]
      id = "my-lab"
      category = "self-hosted"
    turn_json: '{"format":"llm.turn/3","request":{"model":"code","instructions":"Keep instructions","items":[{"kind":"user-text","text":"Keep
      message"}],"tools":[],"max_output_tokens":128}}'
    input_tokens: 100
  outcome: observed
assert:
- view: llm.routing.LastEvaluation
  counts:
    at_least: 1
    at_most: 1
- view: llm.routing.LastEvaluation
  contains:
    catalog_valid: true
    error_code: null
    selected_target: coding-primary
    config_digest: 1365b05fe63542f8211e21a9a2566c71f2a6d44ec9bdc564ba46c592a861825f
