type: ess-scenario/1
domain: llm.runpod
scenario: a-stream-on-a-retired-pod-does-not-keep-its-replacement-from-being-reaped
summary: in-flight accounting belongs to one deployment, not to the alias
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"hold","alias":"qwen"},{"step":"vanish","pod":"pod-1"},{"step":"until_ready","alias":"qwen"},{"step":"advance","ms":1800000},{"step":"reap"}]}'
  outcome: observed
assert:
- view: llm.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm.runpod.LastExecution
  contains:
    cleanups:
    - idle=[qwen-2] retired=[] replaced=[] orphans=[]
    terminations:
    - pod-2
