type: ess-scenario/1
domain: llm.runpod
scenario: a-placement-refusal-falls-through-to-the-next-declared-gpu-in-order
summary: a GPU without capacity is followed by the next declared GPU, in declaration order
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"refuse_gpu","gpu":"NVIDIA L40S"},{"step":"until_ready","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm.runpod.LastExecution
  contains:
    results:
    - ok
    - ready
    requested_gpus:
    - NVIDIA L40S
    - NVIDIA H100 NVL
    pods:
    - pod-1:b10x-llm-qwen:running
