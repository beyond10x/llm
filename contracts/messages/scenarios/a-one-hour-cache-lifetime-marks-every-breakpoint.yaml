type: ess-scenario/1
domain: llm.messages
scenario: a-one-hour-cache-lifetime-marks-every-breakpoint
summary: a prompt-cache hint with the lifetime 1h puts ttl 1h on the system breakpoint and the rolling one
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"format":"llm.turn/4","request":{"model":"internal-model","instructions":"Stay terse","items":[{"kind":"user-text","text":"Summarise the log"}],"tools":[],"max_output_tokens":512,"controls":{"hints":{"prompt_cache":{"ttl":"1h"}}}}}'
    ingress: false
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: true
    error_code: null
    dispatch: null
    wire_request: '{"max_tokens":512,"messages":[{"content":[{"cache_control":{"ttl":"1h","type":"ephemeral"},"text":"Summarise the log","type":"text"}],"role":"user"}],"model":"example/Model-Revision","stream":true,"system":[{"cache_control":{"ttl":"1h","type":"ephemeral"},"text":"Stay terse","type":"text"}]}'
    neutral_request: null
    items:
      - "user-text:Summarise the log"
    omitted_advisories: []
