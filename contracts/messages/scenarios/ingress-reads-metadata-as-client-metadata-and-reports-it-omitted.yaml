type: ess-scenario/1
domain: llm.messages
scenario: ingress-reads-metadata-as-client-metadata-and-reports-it-omitted
summary: metadata holding only user_id is the client-metadata hint, its value not kept, and this wire reports it omitted
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"max_tokens":512,"messages":[{"content":"hi","role":"user"}],"metadata":{"user_id":"client-telemetry-value"},"model":"caller-alias"}'
    ingress: true
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: true
    error_code: null
    dispatch: null
    wire_request: null
    neutral_request: '{"format":"llm.turn/4","request":{"model":"caller-alias","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"max_output_tokens":512,"controls":{"hints":{"unforwarded":["client-metadata"]}}}}'
    stream: false
    items:
      - "user-text:hi"
    omitted_advisories:
      - "client-metadata"
