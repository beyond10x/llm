type: ess-scenario/1
domain: llm.messages
scenario: a-conversation-that-opens-with-the-model-is-refused-before-projection
summary: a conversation whose first item is the model's is refused by name before anything is sent
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: "{\"format\":\"llm.turn/3\",\"request\":{\"model\":\"internal-model\",\"instructions\":\"\",\"items\":[{\"kind\":\"assistant-text\",\"text\":\"Looking\"},{\"kind\":\"user-text\",\"text\":\"Go on\"}],\"tools\":[]}}"
    ingress: false
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: false
    error_code: "unsupported"
    error_message: "Messages requires an initial user message"
    dispatch: "not-sent"
    wire_request: null
    neutral_request: null
    stream: null
    items: []
    text: ""
    reasoning: ""
    tool_arguments: []
    upstream_model: null
    response_id: null
    final_usage: null
    usage_json: null
    stop_reason: null
