type: ess-scenario/1
domain: llm.messages
scenario: an-unfinished-answer-without-content-is-refused
summary: an unfinished answer with no content would read back as a failure, so it is refused and nothing is sent
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm.messages.EncodeIngress
  input:
    request_json: '{"model":"messages-route","max_tokens":512,"messages":[{"role":"user","content":"Summarise the log"}]}'
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"incomplete","reason":"pause_turn"},"items":[],"observation":{"binding":{"protocol":"messages","provider":"lab","account":"account","endpoint":"endpoint","model":"internal-model","binding_revision":"6161a641b63d57ad0a5a44e5f5004e292e932f82b1cb8cad55d191a3ba3f4260"},"final_usage":true}}}'
    streamed: false
  outcome: observed
assert:
- view: llm.messages.LastIngressEncoding
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastIngressEncoding
  contains:
    accepted: false
    error_code: unsupported
    error_message: Messages cannot report an unfinished turn without content
    dispatch: not-sent
    wire: []
    decoded_accepted: null
