type: ess-scenario/1
domain: llm.messages
scenario: ingress-refuses-a-structured-output-format
summary: output_config.format asks for structured output, which the neutral turn does not carry, and is refused by its path beside an accepted effort
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"max_tokens":512,"messages":[{"content":"hi","role":"user"}],"model":"caller-alias","output_config":{"effort":"high","format":{"schema":{"type":"object"},"type":"json_schema"}}}'
    ingress: true
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: false
    error_code: "unsupported"
    error_message: "Messages field is outside the declared subset: output_config.format"
    dispatch: "not-sent"
    wire_request: null
    neutral_request: null
    stream: null
    items: []
    omitted_advisories: []
