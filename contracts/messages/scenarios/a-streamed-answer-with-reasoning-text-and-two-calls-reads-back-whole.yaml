type: ess-scenario/1
domain: llm.messages
scenario: a-streamed-answer-with-reasoning-text-and-two-calls-reads-back-whole
summary: a streamed answer carrying reasoning, text and two tool calls reads back as the same outcome
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.messages.EncodeIngress
  input:
    request_json: '{"model":"messages-route","max_tokens":512,"messages":[{"role":"user","content":"Summarise the log"}],"tools":[{"name":"lookup","description":"Look up a record","input_schema":{"type":"object"}},{"name":"search","description":"Search the log","input_schema":{"type":"object"}}],"stream":true}'
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"tool-calls"},"items":[{"kind":"opaque","provenance":{"protocol":"messages","provider":"lab","account":"account","endpoint":"endpoint","model":"internal-model","binding_revision":"6161a641b63d57ad0a5a44e5f5004e292e932f82b1cb8cad55d191a3ba3f4260"},"payload":{"type":"thinking","thinking":"weighing","signature":"sig-1"}},{"kind":"assistant-text","text":"Looking"},{"kind":"tool-call","call_id":"call-1","name":"lookup","arguments":{"query":"errors"}},{"kind":"tool-call","call_id":"call-2","name":"search","arguments":{"query":"warnings"}}],"observation":{"binding":{"protocol":"messages","provider":"lab","account":"account","endpoint":"endpoint","model":"internal-model","binding_revision":"6161a641b63d57ad0a5a44e5f5004e292e932f82b1cb8cad55d191a3ba3f4260"},"upstream_model":"example-model-20260201","response_id":"msg_gateway_fixture","usage":{"input_tokens":21,"output_tokens":9,"cached_input_tokens":4,"cache_creation_input_tokens":6,"reasoning_output_tokens":3},"final_usage":true}}}'
    events_json: '[{"kind":"reasoning-delta","text":"weigh"},{"kind":"reasoning-delta","text":"ing"},{"kind":"text-delta","text":"Looking"},{"kind":"tool-call-started","call_id":"call-1","name":"lookup"},{"kind":"tool-arguments-delta","call_id":"call-1","delta":"{\"query\":"},{"kind":"tool-arguments-delta","call_id":"call-1","delta":"\"errors\"}"},{"kind":"tool-call-started","call_id":"call-2","name":"search"},{"kind":"tool-arguments-delta","call_id":"call-2","delta":"{\"query\":\"warnings\"}"}]'
    model: example-model-20260201
    streamed: true
  outcome: observed
assert:
- view: llm.messages.LastIngressEncoding
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastIngressEncoding
  contains:
    accepted: true
    error_code: null
    error_message: null
    dispatch: null
    # A new block stops the open one, except thinking: its signature is the outcome's, so the
    # thinking block is signed and stopped at close, after the blocks that followed it. Counters
    # are known only at close, so message_start claims none.
    wire:
    - '{"message":{"content":[],"id":"msg_gateway_fixture","model":"example-model-20260201","role":"assistant","type":"message"},"type":"message_start"}'
    - '{"content_block":{"signature":"","thinking":"","type":"thinking"},"index":0,"type":"content_block_start"}'
    - '{"delta":{"thinking":"weigh","type":"thinking_delta"},"index":0,"type":"content_block_delta"}'
    - '{"delta":{"thinking":"ing","type":"thinking_delta"},"index":0,"type":"content_block_delta"}'
    - '{"content_block":{"text":"","type":"text"},"index":1,"type":"content_block_start"}'
    - '{"delta":{"text":"Looking","type":"text_delta"},"index":1,"type":"content_block_delta"}'
    - '{"index":1,"type":"content_block_stop"}'
    - '{"content_block":{"id":"call-1","input":{},"name":"lookup","type":"tool_use"},"index":2,"type":"content_block_start"}'
    - '{"delta":{"partial_json":"{\"query\":","type":"input_json_delta"},"index":2,"type":"content_block_delta"}'
    - '{"delta":{"partial_json":"\"errors\"}","type":"input_json_delta"},"index":2,"type":"content_block_delta"}'
    - '{"index":2,"type":"content_block_stop"}'
    - '{"content_block":{"id":"call-2","input":{},"name":"search","type":"tool_use"},"index":3,"type":"content_block_start"}'
    - '{"delta":{"partial_json":"{\"query\":\"warnings\"}","type":"input_json_delta"},"index":3,"type":"content_block_delta"}'
    - '{"delta":{"signature":"sig-1","type":"signature_delta"},"index":0,"type":"content_block_delta"}'
    - '{"index":0,"type":"content_block_stop"}'
    - '{"index":3,"type":"content_block_stop"}'
    - '{"delta":{"stop_reason":"tool_use"},"type":"message_delta","usage":{"cache_creation_input_tokens":6,"cache_read_input_tokens":4,"input_tokens":11,"output_tokens":9,"output_tokens_details":{"thinking_tokens":3}}}'
    - '{"type":"message_stop"}'
    decoded_accepted: true
    decoded_error_code: null
    decoded_items:
    - 'opaque:{"protocol":"messages","provider":"lab","account":"account","endpoint":"endpoint","model":"internal-model","binding_revision":"6161a641b63d57ad0a5a44e5f5004e292e932f82b1cb8cad55d191a3ba3f4260"}:{"signature":"sig-1","thinking":"weighing","type":"thinking"}'
    - 'assistant-text:Looking'
    - 'tool-call:lookup:call-1:{"query":"errors"}'
    - 'tool-call:search:call-2:{"query":"warnings"}'
    decoded_stop_reason: tool-calls
    decoded_upstream_model: example-model-20260201
    decoded_response_id: msg_gateway_fixture
    decoded_usage_json: '{"input_tokens":21,"output_tokens":9,"cached_input_tokens":4,"cache_creation_input_tokens":6,"reasoning_output_tokens":3}'
    # The caller is shown exactly the deltas the producer streamed, in order.
    shown:
    - 'reasoning:weigh'
    - 'reasoning:ing'
    - 'text:Looking'
    - 'started:call-1:lookup'
    - 'arguments:call-1:{"query":'
    - 'arguments:call-1:"errors"}'
    - 'started:call-2:search'
    - 'arguments:call-2:{"query":"warnings"}'
    round_trip: true
