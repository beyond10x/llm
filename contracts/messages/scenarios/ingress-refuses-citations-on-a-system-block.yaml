type: ess-scenario/1
domain: llm.messages
scenario: ingress-refuses-citations-on-a-system-block
summary: citations on a system text block are refused by their path
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"max_tokens":512,"messages":[{"content":"hi","role":"user"}],"model":"caller-alias","system":[{"citations":{"enabled":true},"text":"Stay terse","type":"text"}]}'
    ingress: true
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: false
    error_code: "unsupported"
    error_message: "Messages field is outside the declared subset: system[].citations"
    dispatch: "not-sent"
    wire_request: null
    neutral_request: null
    stream: null
    items: []
    omitted_advisories: []
