type: ess-scenario/1
domain: llm.messages
scenario: a-failed-answer-ends-with-an-error-event-read-as-its-code
summary: a stream that fails after content ends with an error event the decoder reads back as the same code
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.messages.EncodeIngress
  input:
    request_json: '{"model":"messages-route","max_tokens":512,"messages":[{"role":"user","content":"Summarise the log"}],"stream":true}'
    outcome_json: '{"format":"llm.outcome/4","outcome":{"stop_reason":{"kind":"end-turn"},"items":[{"kind":"assistant-text","text":"Looking"}],"observation":{"binding":{"protocol":"messages","provider":"lab","account":"account","endpoint":"endpoint","model":"internal-model","binding_revision":"6161a641b63d57ad0a5a44e5f5004e292e932f82b1cb8cad55d191a3ba3f4260"},"final_usage":true}}}'
    events_json: '[{"kind":"text-delta","text":"Looking"}]'
    model: example-model-20260201
    fail_code: unavailable
    streamed: true
  outcome: observed
assert:
- view: llm.messages.LastIngressEncoding
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastIngressEncoding
  contains:
    accepted: true
    error_code: null
    # The error ends the stream where it stands: the open block is not stopped and no terminal
    # reason follows. The error type is the one the decoder reads back as the same code.
    wire:
    - '{"message":{"content":[],"id":"msg_gateway_fixture","model":"example-model-20260201","role":"assistant","type":"message"},"type":"message_start"}'
    - '{"content_block":{"text":"","type":"text"},"index":0,"type":"content_block_start"}'
    - '{"delta":{"text":"Looking","type":"text_delta"},"index":0,"type":"content_block_delta"}'
    - '{"error":{"message":"the fixture upstream failed","type":"overloaded_error"},"type":"error"}'
    decoded_accepted: false
    decoded_error_code: unavailable
    decoded_items: []
    shown:
    - 'text:Looking'
    round_trip: null
