type: ess-scenario/1
domain: llm.messages
scenario: egress-a-user-image-is-an-image-block-in-the-user-message
summary: user images are image blocks, bytes as a base64 source and a URL as a url source, beside the text in item order; the rolling breakpoint lands on the last (story:image-input)
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"format":"llm.turn/3","request":{"model":"internal-model","instructions":"","items":[{"kind":"user-text","text":"What is in these pictures?"},{"kind":"user-image","source":{"kind":"bytes","media_type":"image/png","data":"iVBORw0KGgo="}},{"kind":"user-image","source":{"kind":"url","url":"https://images.example/a.png"}}],"tools":[],"max_output_tokens":512}}'
    ingress: false
  outcome: observed
assert:
