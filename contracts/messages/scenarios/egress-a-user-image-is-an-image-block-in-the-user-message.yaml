  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: true
    error_code: null
    dispatch: null
    wire_request: '{"max_tokens":512,"messages":[{"content":[{"text":"What is in these pictures?","type":"text"},{"source":{"data":"iVBORw0KGgo=","media_type":"image/png","type":"base64"},"type":"image"},{"cache_control":{"type":"ephemeral"},"source":{"type":"url","url":"https://images.example/a.png"},"type":"image"}],"role":"user"}],"model":"example/Model-Revision","stream":true}'
    items:
      - "user-text:What is in these pictures?"
      - "user-image:bytes:image/png:iVBORw0KGgo="
      - "user-image:url:https://images.example/a.png"
