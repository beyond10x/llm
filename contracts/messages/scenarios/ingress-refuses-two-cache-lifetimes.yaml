type: ess-scenario/1
domain: llm.messages
scenario: ingress-refuses-two-cache-lifetimes
summary: cache marks of two lifetimes in one request are refused rather than one of them silently winning
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"max_tokens":512,"messages":[{"content":[{"cache_control":{"type":"ephemeral"},"text":"hi","type":"text"}],"role":"user"}],"model":"caller-alias","system":[{"cache_control":{"ttl":"1h","type":"ephemeral"},"text":"Stay terse","type":"text"}]}'
    ingress: true
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: false
    error_code: "unsupported"
    error_message: "Messages cache marks carry more than one lifetime"
    dispatch: "not-sent"
    wire_request: null
    neutral_request: null
    stream: null
    items: []
    omitted_advisories: []
