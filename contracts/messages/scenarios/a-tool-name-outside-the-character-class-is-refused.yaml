type: ess-scenario/1
domain: llm.messages
scenario: a-tool-name-outside-the-character-class-is-refused
summary: a tool name the neutral layer admits and this route cannot publish is refused before anything is sent
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: "{\"format\":\"llm.turn/3\",\"request\":{\"model\":\"internal-model\",\"instructions\":\"\",\"items\":[{\"kind\":\"user-text\",\"text\":\"Summarise the log\"}],\"tools\":[{\"name\":\"workspace.read\",\"description\":\"Read a file\",\"input_schema\":{\"type\":\"object\"}}]}}"
    ingress: false
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: false
    error_code: "unsupported"
    error_message: "Messages tool name is outside the supported character or length bound"
    dispatch: "not-sent"
    wire_request: null
    neutral_request: null
    stream: null
    items: []
    text: ""
    reasoning: ""
    tool_arguments: []
    upstream_model: null
    response_id: null
    final_usage: null
    usage_json: null
    stop_reason: null
