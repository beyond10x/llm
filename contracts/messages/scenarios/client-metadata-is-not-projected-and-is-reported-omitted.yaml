type: ess-scenario/1
domain: llm.messages
scenario: client-metadata-is-not-projected-and-is-reported-omitted
summary: a turn carrying the client-metadata hint projects no metadata, and the projection reports the hint omitted
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"format":"llm.turn/4","request":{"model":"internal-model","instructions":"","items":[{"kind":"user-text","text":"hi"}],"tools":[],"max_output_tokens":512,"controls":{"hints":{"unforwarded":["client-metadata"]}}}}'
