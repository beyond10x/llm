  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: true
    error_code: null
    dispatch: null
    wire_request: '{"max_tokens":512,"messages":[{"content":[{"cache_control":{"type":"ephemeral"},"text":"hi","type":"text"}],"role":"user"}],"model":"example/Model-Revision","stream":true}'
    neutral_request: null
    items:
      - "user-text:hi"
    omitted_advisories:
      - "client-metadata"
