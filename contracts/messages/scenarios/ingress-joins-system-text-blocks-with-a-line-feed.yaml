type: ess-scenario/1
domain: llm.messages
scenario: ingress-joins-system-text-blocks-with-a-line-feed
summary: a system of several text blocks is one instruction, the blocks joined by a line feed; the projection sends it back as one block
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm.messages.Project
  input:
    request_json: '{"max_tokens":512,"messages":[{"content":"hi","role":"user"}],"model":"caller-alias","system":[{"text":"Stay terse","type":"text"},{"cache_control":{"type":"ephemeral"},"text":"Cite nothing","type":"text"}]}'
    ingress: true
  outcome: observed
assert:
- view: llm.messages.LastInspection
  counts:
    at_least: 1
    at_most: 1
- view: llm.messages.LastInspection
  contains:
    accepted: true
    error_code: null
    dispatch: null
    wire_request: null
    neutral_request: '{"format":"llm.turn/4","request":{"model":"caller-alias","instructions":"Stay terse\nCite nothing","items":[{"kind":"user-text","text":"hi"}],"tools":[],"max_output_tokens":512,"controls":{"hints":{"prompt_cache":{}}}}}'
    stream: false
    items:
      - "user-text:hi"
    omitted_advisories: []
