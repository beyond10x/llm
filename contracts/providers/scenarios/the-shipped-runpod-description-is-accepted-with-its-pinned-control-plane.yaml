type: ess-scenario/1
domain: llm.providers
scenario: the-shipped-runpod-description-is-accepted-with-its-pinned-control-plane
summary: the Runpod description shipped in the crate names its provider, three wires, bearer authentication, a pinned OpenAPI source and four operations
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm.providers.Describe
  input:
    description_toml: null
    shipped: runpod
    instance: null
  outcome: observed
assert:
- view: llm.providers.LastDescription
  counts:
    at_least: 1
    at_most: 1
- view: llm.providers.LastDescription
  contains:
    accepted: true
    error_code: null
    provider_id: runpod
    category: gpu-cloud
    base_url_template: 'https://{instance}-8000.proxy.runpod.net/v1/'
    protocols: [chat-completions, messages, responses]
    inference_auth_kind: bearer
    control_plane_present: true
    openapi_url: 'https://rest.runpod.io/v1/openapi.json'
    document_sha256: 9500a8989878d53d8731f27bf8dbbd57801b328c760bdb32c38ba36d5cb580db
    server_url: 'https://rest.runpod.io/v1'
    control_plane_auth_kind: bearer
    operations: [create_instance=CreatePod, list_instances=ListPods, get_instance=GetPod, delete_instance=DeletePod]
    base_url: null
