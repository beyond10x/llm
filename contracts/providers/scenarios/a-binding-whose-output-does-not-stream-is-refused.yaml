type: ess-scenario/1
domain: llm.providers
scenario: a-binding-whose-output-does-not-stream-is-refused
summary: a binding whose capabilities declare output that does not stream is refused at bind, because every protocol in this workspace streams its output
timeline:
- at: '2026-10-20T12:00:00Z'
  command: llm.providers.Prepare
  input:
    binding_json: '{"format":"llm.binding/1","provider":{"id":"my-lab","category":"private-compute"},"account":{"id":"research","provider_id":"my-lab","auth_kind":"anonymous","billing_kind":"self-hosted"},"endpoint":{"id":"gpu-7","account_id":"research","base_url":"http://127.0.0.1:8000/proxy/v1"},"model":{"id":"code","upstream_name":"custom-org/CustomModel-27B:revision-4"},"serving":{"id":"local-code","endpoint_id":"gpu-7","model_id":"code","protocol":"messages","capabilities":{"tools":false,"tool_choice":false,"temperature":false,"top_p":false,"reasoning_efforts":[],"context_window":32768,"max_output_tokens":8192,"output_streaming":false}}}'
    secret_error: null
    secret: 'llm-fixture-private-marker-xxxxxxxxxx'
    secret_length: null
    cancel: Never
  outcome: observed
assert:
- view: llm.providers.LastPreparation
  counts:
    at_least: 1
    at_most: 1
- view: llm.providers.LastPreparation
  contains:
    bound: false
    error_code: invalid-request
    error_message: every protocol in this workspace streams its output
