type: ess-scenario/1
domain: llm.routes
scenario: a-route-mapping-declares-its-own-capabilities
summary: a route written as a mapping with capabilities declares exactly those capabilities in the expanded catalog
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      endpoints:
        gateway: {base_url: https://gateway.internal/v1, protocol: responses,
                  auth: {kind: bearer, secret: file:~/.config/b10x/gateway-token}}
      routes:
        qwen:
          model: gateway/qwen
          capabilities: {tools: true, tool_choice: true, temperature: true, top_p: true,
                         reasoning_efforts: [], context_window: 32768, max_output_tokens: 8192}
    probe_names: [qwen]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: true
    error_code: null
    answers: ["qwen=gateway:responses:qwen"]
    capabilities: ["qwen=tools:true,tool_choice:true,temperature:true,top_p:true,efforts:,context:32768,output:8192,output_streaming:true,input_during_output:false"]
