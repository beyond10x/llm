type: ess-scenario/1
domain: llm.routes
scenario: an-unknown-protocol-is-refused
summary: an endpoint declaring protocol grpc is refused as invalid-request, naming the endpoint and not the value
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      endpoints:
        anthropic: {base_url: https://api.anthropic.com/v1, protocol: grpc,
                    auth: {kind: api-key, header: x-api-key, secret: env:ANTHROPIC_API_KEY}}
      routes:
        sonnet: anthropic/claude-sonnet-4-5
    probe_names: [sonnet]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: false
    error_code: invalid-request
    error_message: "endpoint `anthropic`: unknown `protocol`; expected messages, responses, chat-completions or bedrock-converse"
    routes: []
    endpoints: []
    answers: []
    catalog_serving_models: []
