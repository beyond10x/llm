type: ess-scenario/1
domain: llm.routes
scenario: an-aws-web-identity-endpoint-naming-its-token-as-a-secret-is-refused
summary: the web identity token file of an aws-web-identity endpoint comes from the caller, so a document naming it as auth.secret is refused as invalid-request naming the field
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      endpoints:
        bedrock-irsa: {protocol: bedrock-converse, bedrock: {region: eu-central-1},
                       auth: {kind: aws-web-identity,
                              secret: 'file:/var/run/secrets/eks.amazonaws.com/serviceaccount/token'}}
      routes:
        nova: bedrock-irsa/eu.amazon.nova-pro-v1:0
    probe_names: [nova]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: false
    error_code: invalid-request
    error_message: "endpoint `bedrock-irsa`: a Bedrock endpoint takes no `auth.secret`; aws-keys names `auth.access_key_id` and `auth.secret_access_key`"
    bedrock_endpoints: []
    answers: []
