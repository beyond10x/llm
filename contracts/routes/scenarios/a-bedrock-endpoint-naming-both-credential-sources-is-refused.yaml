type: ess-scenario/1
domain: llm.routes
scenario: a-bedrock-endpoint-naming-both-credential-sources-is-refused
summary: an aws-container endpoint that also names an access key reference is refused as invalid-request, so an endpoint has exactly one credential source
timeline:
- at: '2026-10-23T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      endpoints:
        bedrock-eu: {protocol: bedrock-converse, bedrock: {region: eu-central-1},
                     auth: {kind: aws-container, access_key_id: env:BEDROCK_ACCESS_KEY_ID}}
      routes:
        nova: bedrock-eu/eu.amazon.nova-pro-v1:0
    probe_names: [nova]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: false
    error_code: invalid-request
    error_message: "endpoint `bedrock-eu`: an aws-container endpoint cannot also name `auth.access_key_id`: a Bedrock endpoint has one credential source"
    bedrock_endpoints: []
    answers: []
