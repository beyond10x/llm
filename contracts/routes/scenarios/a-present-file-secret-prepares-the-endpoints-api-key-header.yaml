type: ess-scenario/1
domain: llm.routes
scenario: a-present-file-secret-prepares-the-endpoints-api-key-header
summary: a route whose file reference names a protected file below the caller's home prepares its credential in the api-key header the endpoint names
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Authenticate
  input:
    routes_yaml: |
      format: llm.routes/1
      endpoints:
        gateway: {base_url: https://gateway.internal/v1, protocol: responses,
                  auth: {kind: api-key, header: x-gateway-key, secret: file:~/.config/b10x/gateway-token}}
      routes:
        qwen: gateway/qwen
    name: qwen
    file_secrets: [".config/b10x/gateway-token=fixture-gateway-key"]
  outcome: observed
assert:
- view: llm.routes.LastAuthentication
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastAuthentication
  contains:
    prepared: true
    error_code: null
    error_message: null
    header: x-gateway-key
