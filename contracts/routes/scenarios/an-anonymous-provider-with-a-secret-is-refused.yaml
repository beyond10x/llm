type: ess-scenario/1
domain: llm.routes
scenario: an-anonymous-provider-with-a-secret-is-refused
summary: an anonymous provider that names a secret is refused as invalid-request without echoing the reference
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      providers:
        lab: {base_url: http://127.0.0.1:8000/v1, protocol: chat-completions,
              auth: {kind: anonymous, secret: env:LAB_PRIVATE_TOKEN}}
      routes:
        small: lab/small
    probe_names: [small]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: false
    error_code: invalid-request
    error_message: "provider `lab`: an anonymous provider cannot name `auth.secret`"
    routes: []
    providers: []
    answers: []
    catalog_serving_models: []
