type: ess-scenario/1
domain: llm.routes
scenario: a-missing-file-secret-is-refused-unauthorized
summary: a route whose file reference names a file the home does not hold is refused unauthorized by the provider's reference, naming neither the path nor a value
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Authenticate
  input:
    routes_yaml: |
      format: llm.routes/1
      providers:
        gateway: {base_url: https://gateway.internal/v1, protocol: responses,
                  auth: {kind: bearer, secret: file:~/.config/b10x/gateway-token}}
      routes:
        qwen: gateway/qwen
    name: qwen
    file_secrets: []
  outcome: observed
assert:
- view: llm.routes.LastAuthentication
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastAuthentication
  contains:
    prepared: false
    error_code: unauthorized
    error_message: "secret reference `gateway` refused: secret reference was not found"
    header: null
