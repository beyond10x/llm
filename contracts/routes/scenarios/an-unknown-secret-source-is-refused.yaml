type: ess-scenario/1
domain: llm.routes
scenario: an-unknown-secret-source-is-refused
summary: a secret reference of an unknown source kind, vault:x, is refused as invalid-request without echoing it
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      providers:
        anthropic: {base_url: https://api.anthropic.com/v1, protocol: messages,
                    auth: {kind: api-key, header: x-api-key, secret: "vault:x"}}
      routes:
        sonnet: anthropic/claude-sonnet-4-5
    probe_names: [sonnet]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: false
    error_code: invalid-request
    error_message: "provider `anthropic`: `auth.secret` must be a reference: env:<VARIABLE>, file:<absolute or ~/ path> or keychain:<service>/<entry>"
    routes: []
    providers: []
    answers: []
    catalog_serving_models: []
