type: ess-scenario/1
domain: llm.routes
scenario: an-api-key-endpoint-without-a-header-is-refused
summary: an api-key endpoint that names no header is refused as invalid-request, naming the endpoint
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      endpoints:
        anthropic: {base_url: https://api.anthropic.com/v1, protocol: messages,
                    auth: {kind: api-key, secret: env:ANTHROPIC_API_KEY}}
      routes:
        sonnet: anthropic/claude-sonnet-4-5
    probe_names: [sonnet]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: false
    error_code: invalid-request
    error_message: "endpoint `anthropic`: an api-key endpoint requires `auth.header`"
    routes: []
    endpoints: []
    answers: []
    catalog_serving_models: []
