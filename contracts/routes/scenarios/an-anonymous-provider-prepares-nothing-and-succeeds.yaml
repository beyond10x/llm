type: ess-scenario/1
domain: llm.routes
scenario: an-anonymous-provider-prepares-nothing-and-succeeds
summary: a route to an anonymous provider prepares no credential header and succeeds
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Authenticate
  input:
    routes_yaml: |
      format: llm.routes/1
      providers:
        lab: {base_url: http://127.0.0.1:8000/v1, protocol: chat-completions, auth: {kind: anonymous}}
      routes:
        small: lab/small
    name: small
    file_secrets: []
  outcome: observed
assert:
- view: llm.routes.LastAuthentication
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastAuthentication
  contains:
    prepared: true
    error_code: null
    error_message: null
    header: null
