type: ess-scenario/1
domain: llm.routes
scenario: an-unset-environment-variable-is-refused-unauthorized
summary: a route whose env reference names an unset variable is refused unauthorized by the provider's reference, before any request, naming neither the variable nor a value
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Authenticate
  input:
    routes_yaml: |
      format: llm.routes/1
      providers:
        anthropic: {base_url: https://api.anthropic.com/v1, protocol: messages,
                    auth: {kind: api-key, header: x-api-key, secret: env:LLM_ROUTES_CONFORMANCE_NEVER_SET}}
      routes:
        sonnet: anthropic/claude-sonnet-4-5
    name: sonnet
    file_secrets: []
  outcome: observed
assert:
- view: llm.routes.LastAuthentication
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastAuthentication
  contains:
    prepared: false
    error_code: unauthorized
    error_message: "secret reference `anthropic` refused: secret reference was not found"
    header: null
