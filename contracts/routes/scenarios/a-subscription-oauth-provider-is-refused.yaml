type: ess-scenario/1
domain: llm.routes
scenario: a-subscription-oauth-provider-is-refused
summary: a provider declaring auth kind subscription-oauth is refused by name as invalid-request without echoing the value
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm.routes.Load
  input:
    routes_yaml: |
      format: llm.routes/1
      providers:
        anthropic: {base_url: https://api.anthropic.com/v1, protocol: messages,
                    auth: {kind: subscription-oauth, secret: env:ANTHROPIC_API_KEY}}
      routes:
        sonnet: anthropic/claude-sonnet-4-5
    probe_names: [sonnet]
  outcome: observed
assert:
- view: llm.routes.LastLoad
  counts:
    at_least: 1
    at_most: 1
- view: llm.routes.LastLoad
  contains:
    loaded: false
    error_code: invalid-request
    error_message: "provider `anthropic`: `auth.kind` names a subscription OAuth login, which a routes document cannot declare"
    routes: []
    providers: []
    answers: []
    catalog_serving_models: []
