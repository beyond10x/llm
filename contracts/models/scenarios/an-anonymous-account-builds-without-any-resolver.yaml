type: ess-scenario/1
domain: llm.models
scenario: an-anonymous-account-builds-without-any-resolver
summary: an anonymous account builds its port when the caller supplies no resolver at all
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm.models.Build
  input:
    catalog_toml: |
      format = "llm.catalog/1"

      [[providers]]
      id = "my-lab"
      category = "self-hosted"

      [[accounts]]
      id = "local"
      provider_id = "my-lab"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[accounts]]
      id = "remote"
      provider_id = "my-lab"
      auth_kind = "bearer"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-token"

      [[accounts]]
      id = "keyed"
      provider_id = "my-lab"
      auth_kind = "api-key"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-key"
      api_key_header = "x-api-key"

      [[endpoints]]
      id = "local-vllm"
      account_id = "local"
      base_url = "http://127.0.0.1:8000/v1"

      [[endpoints]]
      id = "remote-models"
      account_id = "remote"
      base_url = "https://models.example.invalid/v1"

      [[endpoints]]
      id = "keyed-models"
      account_id = "keyed"
      base_url = "https://keyed.example.invalid/v1"

      [[models]]
      id = "small"
      upstream_name = "example/Small-Model"

      [[models]]
      id = "large"
      upstream_name = "example/Large-Model"

      [[serving_models]]
      id = "local-small"
      endpoint_id = "local-vllm"
      model_id = "small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[serving_models]]
      id = "remote-large"
      endpoint_id = "remote-models"
      model_id = "large"
      protocol = "responses"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = true
      reasoning_efforts = ["medium", "high"]
      context_window = 32768
      max_output_tokens = 8192

      [[serving_models]]
      id = "keyed-large"
      endpoint_id = "keyed-models"
      model_id = "large"
      protocol = "messages"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = false
      reasoning_efforts = []
      context_window = 32768
      max_output_tokens = 8192

      [[routes]]
      id = "coding"
      alias = "code"
      fallback_enabled = false

      [[targets]]
      id = "coding-primary"
      route_id = "coding"
      serving_model_id = "local-small"
      position = 0
    serving_model_id: local-small
    resolver_accounts: []
  outcome: observed
assert:
- view: llm.models.LastConstruction
  counts:
    at_least: 1
    at_most: 1
- view: llm.models.LastConstruction
  contains:
    built: true
    error_code: null
    port: chat-completions
    resolver_attached: false
    resolver_calls: 0
