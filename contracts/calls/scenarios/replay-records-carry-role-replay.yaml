type: ess-scenario/1
domain: llm.calls
scenario: replay-records-carry-role-replay
summary: a turn, a classification and a verdict case each write one record with role replay and the kind of the case; the case past the cap is recorded skipped
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.calls.Replay
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "my-lab"
      category = "self-hosted"

      [[accounts]]
      id = "local"
      provider_id = "my-lab"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[accounts]]
      id = "remote"
      provider_id = "my-lab"
      auth_kind = "bearer"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-token"

      [[endpoints]]
      id = "local-vllm"
      account_id = "local"
      base_url = "http://127.0.0.1:8000/v1"

      [[endpoints]]
      id = "remote-models"
      account_id = "remote"
      base_url = "https://models.example.invalid/v1"

      [[models]]
      id = "small"
      upstream_name = "example/Small-Model"

      [[models]]
      id = "large"
      upstream_name = "example/Large-Model"

      [[serving_models]]
      id = "local-small"
      endpoint_id = "local-vllm"
      model_id = "small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[serving_models]]
      id = "remote-large"
      endpoint_id = "remote-models"
      model_id = "large"
      protocol = "responses"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = true
      reasoning_efforts = ["medium", "high"]
      context_window = 32768
      max_output_tokens = 8192

      [[routes]]
      id = "coding"
      alias = "code"

      [[targets]]
      id = "coding-primary"
      route_id = "coding"
      serving_model_id = "local-small"
      position = 0

      [[routes]]
      id = "coding-candidate"
      alias = "code-candidate"

      [[targets]]
      id = "candidate-large"
      route_id = "coding-candidate"
      serving_model_id = "remote-large"
      position = 0
    corpus_json: '{"format":"llm.corpus/1","cases":[{"id":"turn-case","kind":"turn","input_tokens":100,"primary_record_id":"call-77","turn":{"format":"llm.turn/3","request":{"model":"code","instructions":"","items":[{"kind":"user-text","text":"hello"}],"tools":[],"max_output_tokens":128}},"recorded":{"text":"recorded answer"}},{"id":"label-case","kind":"classification","input_tokens":100,"label_set":{"id":"intent","version":"v1","labels":["refund","other"]},"instructions":"Classify the request.","input":"I want my money back.","recorded":{"label":"refund"}},{"id":"verdict-case","kind":"verdict","input_tokens":100,"primary_record_id":"call-91","rubric":{"id":"helpfulness","version":"v3","text":"Score from 1 to 5 how well the answer addresses the question, and say whether it passes.","schema":{"type":"object","properties":{"score":{"type":"integer","minimum":1,"maximum":5},"pass":{"type":"boolean"}},"required":["score","pass"],"additionalProperties":false}},"subject":"Question: what is the capital of France? Answer: Paris.","recorded":{"verdict":{"score":4,"pass":true}}}]}'
    prices_toml: |
      # Fictional fixture prices. No vendor, model or resource is qualified by this example.
      format = "llm.prices/1"
      revision = "lab-prices-r1"
      source = "fixture price list"
      as_of_unix_ms = 1762300800000
      currency = "USD"

      [[models]]
      id = "local-small-price"
      serving_model_id = "local-small"
      # The binding revision the catalog above derives for local-small.
      binding_revision = "1a6ea40f98c8eef26ff66e7c753dda816f45a1aa3488bb31f62ef25a89c328a1"
      upstream_model = "example/Small-Model"
      input = { amount = "1", per_units = 1000 }
      output = { amount = "2", per_units = 1000 }

      [[models]]
      id = "remote-large-price"
      serving_model_id = "remote-large"
      # The binding revision the catalog above derives for remote-large.
      binding_revision = "5dd662a7d1b9e5280a10e6b691ff04c79326d1562d18d3206e9d1bd141ed9a13"
      upstream_model = "example/Large-Model"
      input = { amount = "3", per_units = 1000 }
      output = { amount = "5", per_units = 1000 }
    run_json: '{"id":"run-1","candidate_route_id":"coding-candidate","ledger_id":"replay-spend","currency":"USD","money_cap":"0.2","reserve":"0.1"}'
    program_json: '{"start_unix_ms":1762344000000,"models":{"remote-large":[{"answer":"recorded answer","usage":{"input_tokens":10,"output_tokens":5,"cached_input_tokens":0,"cache_creation_input_tokens":0},"upstream_model":"example/Large-Model"},{"answer":"{\"label\":\"refund\",\"confidences\":{\"refund\":9000,\"other\":1000}}","usage":{"input_tokens":10,"output_tokens":5,"cached_input_tokens":0,"cache_creation_input_tokens":0},"upstream_model":"example/Large-Model"},{"answer":"{\"score\":4,\"pass\":true}","usage":{"input_tokens":10,"output_tokens":5,"cached_input_tokens":0,"cache_creation_input_tokens":0},"upstream_model":"example/Large-Model"}]}}'
  outcome: observed
assert:
- view: llm.calls.LastCall
  counts:
    at_least: 1
    at_most: 1
- view: llm.calls.LastCall
