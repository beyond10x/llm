    - '{"id":"run-1/label-case/classify","role":"replay","kind":"classification","route_id":"coding-candidate","route_target_id":"candidate-large","upstream_model":"example/Large-Model","outcome":"succeeded","error_code":null,"dispatch":null,"attempts":1,"started_at_unix_ms":1762344000000,"latency_ms":0,"time_to_first_event_ms":0,"usage":{"input_tokens":10,"output_tokens":5,"cached_input_tokens":0,"cache_creation_input_tokens":0},"cost":{"currency":"USD","known_subtotal":"0.055","complete":true,"price_revision":"lab-prices-r1"},"primary_record_id":null}'
