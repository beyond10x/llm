    case_results:
    - turn-case:same
    - label-case:same
    - verdict-case:not-sent
    replay_runs:
    - '{"candidate_route_id":"coding-candidate","cases":3,"corpus_digest":"05db6e7de15424cddc22ef1f4e8a2bb39736bd73b871fe06df360bac22424e7e","currency":"USD","differs":0,"failed":0,"id":"run-1","ledger_id":"replay-spend","money_cap":"0.2","not_sent":1,"reserve":"0.1","same":2,"spent":"0.11","stopped":"limit-exceeded"}'
