type: ess-scenario/1
domain: llm.calls
scenario: a-call-without-a-price-book-records-usage-and-no-cost
summary: a call made without a price book records the usage the model reported and no cost
timeline:
- at: '2026-11-05T12:00:00Z'
  command: llm.calls.Call
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "my-lab"
      category = "self-hosted"

      [[accounts]]
      id = "local"
      provider_id = "my-lab"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[accounts]]
      id = "remote"
      provider_id = "my-lab"
      auth_kind = "bearer"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-token"

      [[endpoints]]
      id = "local-vllm"
      account_id = "local"
      base_url = "http://127.0.0.1:8000/v1"

      [[endpoints]]
      id = "remote-models"
      account_id = "remote"
      base_url = "https://models.example.invalid/v1"

      [[models]]
      id = "small"
      upstream_name = "example/Small-Model"

      [[models]]
      id = "large"
      upstream_name = "example/Large-Model"

      [[serving_models]]
      id = "local-small"
      endpoint_id = "local-vllm"
      model_id = "small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[serving_models]]
      id = "remote-large"
      endpoint_id = "remote-models"
      model_id = "large"
      protocol = "responses"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = true
      reasoning_efforts = ["medium", "high"]
      context_window = 32768
      max_output_tokens = 8192

      [[routes]]
      id = "coding"
      alias = "code"
      fallback_enabled = false

      [[targets]]
      id = "coding-primary"
      route_id = "coding"
      serving_model_id = "local-small"
      position = 0

      [[targets]]
      id = "coding-secondary"
      route_id = "coding"
      serving_model_id = "remote-large"
      position = 1
    turn_json: '{"format":"llm.turn/3","request":{"model":"code","instructions":"","items":[{"kind":"user-text","text":"hello"}],"tools":[],"max_output_tokens":128}}'
    program_json: '{"record_id":"call-unpriced","input_tokens":100,"start_unix_ms":1762344000000,"models":{"local-small":{"answer":"hi","usage":{"input_tokens":12,"output_tokens":3}}}}'
  outcome: observed
assert:
- view: llm.calls.LastCall
  counts:
    at_least: 1
    at_most: 1
- view: llm.calls.LastCall
  contains:
    valid_program: true
    error_code: null
    delivered_text: hi
    records:
    - '{"id":"call-unpriced","role":"primary","kind":"turn","route_id":"coding","route_target_id":"coding-primary","upstream_model":null,"outcome":"succeeded","error_code":null,"dispatch":null,"attempts":1,"started_at_unix_ms":1762344000000,"latency_ms":0,"time_to_first_event_ms":0,"usage":{"input_tokens":12,"output_tokens":3},"cost":null,"primary_record_id":null}'
    shadow_results: []
    case_results: []
