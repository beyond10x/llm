type: ess-scenario/1
domain: llm.budget
scenario: a-renewal-to-the-same-expiry-is-refused
summary: a renewal must move the expiry later; the same instant is refused and a stop is owed (engine.rs renew)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.budget.Exercise
  input:
    program_json: '{"policy":{"id":"scope","currency":"USD","limit":"0.0000001","max_active":4},"steps":[{"step":"apply","at_ms":1,"command":{"command":"reserve","request":{"id":"pod","operation":{"kind":"compute","deployment":"pod","provider":"hosting","account":"owner"},"reserved":"0.00000006","assumption":"price-v1","expires_at_ms":100}}},{"step":"apply","at_ms":2,"command":{"command":"begin","id":"pod"}},{"step":"apply","at_ms":3,"command":{"command":"renew","id":"pod","additional":"0.00000001","expires_at_ms":100,"assumption":"renewal"}}]}'
assert:
- view: llm.budget.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm.budget.LastExecution
  contains:
    valid_program: true
    error_code: null
    storage_failed: false
    results:
    - ok
    - ok
    - err:invalid-expiry
