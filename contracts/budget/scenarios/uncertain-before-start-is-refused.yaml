type: ess-scenario/1
domain: llm.budget
scenario: uncertain-before-start-is-refused
summary: a reservation that never started cannot be marked uncertain (engine.rs command Uncertain)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm.budget.Exercise
  input:
    program_json: '{"policy":{"id":"scope","currency":"USD","limit":"0.0000001","max_active":4},"steps":[{"step":"apply","at_ms":1,"command":{"command":"reserve","request":{"id":"a","operation":{"kind":"inference","binding":{"protocol":"chat-completions","provider":"vendor","account":"account","endpoint":"endpoint","model":"model","binding_revision":"binding-v1"},"billing":"metered","request_id":"request"},"reserved":"0.00000006","assumption":"price-v1","expires_at_ms":100}}},{"step":"apply","at_ms":2,"command":{"command":"uncertain","id":"a","evidence":"timeout"}}]}'
assert:
- view: llm.budget.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm.budget.LastExecution
  contains:
    valid_program: true
    error_code: null
    storage_failed: false
    results:
    - ok
    - err:wrong-phase
