type: ess-scenario/1
domain: llm.decisions
scenario: a-decision-endpoint-call-yields-a-call-record-priced-from-the-cost-table
summary: one decision endpoint call writes one classification record with the target, the upstream model the body named, the reported usage and its cost under the caller's price book
timeline:
- at: '2026-11-06T12:00:00Z'
  command: llm.decisions.Decide
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "openai-compatible"
      category = "hosted"

      [[accounts]]
      id = "main"
      provider_id = "openai-compatible"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[endpoints]]
      id = "fixture"
      account_id = "main"
      base_url = "http://fixture.invalid/v1"

      [[models]]
      id = "luna"
      upstream_name = "gpt-6-luna"

      [[serving_models]]
      id = "decider"
      endpoint_id = "fixture"
      model_id = "luna"
      protocol = "responses"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[routes]]
      id = "deciding"
      alias = "decide"

      [[targets]]
      id = "decide-primary"
      route_id = "deciding"
      serving_model_id = "decider"
      position = 0
    prices_toml: |
      # Fictional fixture prices. No vendor, model or resource is qualified by this example.
      format = "llm.prices/1"
      revision = "lab-prices-r1"
      source = "fixture price list"
      as_of_unix_ms = 1762300800000
      currency = "USD"

      [[models]]
      id = "decider-price"
      serving_model_id = "decider"
      # Replaced by the revision the catalog above has at the fixture server's address.
      binding_revision = "fixture-binding-revision"
      upstream_model = "gpt-6-luna"
      input = { amount = "1", per_units = 1000 }
      cached_input = { amount = "0.5", per_units = 1000 }
      cache_creation_input = { amount = "1", per_units = 1000 }
      output = { amount = "2", per_units = 1000 }
    request_json: '{"model":"decide","input":"The package arrived with a broken screen.","questions":[{"type":"predicate","name":"damaged","instructions":"Does the customer report a damaged item?"}]}'
    program_json: '{"request_id":"req-1","input_tokens":100,"start_unix_ms":1762430400000,"answers":[{"body":{"model":"gpt-6-luna","answers":[{"type":"predicate","name":"damaged","probability":0.95}],"usage":{"input_tokens":1000,"input_tokens_details":{"cached_tokens":200,"cache_write_tokens":100},"output_tokens":50,"output_tokens_details":{"reasoning_tokens":10},"total_tokens":1050}}}]}'
  outcome: observed
assert:
- view: llm.decisions.LastDecide
  counts:
    at_least: 1
    at_most: 1
- view: llm.decisions.LastDecide
  contains:
    valid_program: true
    error_code: null
    answers: ['{"name":"damaged","probability":0.95,"type":"predicate"}']
    upstream_model: gpt-6-luna
    input_tokens: 1000
    output_tokens: 50
    cached_input_tokens: 200
    cache_creation_input_tokens: 100
    reasoning_output_tokens: 10
    request_paths: [/v1/decisions]
    request_bodies:
    - '{"model":"gpt-6-luna","input":"The package arrived with a broken screen.","questions":[{"type":"predicate","name":"damaged","instructions":"Does the customer report a damaged item?"}]}'
    records:
    - '{"id":"req-1","role":"primary","kind":"classification","route_id":"deciding","route_target_id":"decide-primary","upstream_model":"gpt-6-luna","outcome":"succeeded","error_code":null,"dispatch":null,"attempts":1,"started_at_unix_ms":1762430400000,"latency_ms":0,"time_to_first_event_ms":null,"usage":{"input_tokens":1000,"output_tokens":50,"cached_input_tokens":200,"cache_creation_input_tokens":100,"reasoning_output_tokens":10},"cost":{"currency":"USD","known_subtotal":"1","complete":true,"price_revision":"lab-prices-r1"},"primary_record_id":null}'
