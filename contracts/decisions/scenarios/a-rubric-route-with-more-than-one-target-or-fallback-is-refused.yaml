type: ess-scenario/1
domain: llm.decisions
scenario: a-rubric-route-with-more-than-one-target-or-fallback-is-refused
summary: a rubric naming a route with two targets and fallback on is refused as route-not-pinned before any call; no request is sent, no record written and no verdict returned
timeline:
- at: '2026-11-24T12:00:00Z'
  command: llm.decisions.Judge
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "my-lab"
      category = "self-hosted"

      [[accounts]]
      id = "local"
      provider_id = "my-lab"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[accounts]]
      id = "remote"
      provider_id = "my-lab"
      auth_kind = "bearer"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-token"

      [[endpoints]]
      id = "local-vllm"
      account_id = "local"
      base_url = "http://127.0.0.1:8000/v1"

      [[endpoints]]
      id = "remote-models"
      account_id = "remote"
      base_url = "https://models.example.invalid/v1"

      [[models]]
      id = "small"
      upstream_name = "example/Small-Model"

      [[models]]
      id = "large"
      upstream_name = "example/Large-Model"

      [[serving_models]]
      id = "local-small"
      endpoint_id = "local-vllm"
      model_id = "small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[serving_models]]
      id = "remote-large"
      endpoint_id = "remote-models"
      model_id = "large"
      protocol = "responses"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = true
      reasoning_efforts = ["medium", "high"]
      context_window = 32768
      max_output_tokens = 8192

      [[routes]]
      id = "coding"
      alias = "code"
      fallback_enabled = true

      [[targets]]
      id = "coding-primary"
      route_id = "coding"
      serving_model_id = "local-small"
      position = 0

      [[targets]]
      id = "coding-secondary"
      route_id = "coding"
      serving_model_id = "remote-large"
      position = 1

      [[routes]]
      id = "judging"
      alias = "judge"
      fallback_enabled = false

      [[targets]]
      id = "judging-primary"
      route_id = "judging"
      serving_model_id = "remote-large"
      position = 0
    rubric_json: '{"id":"helpfulness","version":"v3","text":"Score from 1 to 5 how well the answer addresses the question, and say whether it passes.","schema":{"type":"object","properties":{"score":{"type":"integer","minimum":1,"maximum":5},"pass":{"type":"boolean"}},"required":["score","pass"],"additionalProperties":false},"route_alias":"code"}'
    subject_text: 'Question: what is the capital of France? Answer: Paris.'
    program_json: '{"input_tokens":100,"runs":[{"request_id":"req-1","start_unix_ms":1762430400000,"models":{"local-small":{"answer":"{\"score\":5,\"pass\":true}","upstream_model":"example/Small-Model"},"remote-large":{"answer":"{\"score\":5,\"pass\":true}","upstream_model":"example/Large-Model-2026-09"}}}]}'
  outcome: observed
assert:
- view: llm.decisions.LastVerdict
  counts:
    at_least: 1
    at_most: 1
- view: llm.decisions.LastVerdict
  contains:
    valid_program: true
    error_code: route-not-pinned
    rubric_version: null
    rubric_digest: null
    route_target_id: null
    upstream_model: null
    verdict_json: null
    call_record_id: null
    request_digest: null
    request_digests: []
    verdict_jsons: []
    records: []
