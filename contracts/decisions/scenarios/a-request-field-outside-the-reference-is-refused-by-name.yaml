- at: '2026-11-06T12:00:00Z'
  command: llm.decisions.Decide
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "openai-compatible"
      category = "hosted"

      [[accounts]]
      id = "main"
      provider_id = "openai-compatible"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[endpoints]]
      id = "fixture"
      account_id = "main"
      base_url = "http://fixture.invalid/v1"

      [[models]]
      id = "luna"
      upstream_name = "gpt-6-luna"

      [[serving_models]]
      id = "decider"
      endpoint_id = "fixture"
      model_id = "luna"
      protocol = "responses"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[routes]]
      id = "deciding"
      alias = "decide"

      [[targets]]
      id = "decide-primary"
      route_id = "deciding"
      serving_model_id = "decider"
      position = 0
    request_json: '{"model":"decide","input":"The package arrived with a broken screen.","questions":[{"type":"predicate","name":"damaged","instructions":"Does the customer report a damaged item?"}],"temperature":0}'
    program_json: '{"request_id":"req-1","input_tokens":100,"start_unix_ms":1762430400000,"answers":[{"body":{"model":"gpt-6-luna","answers":[{"type":"predicate","name":"damaged","probability":0.95}],"usage":{"input_tokens":42,"input_tokens_details":{"cached_tokens":0,"cache_write_tokens":0},"output_tokens":0,"output_tokens_details":{"reasoning_tokens":0},"total_tokens":42}}}]}'
