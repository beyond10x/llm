type: ess-scenario/1
domain: llm.decisions
scenario: a-forced-tool-classifier-returns-one-label-with-a-confidence-per-label
summary: a classifier forcing one tool whose parameters are the label set's schema reaches only the target with tools and reads one label with a confidence per label from the call's arguments
timeline:
- at: '2026-11-06T12:00:00Z'
  command: llm.decisions.Classify
  input:
    catalog_toml: |
      # Illustrative declarations, not qualification of a particular model or deployment.
      format = "llm.catalog/1"

      [[providers]]
      id = "my-lab"
      category = "self-hosted"

      [[accounts]]
      id = "local"
      provider_id = "my-lab"
      auth_kind = "anonymous"
      billing_kind = "self-hosted"

      [[accounts]]
      id = "remote"
      provider_id = "my-lab"
      auth_kind = "bearer"
      billing_kind = "metered"
      secret_reference_id = "lab-llm-token"

      [[endpoints]]
      id = "local-vllm"
      account_id = "local"
      base_url = "http://127.0.0.1:8000/v1"

      [[endpoints]]
      id = "remote-models"
      account_id = "remote"
      base_url = "https://models.example.invalid/v1"

      [[models]]
      id = "small"
      upstream_name = "example/Small-Model"

      [[models]]
      id = "large"
      upstream_name = "example/Large-Model"

      [[serving_models]]
      id = "local-small"
      endpoint_id = "local-vllm"
      model_id = "small"
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = false
      tool_choice = false
      temperature = false
      top_p = false
      reasoning_efforts = []
      context_window = 4096
      max_output_tokens = 1024

      [[serving_models]]
      id = "remote-large"
      endpoint_id = "remote-models"
      model_id = "large"
      protocol = "responses"
      [serving_models.capabilities]
      tools = true
      tool_choice = true
      temperature = true
      top_p = true
      reasoning_efforts = ["medium", "high"]
      context_window = 32768
      max_output_tokens = 8192

      [[routes]]
      id = "coding"
      alias = "code"
      fallback_enabled = true

      [[targets]]
      id = "coding-primary"
      route_id = "coding"
      serving_model_id = "local-small"
      position = 0

      [[targets]]
      id = "coding-secondary"
      route_id = "coding"
      serving_model_id = "remote-large"
      position = 1
    label_set_json: '{"id":"sentiment","version":"v1","labels":["positive","negative","neutral"]}'
    chain_json: '{"id":"sentiment-chain","deadline_ms":30000,"classifiers":[{"id":"tool","path":"ForcedTool","route_alias":"code"}]}'
    input_text: the film was dreadful
    program_json: '{"request_id":"req-1","input_tokens":100,"start_unix_ms":1762430400000,"models":{"remote-large":{"tool_arguments":"{\"label\":\"negative\",\"confidences\":{\"positive\":200,\"negative\":9700,\"neutral\":100}}","upstream_model":"example/Large-Model"}}}'
  outcome: observed
assert:
- view: llm.decisions.LastClassification
  counts:
    at_least: 1
    at_most: 1
- view: llm.decisions.LastClassification
  contains:
    valid_program: true
    error_code: null
    tried: [tool]
    results: ['tool:decided']
    label: negative
    confidences:
    - {label: positive, confidence_bps: 200}
    - {label: negative, confidence_bps: 9700}
    - {label: neutral, confidence_bps: 100}
    final_cause: null
    call_record_ids: [req-1/tool]
    records:
    - '{"id":"req-1/tool","role":"primary","kind":"classification","route_id":"coding","route_target_id":"coding-secondary","upstream_model":"example/Large-Model","outcome":"succeeded","error_code":null,"dispatch":null,"attempts":1,"started_at_unix_ms":1762430400000,"latency_ms":0,"time_to_first_event_ms":0,"usage":{},"cost":null,"primary_record_id":null}'
