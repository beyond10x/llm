[package]
name = "b10x-llm-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Injected secret resolution and caller-managed credential refresh; optional backend adapters."

[lints]
workspace = true

[lib]
name = "llm_credentials"

[features]
default = []
codex-auth-file = ["dep:base64", "dep:rustix", "dep:serde_json", "dep:sha2"]
codex-renewal = ["codex-auth-file", "dep:llm-http", "dep:tempfile"]
environment = ["dep:sha2"]
file = ["dep:rustix", "dep:sha2"]
json-pointer = ["dep:serde_json", "dep:sha2"]
keychain = ["dep:keyring-core", "dep:sha2"]
native-keychain = ["keychain", "dep:zbus-secret-service-keyring-store", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store"]
secrets = ["dep:secrets-core", "dep:secrets-keychain", "dep:keyring-core", "dep:sha2"]

[dependencies]
llm-core.workspace = true
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tokio.workspace = true
sha2 = { workspace = true, optional = true }
base64 = { version = "0.22.1", optional = true, default-features = false, features = ["alloc"] }
serde_json = { workspace = true, optional = true, features = ["raw_value"] }
keyring-core = { version = "1.0.0", optional = true }
llm-http = { workspace = true, optional = true }
tempfile = { version = "3.27", optional = true }
secrets-core = { git = "https://github.com/beyond10x/secrets", tag = "v0.5.0", optional = true }
secrets-keychain = { git = "https://github.com/beyond10x/secrets", tag = "v0.5.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", optional = true, default-features = false, features = ["std", "fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", optional = true, default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", optional = true }

[dev-dependencies]
async-trait = "0.1"
toml.workspace = true
serde_json.workspace = true
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }
llm-http.workspace = true
llm-messages = { package = "b10x-llm-messages", path = "../llm-messages" }
llm-providers.workspace = true
llm-routing = { package = "b10x-llm-routing", path = "../llm-routing" }

[[example]]
name = "live_subscription_turn"
path = "examples/live_subscription_turn/main.rs"
required-features = ["secrets", "native-keychain"]
