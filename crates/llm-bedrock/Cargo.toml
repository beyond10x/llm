[package]
name = "llm-bedrock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Amazon Bedrock Runtime behind the model port: Converse and Anthropic InvokeModel, event-stream decoding and hand-written SigV4."

[lints]
workspace = true

[lib]
name = "llm_bedrock"

[dependencies]
llm-core.workspace = true
llm-credentials.workspace = true
llm-http.workspace = true
llm-messages.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
percent-encoding = "2.3"
ring = { version = "0.17.14", default-features = false }

[features]
default = []
process = ["tokio/process"]

[dev-dependencies]
tempfile = "3.27"

[[test]]
name = "process_credentials"
harness = false
required-features = ["process"]
