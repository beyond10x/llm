format = "llm.provider-description/1"

[provider]
id = "runpod"
category = "gpu-cloud"

[inference]
base_url_template = "https://{instance}-8000.proxy.runpod.net/v1/"
protocols = ["chat-completions", "messages", "responses"]
auth_kind = "bearer"

[control_plane]
openapi_url = "https://rest.runpod.io/v1/openapi.json"
