[package]
name = "b10x-llm-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Builds the Chat Completions, Responses or Messages port a catalog serving model declares, with the caller's resolver for its account."

[lints]
workspace = true

[lib]
name = "llm_models"

[features]
default = []
environment = ["llm-credentials/environment"]
file = ["llm-credentials/file"]
keychain = ["llm-credentials/keychain", "dep:keyring-core"]

[dependencies]
llm-core.workspace = true
llm-credentials.workspace = true
llm-http.workspace = true
llm-providers.workspace = true
llm-routing = { package = "b10x-llm-routing", path = "../llm-routing" }
llm-chat = { package = "b10x-llm-chat", path = "../llm-chat" }
llm-responses = { package = "b10x-llm-responses", path = "../llm-responses" }
llm-messages = { package = "b10x-llm-messages", path = "../llm-messages" }
serde.workspace = true
serde_yaml = "0.9"
keyring-core = { version = "1.0.0", optional = true }

[dev-dependencies]
keyring-core = "1.0.0"
serde_json.workspace = true
tempfile = "3.27"
tokio.workspace = true
