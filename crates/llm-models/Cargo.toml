[package]
name = "llm-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Builds the Chat Completions, Responses or Messages port a catalog serving model declares, with the caller's resolver for its account, and reads llm.routes/1 model routes into a catalog and resolvers."

[lints]
workspace = true

[lib]
name = "llm_models"

[features]
default = []
environment = ["llm-credentials/environment"]
file = ["llm-credentials/file"]
keychain = ["llm-credentials/keychain", "dep:keyring-core"]

[dependencies]
llm-core.workspace = true
llm-credentials.workspace = true
llm-http.workspace = true
llm-providers.workspace = true
llm-routing = { path = "../llm-routing" }
llm-chat = { path = "../llm-chat" }
llm-responses = { path = "../llm-responses" }
llm-messages = { path = "../llm-messages" }
llm-bedrock = { path = "../llm-bedrock" }
llm-cost = { path = "../llm-cost" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
toml.workspace = true
url.workspace = true
keyring-core = { version = "1.0.0", optional = true }

[dev-dependencies]
keyring-core = "1.0.0"
serde_json.workspace = true
tempfile = "3.27"
tokio.workspace = true
