[package]
name = "llm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The llm command: lists the models an llm.routes/1 configuration file declares and runs one streamed turn on any of them."

[lints]
workspace = true

[lib]
name = "llm_cli"

[[bin]]
name = "llm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
llm-core.workspace = true
llm-http.workspace = true
llm-models = { path = "../llm-models", features = ["environment", "file"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
url.workspace = true

[dev-dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
llm-bedrock = { path = "../llm-bedrock" }
serde_json.workspace = true
tempfile = "3.27"
