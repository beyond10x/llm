[package]
name = "llm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The llm command: lists the models an llm.routes/1 configuration file declares, runs one streamed turn on any of them and replays a recorded corpus under a money cap."

[lints]
workspace = true

[lib]
name = "llm_cli"

[[bin]]
name = "llm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
keyring-core = "1.0.0"
llm-calls = { path = "../llm-calls" }
llm-core.workspace = true
llm-cost = { path = "../llm-cost" }
llm-credentials = { workspace = true, features = ["native-keychain"] }
llm-decide = { path = "../llm-decide" }
llm-http.workspace = true
llm-models = { path = "../llm-models", features = ["environment", "file", "keychain", "process"] }
llm-routing = { path = "../llm-routing" }
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

[dev-dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
llm-bedrock = { path = "../llm-bedrock" }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27"

[[test]]
name = "credential_process"
harness = false
