domain: llm.responses

# This is the verification adapter's observation contract for the OpenAI Responses projection.
# A projection or a stream decoding is an observation of the pure Rust functions in
# `crates/llm-responses`, not a request that was sent, a response that was received or a
# provider that was reached. The conformance adapter retains the actual returned values until
# the next observation in that scenario. It neither chooses expected outcomes from input
# predicates nor simulates a provider.
#
# Live delivery (Harness harness-responses/src/lib.rs:353-359, harness-loop/src/lib.rs:1802).
# The Responses client decodes each server-sent-event payload as it arrives and hands the
# stream events that payload produced to the caller's sink before it reads the next payload, as
# the Messages client does. The events reach the sink in wire order, the same sequence
# `DecodeStream` reports as `stream_events` for the whole stream, and reading stops at the
# first `response.completed`, `response.incomplete`, `response.failed` or `error` payload.
# `DecodeStream` stops there too: a payload after the first terminal object is not read, shows
# nothing and changes no item, so the decoder and the client report the same turn. The
# transport's bounds (bytes per event, bytes and events per stream, the turn's total limit)
# hold while events are handed over: a payload over a bound ends the turn after the events of
# the payloads before it were shown, and nothing after it is shown.
#
# A sink refusal, a cancellation or the turn deadline while an event is handed over ends the
# turn at once: nothing more is read, the failure has dispatch `accepted`, and it carries the
# evidence decoded up to that point, which is the serving binding and, only when a terminal
# object had already been decoded, that object's counters. Counters that were not read stay
# absent, never zero.
#
# Retry agreement (wave 2026-10-05-w27). A transport failure while reading the stream, such
# as a cut connection, after any payload other than `response.created`,
# `response.in_progress`, `response.queued` or `keepalive` arrived is final: its retry class is
# not retriable. A `keepalive` advances no turn (Harness harness-responses/src/lib.rs:421), so a
# cut after nothing but those payloads keeps the transport's own retry class, as Harness
# retries an attempt that answered nothing. Routing's own rule, that an attempt which showed any
# event on
# the caller's sink is never retried, sees the same events live; the client's rule is the
# stricter of the two and covers a payload that produced output without a visible event.
#
# Provider overload. The exact machine code `server_is_overloaded`, whether on a top-level
# `error` or inside `response.failed`, is `unavailable`, with accepted dispatch and no provider
# prose in its diagnostic. It permits another identical attempt only before output: the client
# clears retriability after any prior payload outside the lifecycle-only set above, including an
# opening item that emits no sink event. Unknown codes and actual refusals remain non-retriable.
# The client still makes one attempt; routing or the caller owns any bounded retry policy.
#
# Kept text (row R36). The caller was shown text through `response.output_text.delta`, one
# output item per `item_id`. The text of each such item is kept in the turn whenever no message
# the turn carries is that item: one assistant message, its text the item's deltas in arrival
# order. A message the turn carries for the same item (its `id` equals the deltas' `item_id`),
# from the terminal `output` or from the streamed items, outranks that item's deltas, and they
# add nothing. A message or a delta that names no item cannot be told apart from any other, so
# it counts as the same item. Kept messages are placed by the `output_index` of their first
# delta, ascending and stable among equal indexes, whatever order their first deltas arrived
# in; one whose delta names no index, or an index past the end, goes after every other item.
# This holds whether the terminal `output` was empty, absent, or carried other items, and for
# `response.incomplete` as for `response.completed`.
#
# The terminal sentinel (row R3). This route needs no `data: [DONE]` line: terminal truth is the
# response object. A route that sends one after the terminal object still answers its turn,
# because nothing after the first terminal object is read. A `data: [DONE]` line before any
# terminal object is not a JSON payload and ends the turn as `protocol`, dispatch `accepted`.
#
# Unknown output items (row R25). An output item of a type this subset does not model, whether
# the terminal `output` carries it or `response.output_item.done` streams it, is kept in the turn
# as opaque state bound to the serving binding, JSON-equal to what arrived, and each time one is
# read the caller is shown an `unknown-output-item` warning. It is never dropped.
#
# Request bytes (row H31). `encode_request` returns the exact bytes of the request body. The
# client sends what it returns and serialises the body nowhere else, so a caller or a test that
# calls it holds the bytes the client sends. `Project` observes those bytes as `encoded_body`,
# and the body's top-level field names, in encoded order, as `body_fields`.
#
# Unset stays absent (row R14). A field the turn leaves unset is absent from the body, never
# present as `null`: an unset `max_output_tokens`, `temperature`, `top_p`, `reasoning` effort, an
# automatic `tool_choice`, and the conversation key below when there is no conversation.
#
# Conversation identity (rows R8, R13). Nothing names a conversation unless the caller opts in by
# giving the client one conversation: an identifier the caller mints for that conversation and,
# optionally, an originator naming the calling application. A client without one sends what it
# always sent, which the Codex backend accepted on the 2026-10-04 probe: no `prompt_cache_key`, and
# no header beyond `accept`, `content-type` and the binding's authentication header. A client with
# one serves that conversation only. Every request it sends carries `prompt_cache_key` equal to
# the identifier in the body, and the headers `session-id`, the identifier, and
# `x-client-request-id`, the identifier, `-`, and the number of requests that client sent before
# this one, in decimal, so each attempt is a new request id of the same conversation. It sends
# `originator` only when the caller named one, and never invents one. The non-secret headers are,
# in order: `accept: text/event-stream`, `content-type: application/json`, then `originator`,
# `session-id` and `x-client-request-id` where they apply; `Project` observes them, for the
# client's first request, as `request_headers`. Ingress does not read `prompt_cache_key`: the
# neutral turn has no conversation to carry it in, so a body carrying one is refused as a field
# outside the subset, and `request_preserved` is false for a projection that sent one.
#
# Tool results (row R18). Every tool result travels as the string `{"ok":<bool>,"output":<value>}`,
# a successful string result included, where Harness sends a successful string unenveloped and a
# failure as `{"ok":false,"error":<value>}`. The difference is deliberate: an envelope used only
# for some results makes a successful result shaped like one indistinguishable from a failure,
# and a successful string from a successful number or object, so reading a body back could flip
# `failed` or change the value. One envelope for every result is what lets ingress return the turn
# that was projected, field for field.
entities:
  - name: llm.responses.RequestProjection
    identity: {name: projection_id, type: String}
    fields: &projection_facts
      - {name: accepted, type: Boolean}
      - {name: error_code, type: Optional<String>}
      # The endpoint path this wire serves, appended to a binding's base URL.
      - {name: path, type: Optional<String>}
      # What the body addresses. The upstream name, never the caller's alias.
      - {name: wire_model, type: Optional<String>}
      - {name: stream, type: Optional<Boolean>}
      - {name: store, type: Optional<Boolean>}
      - {name: include, type: List<String>}
      # The whole projected `input` array, compactly encoded, so a fixture pins it exactly.
      - {name: input_json, type: Optional<String>}
      - {name: tool_names, type: List<String>}
      - {name: tool_choice, type: Optional<String>}
      - {name: max_output_tokens, type: Optional<String>}
      # Which sampling fields reached the wire. An absent one is absent from this list.
      - {name: sampling, type: List<String>}
      # Whether reading the projected body back through the same contract returns the turn
      # that produced it, field for field.
      - {name: request_preserved, type: Boolean}
      # The exact bytes `encode_request` returned, which are the bytes the client sends (H31).
      - {name: encoded_body, type: Optional<String>}
      # The body's top-level field names, in encoded order. An unset field is not here (R14).
      - {name: body_fields, type: List<String>}
      # The conversation key the body carries, absent without a conversation (R13).
      - {name: prompt_cache_key, type: Optional<String>}
      # Every header the client sets other than authentication, as `name: value`, for the
      # client's first request (R8).
      - {name: request_headers, type: List<String>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}

  - name: llm.responses.StreamDecoding
    identity: {name: decoding_id, type: String}
    fields: &stream_facts
      - {name: accepted, type: Boolean}
      - {name: error_code, type: Optional<String>}
      # The diagnostic this crate wrote. Never text the provider wrote.
      - {name: error_message, type: Optional<String>}
      - {name: dispatch, type: Optional<String>}
      - {name: stop_reason, type: Optional<String>}
      - {name: incomplete_reason, type: Optional<String>}
      # The decoded neutral items, compactly encoded. They include the text a caller was shown
      # and the terminal object omitted (kept text, above).
      - {name: items_json, type: Optional<String>}
      # What a caller watching the stream would have been shown, in order. The client shows
      # each one as the payload that produced it arrives (live delivery, above).
      - {name: stream_events, type: List<String>}
      - {name: upstream_model, type: Optional<String>}
      - {name: response_id, type: Optional<String>}
      # True means the reported counters are terminal, not that every count is known.
      - {name: final_usage, type: Optional<Boolean>}
      # Counters are carried as decimal text so an exact u64 crosses without a float.
      - {name: input_tokens, type: Optional<String>}
      - {name: output_tokens, type: Optional<String>}
      - {name: cached_input_tokens, type: Optional<String>}
      - {name: cache_creation_input_tokens, type: Optional<String>}
      - {name: reasoning_output_tokens, type: Optional<String>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}

  - name: llm.responses.RequestIngestion
    identity: {name: ingestion_id, type: String}
    fields: &ingestion_facts
      - {name: accepted, type: Boolean}
      - {name: error_code, type: Optional<String>}
      # The whole neutral llm.turn/3 document the wire body was read into.
      - {name: turn_json, type: Optional<String>}
      # The operator's own model identifier, never the upstream name the body addressed.
      - {name: model, type: Optional<String>}
      - {name: instructions, type: Optional<String>}
      # `unattributed-opaque` names an entry carried without a binding: never `opaque`, which
      # would mean ingress stamped the reading binding onto state it could not attribute.
      - {name: item_kinds, type: List<String>}
      - {name: tool_names, type: List<String>}
      # Whether the turn read out of the body projects again without refusal. False means a
      # gateway accepted a request its own outgoing side cannot forward.
      - {name: reprojected, type: Boolean}
      # Whether that re-projection reproduces the body that was read. False means a field was
      # accepted, never read, and silently rewritten on the way back out.
      - {name: body_preserved, type: Boolean}
      # The fixed diagnostic that refused forwarding the turn as ingress read it, if any.
      - {name: forward_refusal, type: Optional<String>}
      # The re-projected `input` after the adapter, standing in for the caller, explicitly binds
      # every unattributed entry to the reading binding. Null when even that is refused.
      - {name: bound_input_json, type: Optional<String>}
      # Whether that bound re-projection reproduces every field of the body that was read.
      - {name: bound_body_preserved, type: Boolean}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}

commands:
  - name: llm.responses.Project
    # Project a versioned neutral turn onto the wire body, then read that body back through the
    # same contract. No I/O, no credential and no endpoint is involved.
    input:
      # Serialized llm.catalog Provenance, raw on purpose: a malformed binding must reach the
      # production decoder instead of being filtered by the test target.
      - {name: binding_json, type: String}
      - {name: upstream_model, type: String}
      # Serialized llm.turn/3, raw for the same reason.
      - {name: turn_json, type: String}
      # The conversation the caller opted the client into. Absent means none (R8, R13).
      - {name: conversation_id, type: Optional<String>}
      # The calling application the caller named for that conversation. Absent means none.
      - {name: originator, type: Optional<String>}
    outcomes:
      - name: observed
        emits: [llm.responses.Projected]
        payload:
          llm.responses.Projected:
            accepted: {generated: true}
        summary: Return facts from projecting and re-reading a turn, including typed refusals.

  - name: llm.responses.DecodeStream
    # Decode one pinned sequence of server-sent-event payloads into a neutral outcome.
    input:
      - {name: binding_json, type: String}
      - {name: upstream_model, type: String}
      # A JSON array of the decoded SSE payloads, in wire order. Framing belongs to llm-http.
      - {name: stream_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.responses.StreamDecoded]
        payload:
          llm.responses.StreamDecoded:
            accepted: {generated: true}
        summary: Return facts from decoding a stream, including refusals and partial evidence.

  - name: llm.responses.Ingest
    # Read one wire request body a gateway received into a neutral turn. The body is raw: a
    # foreign or malformed one must reach the production reader, not a filter in the target.
    input:
      - {name: binding_json, type: String}
      - {name: upstream_model, type: String}
      - {name: body_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.responses.Ingested]
        payload:
          llm.responses.Ingested:
            accepted: {generated: true}
        summary: Return facts from reading a wire body, including typed refusals.

events:
  # Local notification that the adapter finished observing a library return.
  # No message bus, production event publication or delivery guarantee is implied.
  - name: llm.responses.Projected
    fields:
      - {name: accepted, type: Boolean}
  - name: llm.responses.StreamDecoded
    fields:
      - {name: accepted, type: Boolean}
  - name: llm.responses.Ingested
    fields:
      - {name: accepted, type: Boolean}

views:
  - name: llm.responses.LastProjection
    source: llm.responses.RequestProjection
    consistency: read_your_writes
    fields: *projection_facts
  - name: llm.responses.LastStream
    source: llm.responses.StreamDecoding
    consistency: read_your_writes
    fields: *stream_facts
  - name: llm.responses.LastIngestion
    source: llm.responses.RequestIngestion
    consistency: read_your_writes
    fields: *ingestion_facts
