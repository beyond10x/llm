domain: llm.calls

# Router-level records and the two router-level call roles beside the primary call.
#
# A CallRecord is written for every model call a routed caller makes (turn, classification,
# verdict, embed batch): route, target, model, role, timings, usage and priced cost. It holds no
# prompt, answer, tool argument or embedding text, by construction: the record type has no text
# field. Unknown usage stays unknown, never zero; a cost with an unknown line keeps its known
# subtotal and says it is incomplete (llm.accounting.QuotedTotal). The records go to a sink the
# caller injects; llm keeps no ledger of them. A deployed ledger is llm-gateway's.
#
# A routed turn (crate llm-calls, `record_turn`) writes its record once the ordered fallback run
# (llm.routing) returns, and returns that run unchanged; the sink cannot fail. A turn the run
# refuses before it starts (invalid request, unknown alias, invalid policy, no model for a
# target) is no call and writes no record. The record's target, upstream model and usage are the
# last attempt's; its attempt count is every attempt, retries included. Its outcome and error
# code are the run's final result: cancelled when the run was cancelled, failed for any other
# failure, and a failure is its code and dispatch, never its message. A failure's dispatch is the
# furthest any attempt or the final failure reached (not-sent, rejected, unknown, accepted), so a
# limit refusal, deadline or cancellation after an accepted attempt is not recorded as not sent.
# Latency runs from the start of the run to its return, and time to first event to the first
# event the caller's sink was offered that is not a warning (a retry warning is not output). The
# cost covers every attempt, since routing retries and falls back after an accepted retriable
# failure too: each attempt is priced under the caller's price book, matched by serving model and
# binding revision, and the amounts added; only an attempt that was not sent and reported no
# usage is left out, and any unknown line leaves the cost incomplete. Without a price book, or
# without an attempt to price, there is no cost.
#
# A Shadow is a detached second route for a primary route: after the primary call is returned
# to the caller, the same request is sent to the shadow route; its answer reaches only its
# CallRecord (role Shadow, primary_record_id naming the primary's record), never the caller.
# The caller receives a handle with nothing sent and drives it after answering; dropping it
# sends nothing. A shadow call is admitted on an llm.budget ledger per shadow and UTC day of
# the injected clock, whose limit is the daily cap: its reserve is reserved and started in one
# step, so two shadows never both take the last room under the cap, and a day earlier than one
# already admitted is never opened again. Past the cap (or while that day holds spend it cannot
# know) the shadow is not sent and its record says Skipped, not-sent, no attempt and no cost.
# Afterwards the reservation is settled with the record's cost, which covers every attempt; a
# cost that is incomplete, absent for want of a price book, or in another currency is held at
# its reservation, never settled as zero. A shadow failure, slowness or skip never changes,
# delays or fails the primary.
#
# A ReplayRun sends every case of a recorded corpus to a candidate route offline, under a money
# cap held on an llm.budget ledger, and compares each answer with the recorded one. A run that
# stops says why and how many cases it did not send.
#
# A Corpus is the caller's document, `llm.corpus/1`, in JSON: the cases in the order they are
# sent, each a turn, a classification or a verdict request with the answer recorded for it. llm
# reads it and keeps no text of it: no call record and no ReplayRun holds a text of a case. It is
# taken only whole: bytes that are not one JSON document (cut short, anything but whitespace
# after it, a member given twice at any depth), a format other than `llm.corpus/1`, a member the
# format does not declare, a case kind it does not know, a case id given twice, a case id that
# holds `/`, a rubric id of more than 177 bytes, a recorded label outside the case's label set
# and a document past a bound (16 MiB, 4096 cases, 64 levels of nesting) are refused naming the
# member by its path, and no case is sent. The path shows a member's name only where the format
# defines it and `*` for every other member, so a refusal holds no name the corpus's writer
# chose. A recorded verdict is taken as given and not held to its rubric's schema; a case whose
# recorded verdict the schema does not hold is Differs.
#
# The run reserves its `reserve` on a ledger of its own (limit `money_cap`, one reservation at a
# time) before each case and starts it in the same step; amounts are exact decimals of the run's
# currency with nine fractional digits, never doubles. A case is admitted while settled spend
# plus the reserve is at most the cap. Afterwards the reservation is settled with the priced cost
# of every call record the case wrote. The first case the ledger refuses (the cap would be
# passed, or an earlier case's cost is incomplete and so held at its reserve, never settled as
# zero) is not sent and writes one record with outcome Skipped; the run stops there, and that
# case and every case after it count NotSent. Every record of a run has role Replay and names the
# case's primary record when the corpus gives one.
#
# The cap bounds admission, not the spend: the reserve is the caller's upper bound for one case,
# and a case that costs more than it can take the spend past the cap. The run then stops, at its
# last case too, so its spend is at most the cap, less the reserve, plus the cost of that one
# case. A run also stops at a case whose cost is incomplete, whether or not a case follows.
#
# No two calls of one run share a record id. A case's request id is `<run id>/<case id>`, or
# `replay-sha256-<hex>` of both when the longest record id the case writes would be no id; a
# turn's record and a skipped record have that id, a classification's `<request id>/classify` and
# a verdict's `<request id>/<rubric id>`.
#
# A sent case is Same when the candidate's answer equals the recorded one: the label of a
# classification (confidences are not compared), the verdict as canonical JSON (keys sorted, no
# whitespace), or the assistant text of a turn, byte for byte. It is Differs when the call
# returned another answer, or one that is no label of the set or no verdict the rubric's schema
# holds; Failed, with the error code, when the call failed or was refused.
types:
  - name: llm.calls.Role
    kind: enum
    variants: [Primary, Shadow, Replay]
  - name: llm.calls.Kind
    kind: enum
    variants: [Turn, Classification, Verdict, EmbedBatch]
  - name: llm.calls.Outcome
    kind: enum
    # Skipped: a shadow or replay call not sent because its cap would be passed.
    variants: [Succeeded, Failed, Cancelled, Skipped]
  - name: llm.calls.Cost
    kind: struct
    fields:
      - {name: currency, type: String}
      - {name: known_subtotal, type: String}
      - {name: complete, type: Boolean}
      - {name: price_revision, type: String}
  - name: llm.calls.CaseResult
    kind: enum
    # Same: equal label, equal canonical verdict JSON, or equal text. Differs: not equal.
    # Failed: the candidate call failed. NotSent: the run stopped first.
    variants: [Same, Differs, Failed, NotSent]
  - name: llm.calls.CaseKind
    kind: enum
    variants: [Turn, Classification, Verdict]
  - name: llm.calls.CorpusCase
    kind: struct
    fields:
      # Distinct within the corpus; names the case in every result.
      - {name: id, type: String}
      - {name: kind, type: llm.calls.CaseKind}
      # The caller's estimate of the request's input tokens, which routing admits the candidate
      # route's target against; llm counts none.
      - {name: input_tokens, type: Integer}
      # The record of the call whose answer was recorded; the case's replay records name it.
      - {name: primary_record_id, type: Optional<String>}
      # Turn: the `llm.turn` document, a JSON object in the corpus; its model is replaced by the
      # candidate route's alias.
      - {name: turn, type: Optional<String>}
      # Classification: the label set (a JSON object: id, version, labels), the standing
      # instructions (empty when absent) and the input.
      - {name: label_set, type: Optional<String>}
      - {name: instructions, type: Optional<String>}
      - {name: input, type: Optional<String>}
      # Verdict: the rubric (a JSON object: id, version, text, schema) and the subject.
      - {name: rubric, type: Optional<String>}
      - {name: subject, type: Optional<String>}
      # The recorded answer, a JSON object with exactly one member for the kind: `text`,
      # `label` (one of the label set) or `verdict` (any JSON value, compared as canonical JSON).
      - {name: recorded, type: String}
  - name: llm.calls.CaseReport
    kind: struct
    fields:
      - {name: case_id, type: String}
      - {name: result, type: llm.calls.CaseResult}
      # Set exactly for Failed.
      - {name: error_code, type: Optional<String>}
entities:
  - name: llm.calls.CallRecord
    identity: {name: id, type: String}
    fields:
      - {name: role, type: llm.calls.Role}
      - {name: kind, type: llm.calls.Kind}
      - {name: route_id, type: String}
      # The target that answered or failed last; absent when no target was attempted.
      - {name: route_target_id, type: Optional<String>}
      - {name: upstream_model, type: Optional<String>}
      - {name: outcome, type: llm.calls.Outcome}
      - {name: error_code, type: Optional<String>}
      # The failure's dispatch evidence; absent when the call succeeded.
      - {name: dispatch, type: Optional<llm.catalog.Dispatch>}
      - {name: attempts, type: Integer}
      - {name: started_at_unix_ms, type: Integer}
      - {name: latency_ms, type: Optional<Integer>}
      - {name: time_to_first_event_ms, type: Optional<Integer>}
      - {name: usage, type: llm.accounting.Usage}
      - {name: cost, type: Optional<llm.calls.Cost>}
      # The primary call a shadow or replay call is compared with.
      - {name: primary_record_id, type: Optional<String>}
    relations:
      - {name: route, kind: references, target: llm.catalog.Route, cardinality: one, via: route_id}
      - {name: target, kind: references, target: llm.catalog.RouteTarget, cardinality: one, via: route_target_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.calls.Shadow
    identity: {name: id, type: String}
    fields:
      - {name: primary_route_id, type: String}
      - {name: shadow_route_id, type: String}
      # Exact decimal in the ledger's currency, per UTC day.
      - {name: daily_cap, type: String}
      # Exact decimal each shadow call holds until its cost settles it; above zero, at most the cap.
      - {name: reserve, type: String}
      - {name: ledger_id, type: String}
    relations:
      - {name: primary, kind: references, target: llm.catalog.Route, cardinality: one, via: primary_route_id}
      - {name: shadow, kind: references, target: llm.catalog.Route, cardinality: one, via: shadow_route_id}
      - {name: ledger, kind: references, target: llm.budget.Ledger, cardinality: one, via: ledger_id}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.calls.ReplayRun
    identity: {name: id, type: String}
    fields:
      - {name: candidate_route_id, type: String}
      # Lowercase hex sha256 of the corpus document's bytes as given, so two runs over one
      # corpus are comparable; a corpus written with other whitespace or key order is another.
      - {name: corpus_digest, type: String}
      - {name: currency, type: String}
      # Exact decimal in the run's currency.
      - {name: money_cap, type: String}
      # Exact decimal each case holds until its cost settles it; above zero, at most the cap.
      - {name: reserve, type: String}
      - {name: ledger_id, type: String}
      # The ledger's exposure when the run ended: settled plus held. With `stopped`
      # uncertain-spend it counts what is held for the case whose cost is incomplete, a hold and
      # not a known spend.
      - {name: spent, type: String}
      # Why the ledger admits no further case (limit-exceeded, uncertain-spend): set when a case
      # was not sent, and when the last case took the spend past the cap or has an incomplete
      # cost. Absent when every case was sent and the spend is known and within the cap.
      - {name: stopped, type: Optional<String>}
      - {name: cases, type: Integer}
      - {name: same, type: Integer}
      - {name: differs, type: Integer}
      - {name: failed, type: Integer}
      - {name: not_sent, type: Integer}
      # One per case, in the corpus's order.
      - {name: results, type: List<llm.calls.CaseReport>}
    relations:
      - {name: candidate, kind: references, target: llm.catalog.Route, cardinality: one, via: candidate_route_id}
      - {name: ledger, kind: references, target: llm.budget.Ledger, cardinality: one, via: ledger_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.calls.Corpus
    # Its identity is the digest of its bytes.
    identity: {name: digest, type: String}
    fields:
      - {name: format, type: String}
      - {name: cases, type: List<llm.calls.CorpusCase>}
    lifecycle: {initial: Read, states: [Read], terminal: [Read]}
  - name: llm.calls.CallObservation
    identity: {name: observation_id, type: String}
    fields: &call_facts
      - {name: valid_program, type: Boolean}
      - {name: error_code, type: Optional<String>}
      # The text the caller received from the primary call.
      - {name: delivered_text, type: Optional<String>}
      # Every record the sink received, as canonical JSON, in order.
      - {name: records, type: List<String>}
      # Per shadow and call: shadow-route:outcome, a skip followed by the ledger's refusal
      # (shadow-route:skipped:limit-exceeded) and a refused route by its error code.
      - {name: shadow_results, type: List<String>}
      # Per replay case, for every run in order: case-id:result, a failed case followed by its
      # error code (case-id:failed:unavailable).
      - {name: case_results, type: List<String>}
      # The first shadow's exposure (settled plus held) on its ledger for the clock's UTC day.
      - {name: spent_today, type: Optional<String>}
      # Every replay run, in order, as JSON without its per-case results.
      - {name: replay_runs, type: List<String>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm.calls.Call
    # A routed call with a record sink and optional shadows, over in-process scripted models
    # and a scripted clock and price book; no network. The program may repeat the call at later
    # wall-clock times on the same models and shadow ledger.
    input:
      - {name: catalog_toml, type: String}
      - {name: turn_json, type: String}
      - {name: prices_toml, type: Optional<String>}
      - {name: shadows_json, type: Optional<String>}
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.calls.Observed]
        payload:
          llm.calls.Observed:
            valid_program: {generated: true}
        summary: Return what the caller received, every record the sink got and each shadow's outcome.
  - name: llm.calls.Replay
    # A replay of the corpus on the run's candidate route, over in-process scripted models (each
    # serving model answers its calls in the authored order), a scripted clock and the price
    # book; no network. The program may repeat the run under other ids on a fresh ledger.
    input:
      - {name: catalog_toml, type: String}
      - {name: corpus_json, type: String}
      - {name: prices_toml, type: String}
      - {name: run_json, type: String}
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.calls.Observed]
        payload:
          llm.calls.Observed:
            valid_program: {generated: true}
        summary: Return each case's result, the records and the spend against the cap.
events:
  - name: llm.calls.Observed
    fields:
      - {name: valid_program, type: Boolean}
views:
  - name: llm.calls.LastCall
    source: llm.calls.CallObservation
    consistency: read_your_writes
    fields: *call_facts
