domain: llm.secrets

# Verification adapter observations, never production events or credential storage.
# Inputs describe disposable OS-file, child-process-environment and mock-store fixture state, not
# expected outcomes.
types:
  - name: llm.secrets.FileShape
    kind: enum
    variants: [Regular, Missing, Symlink, ParentSymlink, Hardlink, Directory, Fifo]
  # Fixture permission arrangements, each one mode away from the private default (a 0700
  # directory holding a 0600 file): the parent at 0770 or 0702, or the leaf at 0700, 0640,
  # 04600 or 0400.
  - name: llm.secrets.ModeFixture
    kind: enum
    variants: [ParentGroupWritable, ParentOtherWritable, FileOwnerExecutable, FileGroupReadable, FileSetuid, FileOwnerReadOnly]
  # What the JSON document behind a pointer-bound reference holds at the caller-named pointer:
  # the fixture token as a JSON string, nothing, a JSON number, an empty string, or a document
  # that is not JSON at all.
  - name: llm.secrets.PointerDocument
    kind: enum
    variants: [TokenAtPointer, PointerAbsent, NonStringAtPointer, EmptyAtPointer, NotJson]
  # Codex login renewal (Harness harness-credential/src/renewal.rs). What the fixture token
  # endpoint answers to a refresh: a new access token with a new refresh token and id token, a new
  # access token with the same refresh token, a new access token alone, an empty access token,
  # an empty refresh token, or an id token that is not a string.
  - name: llm.secrets.TokenAnswer
    kind: enum
    variants: [Rotated, Kept, AccessOnly, EmptyAccess, EmptyRefresh, NonStringIdToken]
  # How the fixture `auth.json` is laid out: the Codex CLI's own key order and indent with keys no
  # renewal reads, or the same layout with a second key that carries a copy of the refresh token.
  - name: llm.secrets.AuthLayout
    kind: enum
    variants: [Codex, RepeatedValue]
  # Which API the observation goes through: the explicit renewal, the renewing resolver, or the
  # read-only resolver, which never renews.
  - name: llm.secrets.RenewalEntry
    kind: enum
    variants: [Renew, RenewingResolver, ReadOnlyResolver]
entities:
  - name: llm.secrets.Probe
    identity: {name: probe_id, type: String}
    fields: &facts
      - {name: error_code, type: Optional<String>}
      - {name: reread_error, type: Optional<String>}
      - {name: matches_content, type: Optional<Boolean>}
      - {name: matches_replacement, type: Optional<Boolean>}
      - {name: version_changed, type: Optional<Boolean>}
      - {name: refresh_error, type: Optional<String>}
      # For a refused first resolve, read again through the source's own `read`, whose refusal
      # carries the reference: whether its message names the reference, and whether it names
      # where the value lives (the file path or the variable name). Absent when nothing refused.
      - {name: refusal_names_reference, type: Optional<Boolean>}
      - {name: refusal_names_location, type: Optional<Boolean>}
      - {name: diagnostics_safe, type: Boolean}
    lifecycle:
      initial: Observed
      states: [Observed]
      terminal: [Observed]
  # One renewal of a Codex login (`b10x-llm-credentials` feature `codex-renewal`), observed
  # against a disposable `auth.json` and a scripted token endpoint on 127.0.0.1. Never the
  # operator's login and never a real token endpoint.
  #
  # When: renewal is due when the access token's JWT `exp` is at or before the clock plus the
  # margin (default 15 minutes, Harness RENEWAL_MARGIN). A token whose `exp` cannot be read is
  # left alone (`undated`): no refresh token is spent on it, nothing is sent or written, and the
  # read-only rule still refuses to send it (`unavailable`), so llm neither guesses it is stale
  # nor sends a credential it cannot date.
  #
  # The exchange: one JSON POST of `{"client_id", "grant_type": "refresh_token",
  # "refresh_token"}` to the configured endpoint, no `scope`, never retried, no redirect, no
  # ambient proxy (llm.transport.PostJson).
  #
  # Write-back: only the values at `/tokens/access_token`, `/tokens/refresh_token` (when the
  # answer carries one), `/tokens/id_token` (when both the document and the answer carry one)
  # and `/last_refresh` (when present, set to the clock in RFC 3339 UTC seconds) change. Each is
  # replaced at its own position in the original text, so every other byte, key order and
  # indent survive, also when the same value appears elsewhere. The result is written to a new
  # file in the same directory with the original's mode, flushed, and renamed over the original
  # only when the original still holds exactly the bytes the renewal read.
  #
  # Refusal codes (`error_code`): `not-absolute`, `missing`, `unavailable`, `too-large` (the
  # read-only rules); `not-a-regular-file` (a symlink or anything but a regular file is not
  # replaced); `no-refresh-token` (due, but nothing at `/tokens/refresh_token`; nothing sent);
  # `exchange-failed` (the POST was refused; `exchange_error` is its llm-core code);
  # `answer-without-access-token`, `answer-invalid-refresh-token`, `answer-invalid-id-token`
  # (nothing written); `changed-during-renewal` (the file changed while the request was in
  # flight; the newer file is kept); `write-failed`. `resolver_error` is the SecretError a
  # resolver reports for the same refusal: a refusal before anything is sent keeps its read
  # code (`no-refresh-token` is `missing`), an exchange the endpoint answered with a refusal
  # status is `refresh-rejected`, and every refusal after the endpoint may have issued new
  # tokens is `refresh-uncertain`.
  - name: llm.secrets.RenewalObservation
    identity: {name: renewal_id, type: String}
    fields: &renewal_facts
      # `renewed`, `not-due` or `undated`; absent when refused or when a resolver was asked.
      - {name: outcome, type: Optional<String>}
      - {name: error_code, type: Optional<String>}
      - {name: resolver_error, type: Optional<String>}
      - {name: exchange_error, type: Optional<String>}
      - {name: exchange_retriable, type: Optional<Boolean>}
      # POSTs the scripted token endpoint received.
      - {name: requests, type: Integer}
      # Whether the one request was a JSON object of exactly `client_id` (the configured one),
      # `grant_type` `refresh_token` and `refresh_token` (the one on disk); absent without one.
      - {name: request_well_formed, type: Optional<Boolean>}
      - {name: refresh_token_rotated, type: Optional<Boolean>}
      # Whether the file holds exactly the bytes the fixture last wrote (before the call, or
      # its concurrent rewrite).
      - {name: file_unchanged, type: Boolean}
      # Whether the file holds exactly the original text with the answer's values (and the
      # clock at `/last_refresh`) in place of the old ones, and nothing else changed.
      - {name: file_spliced, type: Boolean}
      - {name: mode_kept, type: Boolean}
      # Files in the login's directory other than `auth.json` after the call.
      - {name: stray_files, type: Integer}
      # Through a resolver: whether it answered the access token the endpoint issued.
      - {name: resolved_renewed_token, type: Optional<Boolean>}
      # For a refusal: whether its message names `/tokens/refresh_token`.
      - {name: refusal_names_pointer, type: Optional<Boolean>}
      # Whether no Display or Debug of the outcome, the refusal or the configuration carries
      # an access, refresh or id token or the endpoint's answer body.
      - {name: diagnostics_safe, type: Boolean}
    lifecycle:
      initial: Observed
      states: [Observed]
      terminal: [Observed]
commands:
  - name: llm.secrets.ProbeFile
    input:
      - {name: content, type: String}
      - {name: replacement, type: Optional<String>}
      - {name: shape, type: llm.secrets.FileShape}
      - {name: public_readable, type: Boolean}
      - {name: parent_writable, type: Boolean}
      - {name: known_reference, type: Boolean}
      - {name: oversized, type: Boolean}
      # One permission arrangement the fixture applies after the switches above; absent leaves
      # the switches' arrangement. It exists so a scenario can reach each rule of
      # docs/local-secrets.md:46-51 on its own ("not writable by group/others", "no group/other
      # permissions, execution permission or special mode bits"), which the two switches
      # cannot separate.
      - {name: mode, type: Optional<llm.secrets.ModeFixture>}
    outcomes:
      - name: observed
        emits: [llm.secrets.Probed]
        payload:
          llm.secrets.Probed:
            diagnostics_safe: {generated: true}
        summary: Observe actual protected-file resolver results using disposable files.
  - name: llm.secrets.ProbeKeychain
    input:
      - {name: content, type: String}
      - {name: replacement, type: Optional<String>}
      - {name: entry_present, type: Boolean}
      - {name: known_reference, type: Boolean}
      - {name: backend_fault, type: Boolean}
      - {name: oversized, type: Boolean}
    outcomes:
      - name: observed
        emits: [llm.secrets.Probed]
        payload:
          llm.secrets.Probed:
            diagnostics_safe: {generated: true}
        summary: Observe actual keychain resolver results using an explicitly injected mock store.
  # A reference bound to a caller-named environment variable. The adapter starts a child process
  # whose environment holds `content` under that name when `variable_set`, and resolves there:
  # nothing in this process changes its own environment. There is no rotation or oversized case:
  # the variable cannot change inside the child, and Linux caps one environment string at
  # 128 KiB, below the 1 MiB secret bound.
  - name: llm.secrets.ProbeEnvironment
    input:
      - {name: content, type: String}
      - {name: variable_set, type: Boolean}
      - {name: known_reference, type: Boolean}
    outcomes:
      - name: observed
        emits: [llm.secrets.Probed]
        payload:
          llm.secrets.Probed:
            diagnostics_safe: {generated: true}
        summary: Observe actual environment-variable resolver results in a child process.
  # A reference bound to a caller-named RFC 6901 pointer into a JSON document that a protected
  # file holds. `token` is the string the fixture places at `pointer` for `TokenAtPointer`;
  # `matches_content` compares the resolved bytes with it.
  - name: llm.secrets.ProbePointer
    input:
      - {name: token, type: String}
      - {name: pointer, type: String}
      - {name: document, type: llm.secrets.PointerDocument}
      - {name: known_reference, type: Boolean}
    outcomes:
      - name: observed
        emits: [llm.secrets.Probed]
        payload:
          llm.secrets.Probed:
            diagnostics_safe: {generated: true}
        summary: Observe actual JSON-pointer resolver results over a disposable protected file.
  # Renew a disposable Codex `auth.json` against a scripted token endpoint on 127.0.0.1. The
  # access token's `exp` is `expires_in_s` after the fixed clock, or unreadable when absent.
  # `group_readable` makes the file 0640 instead of 0600. `answer_status` and `answer` are what
  # the endpoint replies; `concurrent_change` rewrites the file after the endpoint has read the
  # request and before it answers.
  - name: llm.secrets.RenewCodexLogin
    input:
      - {name: entry, type: llm.secrets.RenewalEntry}
      - {name: expires_in_s, type: Optional<Integer>}
      - {name: margin_s, type: Integer}
      - {name: layout, type: llm.secrets.AuthLayout}
      - {name: refresh_token_present, type: Boolean}
      - {name: group_readable, type: Boolean}
      - {name: answer_status, type: Integer}
      - {name: answer, type: llm.secrets.TokenAnswer}
      - {name: concurrent_change, type: Boolean}
    outcomes:
      - name: observed
        emits: [llm.secrets.Renewed]
        payload:
          llm.secrets.Renewed:
            diagnostics_safe: {generated: true}
        summary: Observe one actual Codex login renewal over a disposable file and a local endpoint.
events:
  - name: llm.secrets.Probed
    fields:
      - {name: diagnostics_safe, type: Boolean}
  - name: llm.secrets.Renewed
    fields:
      - {name: diagnostics_safe, type: Boolean}
views:
  - name: llm.secrets.LastProbe
    source: llm.secrets.Probe
    consistency: read_your_writes
    fields: *facts
  - name: llm.secrets.LastRenewal
    source: llm.secrets.RenewalObservation
    consistency: read_your_writes
    fields: *renewal_facts
