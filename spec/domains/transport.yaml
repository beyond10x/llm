domain: llm.transport

# The shared bounded HTTP and SSE transport (crates/llm-http). One `post_sse` sends exactly once
# to the caller-selected endpoint, with no redirect, no retry and no ambient proxy
# (transport.rs:44-66), refuses an unbounded request before sending (transport.rs:103-123),
# bounds the response headers, every idle gap and the whole exchange (transport.rs:28-40,
# 124-150, 206-236), stops on cancellation, and never synthesises completion: end of stream is
# not a terminal event, and a failure is final for that stream (sse.rs:23, transport.rs:190-204).
# HTTP status is reported as evidence without copying the error body (transport.rs:239-253).
#
# The entities are verification-adapter observations of the real `HttpClient` against a local
# loopback server whose answer the fixture scripts; nothing leaves the host and no credential is
# involved.
#
# Ambient proxy variables never redirect a request (transport.rs:50-52, `no_proxy`). A program
# with `ambient_proxy` runs its exchange in a child process whose HTTP_PROXY, HTTPS_PROXY and
# ALL_PROXY (either case) all name a local listener and whose NO_PROXY is unset, so no other
# lane's environment changes; `proxied_requests` counts the requests that listener received.
#
# Status evidence (transport.rs status_error): 401 and 403 are `unauthorized` and 429 is
# `rate-limited`, all with dispatch `rejected`. 408 and every status from 500 to 599 inclusive
# are `transport` with dispatch `unknown`. 300 to 399 are `refused` with dispatch `unknown`. Any
# other status is `refused` with dispatch `rejected`. A delta-seconds `Retry-After` is that many
# seconds. An HTTP-date `Retry-After` is the time until that date, so a date already past is a
# zero hint whatever the wall clock reads (transport.rs retry_after). A hint never causes a
# second attempt.
#
# Retry class (Harness harness-http/src/status.rs:28-34, sse.rs:142-148). Every refusal says
# whether another identical attempt may answer: `retriable`. Dispatch stays the evidence of
# what the far side may have done and is not rewritten to make a refusal retriable; the class
# is a separate fact. Retriable: 408, 429 and every status from 500 to 599 inclusive (529
# included), a request that failed before any response arrived, a response body that failed
# while streaming, and an end of stream inside an event. Final: 401 and 403, 300 to 399, every
# other status (400 and 409 included), a frame that is not JSON, a line or stream over its
# bound, cancellation and every deadline. The transport itself still sends exactly once;
# whether another attempt is made, and only before any output is visible, is routing's
# decision (llm.routing).
types:
  - name: llm.transport.Framing
    kind: enum
    variants: [DoneSentinel, PayloadsOnly]
entities:
  - name: llm.transport.Client
    identity: {name: id, type: String}
    fields:
      # Each positive and at most one day (transport.rs:47-55).
      - {name: response_headers_ms, type: Integer}
      - {name: idle_ms, type: Integer}
      - {name: total_ms, type: Integer}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.transport.ExchangeObservation
    identity: {name: observation_id, type: String}
    fields: &exchange_facts
      - {name: valid_program, type: Boolean}
      # The refusal that ended the exchange, from `HttpClient::new`, `post_sse` or the stream,
      # as the llm-core error code and dispatch evidence.
      - {name: error_code, type: 'Optional<String>'}
      - {name: dispatch, type: 'Optional<String>'}
      - {name: retry_after_ms, type: 'Optional<Integer>'}
      # The refusal's retry class: true when another identical attempt may answer. Absent when
      # nothing was refused.
      - {name: retriable, type: 'Optional<Boolean>'}
      # Every event the stream yielded, in order: `done`, or `payload:<event name or ->:<data>`.
      - {name: events, type: 'List<String>'}
      # How the stream ended: `end` for a clean end of stream, `error` for a refusal; absent
      # when no stream was returned.
      - {name: end, type: 'Optional<String>'}
      # Whether reading again after a refusal returns the same refusal.
      - {name: sticky, type: 'Optional<Boolean>'}
      # Connections the scripted server accepted, and those a redirect target accepted.
      - {name: requests, type: Integer}
      - {name: redirected_requests, type: Integer}
      # The request line the server received, when it received one.
      - {name: request_line, type: 'Optional<String>'}
      # Whether no diagnostic quotes the server's error body.
      - {name: diagnostics_safe, type: Boolean}
      # Whether the exchange ended within the program's `within_ms` of its start; absent when
      # the program asks nothing. A deadline is a time, and this is the one fact that measures it.
      - {name: ended_within, type: 'Optional<Boolean>'}
      # Requests the ambient proxy listener received; absent unless the program set
      # `ambient_proxy`.
      - {name: proxied_requests, type: 'Optional<Integer>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm.transport.Exchange
    input:
      # A bounded fixture program: the client limits, the request, and what the local server
      # answers and when.
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.transport.Exchanged]
        payload:
          llm.transport.Exchanged:
            valid_program: {generated: true}
        summary: Observe one real exchange with a scripted local server.
events:
  # Test-adapter notification only; there is no production notification transport.
  - name: llm.transport.Exchanged
    fields:
      - {name: valid_program, type: Boolean}
views:
  - name: llm.transport.LastExchange
    source: llm.transport.ExchangeObservation
    consistency: read_your_writes
    fields: *exchange_facts
