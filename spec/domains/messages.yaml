domain: llm.messages

# Producer wire types remain owned by the pinned Messages schema. This entity
# contains only facts observed by the conformance adapter through public codecs.
entities:
  - name: llm.messages.CodecInspection
    identity: {name: observation_id, type: String}
    fields: &codec_facts
      - {name: accepted, type: Boolean}
      - {name: error_code, type: Optional<String>}
      # The diagnostic itself, so a scenario pins that it is fixed and carries no upstream text.
      - {name: error_message, type: Optional<String>}
      - {name: dispatch, type: Optional<String>}
      # The projected body. It carries at most two prompt-cache breakpoints, each
      # `cache_control: {type: ephemeral}`: one on the single `system` text block, sent only when
      # the instruction is not empty, and one rolling marker on the last `text` or `tool_result`
      # block of the last message. Only those two block types are ever marked: a block carried
      # through from the model (`thinking`, `redacted_thinking`) is replayed unmodified, and a
      # tail with nothing markable carries no rolling marker. A `prompt-cache` hint with the
      # lifetime `1h` makes every breakpoint `{type: ephemeral, ttl: 1h}`; the caller's own mark
      # positions are not reproduced.
      #
      # Controls on egress: `thinking` is `{type: adaptive}`, `{type: enabled, budget_tokens: n}`
      # or `{type: disabled}` as the turn holds it; `parallel_tool_calls` `b` is
      # `tool_choice.disable_parallel_tool_use` `!b`, with `{type: auto}` written when the choice
      # is automatic; the effort is `output_config.effort` as the turn names it, `max` included.
      - {name: wire_request, type: Optional<String>}
      # Ingress, read from a Messages request body. Every key this list does not name is refused
      # by its path (`Messages field is outside the declared subset: <path>`), at every level:
      # `thinking.display`, `context_management`, `safeguards`, `output_config.format`,
      # `system[].citations`, `messages[].content[].cache_control.scope` among them.
      #
      # - `thinking` `{type: adaptive}`, `{type: enabled, budget_tokens: n}` (n positive) or
      #   `{type: disabled}` is the turn's thinking control; `budget_tokens` beside `adaptive` or
      #   `disabled` is refused by its path.
      # - `system` is a string, or an array of text blocks joined by a line feed; an empty array
      #   is empty instructions; a block of another type is refused as not text.
      # - `cache_control` `{type: ephemeral}`, with an optional `ttl` of `5m` or `1h`, on a
      #   `system` block, a `text`, `tool_use` or `tool_result` content block, or a tool, is the
      #   `prompt-cache` hint, its lifetime `1h` only when the marks say `1h` (`5m` is the
      #   default and reads as no lifetime). Marks of two lifetimes in one request are refused;
      #   a mark of another type is refused; a mark on a `thinking` or `redacted_thinking` block
      #   is refused by its path.
      # - `output_config.effort` takes any non-empty name, `max` included.
      # - `tool_choice.disable_parallel_tool_use` `v` (boolean, on `auto`, `any` or `tool`) is
      #   `parallel_tool_calls` `!v`.
      # - `metadata` holding only `user_id` (a string) is the `client-metadata` hint; its value
      #   is never kept and never re-emitted.
      # - A `system` message inside `messages` is refused as a role outside the subset.
      - {name: neutral_request, type: Optional<String>}
      # The advisory hints this wire does not send, by name, in the order of `docs/design.md`'s
      # advisory table. Messages carries only `prompt-cache`; `prompt-cache-key`, `verbosity`,
      # `reasoning-summary`, `input-item-ids` and `client-metadata` are omitted whenever present.
      # For egress (`ingress: false`) the hints of the projected turn; for ingress, those the
      # decoded turn would have omitted on this wire. Empty when nothing is omitted.
      - {name: omitted_advisories, type: List<String>}
      # The ingress streaming choice, which the neutral request does not carry.
      - {name: stream, type: Optional<Boolean>}
      # A streamed event, content delta or content block outside the declared subset is
      # preserved as an opaque item bound to the serving binding, never dropped and never ending
      # the turn. A preserved event sits after every content block that had started when it
      # arrived. A complete response has no channel to warn on and still refuses one.
      - {name: items, type: List<String>}
      - {name: text, type: String}
      - {name: reasoning, type: String}
      # Argument fragments as `<call>:<fragment>`, and each stream warning as `<code>:<message>`
      # in the order it was emitted. Preserving an unknown event or content delta warns
      # `unknown-stream-event`; preserving an unknown content block warns `unknown-output-item`.
      # Both messages are fixed and carry no producer text.
      - {name: tool_arguments, type: List<String>}
      # The tool events in the order a caller saw them: `started:<call>:<name>` where the
      # route opened a tool_use block, then `arguments:<call>:<fragment>` for each fragment.
      - {name: tool_stream, type: List<String>}
      - {name: upstream_model, type: Optional<String>}
      - {name: response_id, type: Optional<String>}
      - {name: final_usage, type: Optional<Boolean>}
      # Absent counters are absent from this encoding; unknown is never reported as zero.
      - {name: usage_json, type: Optional<String>}
      - {name: stop_reason, type: Optional<String>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  # What the production Messages client puts on the wire under one account presentation, observed
  # by a scripted server on the loopback interface with an injected resolver that answers a new
  # fixture credential on every resolution. No provider, credential store or login file is
  # involved.
  #
  # Under `subscription-oauth` the client sends the token as `authorization: Bearer <token>` plus
  # `anthropic-beta: oauth-2025-04-20`, and `system` opens with its own unmarked block whose text is
  # exactly "You are Claude Code, Anthropic's official CLI for Claude." and which carries `type` and
  # `text` only. The instruction, when not empty, follows as the last block and keeps the cache
  # breakpoint; an empty instruction leaves the preamble alone. `api-key` and `bearer` send neither
  # the beta header nor the preamble. The credential is resolved through the account's secret
  # reference on every turn, so a rotated credential is used by the next turn. A turn whose hints
  # this wire omits ends, once it has succeeded and never before, with one `advisory-omitted`
  # warning on the caller's sink naming them; a failed turn emits none.
  - name: llm.messages.PresentationObservation
    identity: {name: observation_id, type: String}
    fields: &presentation_facts
      # Whether every turn completed against the scripted server.
      - {name: accepted, type: Boolean}
      - {name: error_code, type: Optional<String>}
      - {name: error_message, type: Optional<String>}
      # The secret reference names the resolver was asked for, in order.
      - {name: resolved_references, type: List<String>}
      # How many requests reached the scripted server.
      - {name: requests, type: Integer}
      # The first request's headers as `<name>: <value>`, sorted by name, without the transport's
      # own `host` and `content-length`; the fixture credential reads `<credential>`.
      - {name: request_headers, type: List<String>}
      # The first request's body, re-encoded with sorted keys.
      - {name: wire_request, type: Optional<String>}
      # For each request, the 1-based ordinal of the resolver answer it carried; 0 for none.
      - {name: presented_credentials, type: List<Integer>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  # What a gateway answers a Messages caller from a neutral outcome, and what this crate's own
  # decoder reads back from that answer under the same fixture binding. The encoder sends only
  # what the decoder reads back as the same outcome: a block, terminal reason or usage report it
  # would read as anything else is refused, never approximated.
  - name: llm.messages.IngressEncoding
    identity: {name: observation_id, type: String}
    fields: &ingress_encoding_facts
      # Whether the encoder answered. A refusal reached before anything was sent is not-sent.
      - {name: accepted, type: Boolean}
      - {name: error_code, type: Optional<String>}
      - {name: error_message, type: Optional<String>}
      - {name: dispatch, type: Optional<String>}
      # Each encoded payload in order, re-encoded with sorted keys: every event of a stream,
      # each carrying the `type` its SSE event is named by, or the one complete message.
      - {name: wire, type: List<String>}
      # Whether this crate's decoder accepted the answer, and its refusal or failure code.
      - {name: decoded_accepted, type: Optional<Boolean>}
      - {name: decoded_error_code, type: Optional<String>}
      # The decoded outcome, labelled as llm.messages.CodecInspection labels one.
      - {name: decoded_items, type: List<String>}
      - {name: decoded_stop_reason, type: Optional<String>}
      - {name: decoded_upstream_model, type: Optional<String>}
      - {name: decoded_response_id, type: Optional<String>}
      # Absent counters are absent from this encoding; unknown is never reported as zero.
      - {name: decoded_usage_json, type: Optional<String>}
      # The deltas the decoder showed its caller, in order: `text:<delta>`, `reasoning:<delta>`,
      # `started:<call>:<name>`, `arguments:<call>:<fragment>`.
      - {name: shown, type: List<String>}
      # Whether the decoded outcome equals the encoded one, field for field.
      - {name: round_trip, type: Optional<Boolean>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm.messages.Present
    input:
      - {name: request_json, type: String}
      # The fixture account's declared `auth_kind` and `billing_kind` spellings; an `api-key`
      # account names `x-api-key`.
      - {name: auth_kind, type: String}
      - {name: billing_kind, type: String}
      # Turns run one after another through one client, at most four.
      - {name: turns, type: Integer}
    outcomes:
      - name: observed
        emits: [llm.messages.Presented]
        payload:
          llm.messages.Presented:
            accepted: {generated: true}
        summary: Observe the headers and body the Messages client sends under one account presentation.
  - name: llm.messages.Project
    input:
      - {name: request_json, type: String}
      - {name: ingress, type: Boolean}
    outcomes:
      - name: observed
        emits: [llm.messages.Inspected]
        payload:
          llm.messages.Inspected:
            accepted: {generated: true}
        summary: Observe actual shared request projection or ingress under the fixture Messages binding.
  - name: llm.messages.DecodeStream
    input:
      - {name: request_json, type: String}
      - {name: events_sse, type: String}
    outcomes:
      - name: observed
        emits: [llm.messages.Inspected]
        payload:
          llm.messages.Inspected:
            accepted: {generated: true}
        summary: Observe the production SSE framing and Messages decoder, including failures and partial usage.
  - name: llm.messages.DecodeMessage
    input:
      - {name: request_json, type: String}
      - {name: message_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.messages.Inspected]
        payload:
          llm.messages.Inspected:
            accepted: {generated: true}
        summary: Observe the shared complete-response decoder that the stream decoder also finishes through.
  - name: llm.messages.EncodeIngress
    # Encode one neutral outcome back onto this wire, streamed or not, then read the answer back
    # through this crate's decoder against the request the caller sent.
    input:
      # The caller's Messages request body, read with the production ingress decoder.
      - {name: request_json, type: String}
      # Serialized llm.outcome/4, raw so that a malformed envelope reaches the encoder.
      - {name: outcome_json, type: String}
      - {name: streamed, type: Boolean}
      # A JSON array of neutral stream events, each passed to one IngressStream before it closes
      # on the outcome. Absent means the stream carried no events.
      - {name: events_json, type: Optional<String>}
      # The model the stream announces in message_start, which precedes the outcome.
      - {name: model, type: Optional<String>}
      # When present, the stream ends with this error code instead of closing on the outcome.
      - {name: fail_code, type: Optional<String>}
    outcomes:
      - name: observed
        emits: [llm.messages.Encoded]
        payload:
          llm.messages.Encoded:
            accepted: {generated: true}
        summary: Observe what a gateway answers a Messages caller and what the decoder reads back.
events:
  - name: llm.messages.Inspected
    fields:
      - {name: accepted, type: Boolean}
  - name: llm.messages.Presented
    fields:
      - {name: accepted, type: Boolean}
  - name: llm.messages.Encoded
    fields:
      - {name: accepted, type: Boolean}
views:
  - name: llm.messages.LastInspection
    source: llm.messages.CodecInspection
    consistency: read_your_writes
    fields: *codec_facts
  - name: llm.messages.LastPresentation
    source: llm.messages.PresentationObservation
    consistency: read_your_writes
    fields: *presentation_facts
  - name: llm.messages.LastIngressEncoding
    source: llm.messages.IngressEncoding
    consistency: read_your_writes
    fields: *ingress_encoding_facts
