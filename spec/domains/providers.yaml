domain: llm.providers

# Provider accounts, bindings and request-time authentication (crates/llm-providers). A
# `BindingDocument` names one provider, account, endpoint, served model and serving model;
# `bind` validates their references without I/O (binding.rs:44-77), and `prepare_auth` resolves
# only the account's explicitly named secret, once, through an injected resolver
# (auth.rs:33-106). Its secret-error mapping is auth.rs:108-126: `missing`, `expired` and
# `malformed` are `unauthorized`, which no fallback takes; every other resolver failure is
# `unavailable`. The message is the failure's fixed text prefixed by the reference that refused
# ("secret reference `<id>` refused: ..."), never a path, variable name or value.
#
# The entities are verification-adapter observations of the real crate with an injected
# in-process resolver whose failures and material the fixture chooses. No credential store,
# file or network is involved. The header *value* is never reported; only whether it is the
# declared presentation of the fixture material.
#
# The declared presentation is the material without one trailing line terminator (`\n` or
# `\r\n`), the newline a token file written by an editor or `echo` ends with. Nothing else is
# removed: a second terminator, a terminator anywhere else, or any other byte outside printable
# US-ASCII is refused as `unauthorized`.
#
# A `subscription-oauth` account holds a caller-supplied subscription token behind its secret
# reference; llm offers no login and reads no login file. At this layer it is presented as one
# sensitive `authorization: Bearer` header, like `bearer`; what makes it a different
# presentation is protocol-specific and belongs to llm.messages (the OAuth beta header and the
# subscription client preamble). `bind` refuses it, before any resolution, without a secret
# reference or with an API-key header (the `bearer` rules), with any billing other than
# `subscription` ("subscription OAuth accounts require subscription billing": a subscription
# token is never billed as metered API use), and on any protocol other than `messages`
# ("subscription OAuth accounts are served only over Messages").
#
# The catalog projection of these declarations (llm-routing `Catalog`) is declared once, in
# llm.catalog (Provider, Account and their `references` relations) and llm.routing (the
# evaluation observations), and is not restated here.
types:
  # Every SecretError the resolver seam can return (crates/llm-credentials/src/lib.rs:58-88).
  - name: llm.providers.SecretFailure
    kind: enum
    variants: [InvalidReference, Unavailable, Missing, Expired, RefreshUnsupported, RefreshRejected, RefreshUncertain, TooLarge, TooManyReferences, UnsafeSource, UnsupportedPlatform, Malformed]
  # Where the caller's cancellation lands relative to resolution.
  - name: llm.providers.CancelPoint
    kind: enum
    variants: [Never, BeforeCall, DuringResolve, AfterResolve]
entities:
  - name: llm.providers.Account
    identity: {name: id, type: String}
    fields:
      - {name: provider_id, type: String}
      - {name: auth_kind, type: String}
      - {name: billing_kind, type: String}
      # A non-secret lookup name; absent exactly when the account is anonymous.
      - {name: secret_reference_id, type: 'Optional<String>'}
      - {name: api_key_header, type: 'Optional<String>'}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.providers.Binding
    identity: {name: serving_model_id, type: String}
    fields:
      - {name: account_id, type: String}
      - {name: endpoint_id, type: String}
      - {name: model_id, type: String}
      - {name: protocol, type: String}
      - {name: request_url, type: String}
    relations:
      - {name: account, kind: references, target: llm.providers.Account, cardinality: one, via: account_id}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.providers.PreparationObservation
    identity: {name: observation_id, type: String}
    fields: &preparation_facts
      # Whether the document parsed and `bind` accepted it.
      - {name: bound, type: Boolean}
      # The refusal's llm-core error code and the fixed message the crate wrote, from `bind`
      # or `prepare_auth`. `invalid-document` when the document itself does not parse.
      - {name: error_code, type: 'Optional<String>'}
      - {name: error_message, type: 'Optional<String>'}
      # For a document that does not parse: each validated field the crate's own constructor
      # refuses, as `<field>: <message>`.
      - {name: field_errors, type: 'List<String>'}
      - {name: request_url, type: 'Optional<String>'}
      # `<protocol>/<provider>/<account>/<endpoint>/<model>` of the bound provenance.
      - {name: provenance, type: 'Optional<String>'}
      - {name: upstream_model, type: 'Optional<String>'}
      # Whether `prepare_auth` returned headers.
      - {name: prepared, type: Boolean}
      - {name: header_count, type: 'Optional<Integer>'}
      - {name: header_name, type: 'Optional<String>'}
      # `Bearer` when the value carries the bearer scheme, `raw` otherwise.
      - {name: header_scheme, type: 'Optional<String>'}
      # Whether the value is exactly the declared presentation of the fixture material.
      - {name: header_matches, type: 'Optional<Boolean>'}
      - {name: header_sensitive, type: 'Optional<Boolean>'}
      # Whether a credential generation came back with the headers.
      - {name: generation_present, type: 'Optional<Boolean>'}
      # Calls the injected resolver received.
      - {name: resolver_calls, type: Integer}
      - {name: refresh_calls, type: Integer}
      # Whether every Debug rendering and diagnostic is free of the fixture material.
      - {name: diagnostics_safe, type: Boolean}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  # A provider description (`llm.provider-description/1`, TOML, crates/llm-providers): what
  # every consumer reads about one provider. Its inference half is a base-URL template holding
  # `{instance}` once in the host's first label, the wires served and the authentication; its
  # optional control-plane half names a pinned OpenAPI document by URL and SHA-256 digest, its
  # HTTPS server and the `operationId` of each of four fixed roles. Parsing performs no I/O: the
  # document is never fetched and no secret is resolved. An instance is 1-48 bytes of
  # `[a-z0-9]`, refused before substitution, so it can change neither host, path nor scheme.
  # The observation is the real `ProviderDescription::parse` and `inference_base_url`, or the
  # shipped description `llm_providers::descriptions::<name>()`.
  - name: llm.providers.DescriptionObservation
    identity: {name: observation_id, type: String}
    fields: &description_facts
      # Whether the document parsed and validated.
      - {name: accepted, type: Boolean}
      # The llm-core error code and the crate's fixed message; `invalid-document` when the
      # document does not parse as `llm.provider-description/1`.
      - {name: error_code, type: 'Optional<String>'}
      - {name: error_message, type: 'Optional<String>'}
      - {name: provider_id, type: 'Optional<String>'}
      - {name: category, type: 'Optional<String>'}
      - {name: base_url_template, type: 'Optional<String>'}
      # The wire names in declared order.
      - {name: protocols, type: 'List<String>'}
      - {name: inference_auth_kind, type: 'Optional<String>'}
      - {name: control_plane_present, type: Boolean}
      - {name: openapi_url, type: 'Optional<String>'}
      - {name: document_sha256, type: 'Optional<String>'}
      - {name: server_url, type: 'Optional<String>'}
      - {name: control_plane_auth_kind, type: 'Optional<String>'}
      # `<role>=<operationId>` in the order create, list, get, delete.
      - {name: operations, type: 'List<String>'}
      # For an accepted description and a given instance: the filled base URL, or the refusal.
      - {name: base_url, type: 'Optional<String>'}
      - {name: instance_error_code, type: 'Optional<String>'}
      - {name: instance_error_message, type: 'Optional<String>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm.providers.Prepare
    input:
      - {name: binding_json, type: String}
      # What the injected resolver answers: its failure when present, otherwise the material,
      # otherwise `secret_length` bytes of fixture material.
      - {name: secret_error, type: 'Optional<llm.providers.SecretFailure>'}
      - {name: secret, type: 'Optional<String>'}
      - {name: secret_length, type: 'Optional<Integer>'}
      - {name: cancel, type: llm.providers.CancelPoint}
    outcomes:
      - name: observed
        emits: [llm.providers.Prepared]
        payload:
          llm.providers.Prepared:
            diagnostics_safe: {generated: true}
        summary: Observe binding validation and request-time authentication with an injected resolver.
  - name: llm.providers.Describe
    input:
      # The document, or the name of a shipped description (`runpod`); exactly one is given.
      - {name: description_toml, type: 'Optional<String>'}
      - {name: shipped, type: 'Optional<String>'}
      # When present, `inference_base_url` is called with it on an accepted description.
      - {name: instance, type: 'Optional<String>'}
    outcomes:
      - name: observed
        emits: [llm.providers.Described]
        payload:
          llm.providers.Described:
            accepted: {generated: true}
        summary: Observe parsing and validation of a provider description and the inference URL it gives an instance.
events:
  # Test-adapter notification only; there is no production notification transport.
  - name: llm.providers.Prepared
    fields:
      - {name: diagnostics_safe, type: Boolean}
  - name: llm.providers.Described
    fields:
      - {name: accepted, type: Boolean}
views:
  - name: llm.providers.LastPreparation
    source: llm.providers.PreparationObservation
    consistency: read_your_writes
    fields: *preparation_facts
  - name: llm.providers.LastDescription
    source: llm.providers.DescriptionObservation
    consistency: read_your_writes
    fields: *description_facts
