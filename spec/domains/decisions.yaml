domain: llm.decisions

# Typed decisions over a model: a closed-label classification and a rubric verdict (crate
# llm-decide).
#
# A classification asks one closed label set: at least two distinct, non-empty labels, versioned.
# The answer is one label of that set with a confidence per label in basis points (0 to 10000),
# or an abstention with a cause. Nothing else: a label outside the set is an abstention
# `OffLabel`, never a decision. A model path asks for `{"label": <one of the labels>,
# "confidences": {<every label>: <integer basis points>}}` and no other key, as a strict output
# schema (JsonSchema) or as the parameters of one forced tool (ForcedTool); an answer that does
# not decode as that schema is `OffLabel`, and so is a decision whose label's confidence is under
# the classifier's floor (an unknown confidence meets no floor).
#
# A model path takes an answer only whole; what follows is `OffLabel` even when what arrived would
# decode as the schema, and the call's record is written as succeeded. On JsonSchema the answer is
# the one assistant text of a turn that ended normally, read as one JSON value. `OffLabel` are: a
# turn that stopped at the output limit, a turn reported incomplete, an outcome with no assistant
# text, an outcome with two assistant texts (they are not joined; an empty or whitespace-only text
# beside the answer counts as a second text), a refusal beside the text, and a text in which an
# object gives a key twice (`label`, `confidences`, or a label inside `confidences`). State the
# provider keeps beside its answer is not part of the answer.
#
# On ForcedTool the answer is the arguments of the one call to the forced tool of a turn that
# stopped for its tool call. `OffLabel` are: a call of a turn that stopped at the output limit, a
# call of a turn reported incomplete, two calls, and a refusal beside the call. Assistant text and
# provider state beside the call are not part of the answer. A key given twice in a call's
# arguments is not seen: the arguments reach the classifier already parsed. An outcome the routed
# call itself refuses (a call to another tool, a call of a turn that says it ended normally, a
# stop for a tool call without a call) is a failed call: `ProviderError` with `protocol`.
#
# A chain is an ordered fallback over classifiers for one label set under one deadline. The
# first classifier that decides ends the chain; every earlier one left an abstention, and when
# every classifier abstains the last abstention is final. A model call still open at the
# deadline is cancelled and abstains `Timeout`; an answer arriving at or after it is not used;
# a model classifier reached with no time left abstains `Timeout` without a call. A chain may end
# in a lexical classifier the caller supplies, which makes no model call and so runs even past
# the deadline. A failed call abstains `ProviderError` with its llm error code. Every model call
# a classifier makes goes through the routed, recorded call of llm.calls and yields one
# llm.calls.CallRecord of kind Classification, which carries latency and the cost of every
# attempt, retries and fallbacks included.
#
# A verdict is one rubric call: the rubric, its version and the pinned model are named in the
# result, and the answer is strict JSON held to the rubric's verdict schema.
#
# A rubric is an id, a version, a text, a verdict JSON Schema and a route alias. Its digest is the
# lowercase hex sha256 of: the text's length in bytes as eight big-endian bytes, the text, and the
# schema as canonical JSON (keys sorted, no whitespace). The schema may use only the keywords the
# library checks an answer against (type, properties, required, additionalProperties, items,
# enum, const, minimum, maximum, anyOf; title and description are read as annotations); any other
# keyword is refused when the rubric is built (unsupported-schema), as are an empty version
# (empty-version) and an empty text (empty-text).
#
# Judging sends one turn to the rubric's route: the text as the instructions, the subject as the
# one user item, the schema as the strict output format named `verdict`, and temperature 0 where
# the route's target declares temperature. Nothing else enters the request, so its bytes are a
# function of rubric and subject. The route must have exactly one target and fallback off, else
# the rubric is refused before any call (route-not-pinned): the model cannot change between runs.
# The call goes through the routed, recorded call of llm.calls, with no fallback and the
# same-target retry of every routed call, and yields one llm.calls.CallRecord of kind Verdict
# with the id `<request id>/<rubric id>`.
#
# The verdict names the rubric id, version and digest, the route target and the upstream model
# the far side reported, and holds the answer as canonical JSON. An answer that is not JSON or is
# not valid against the schema is refused, never repaired: the verdict then has the error code
# `protocol` and no JSON. A failed call is its llm error and no verdict, and so is an answer
# whose far side reported no upstream model (`protocol`): a verdict cannot pin what it was not
# told.
#
# The decision endpoint is a provider's own endpoint for typed questions about one input (crate
# llm-openai-decisions). Its nouns are read from openai/openai-openapi at commit
# b4cad10d7cff7fc286f2dbf1992569989522c6f0: path /decisions, schemas DecisionRequest and
# DecisionResponse. It is not a turn: a request carries an input and 1 to 400 questions and gets
# one answer per question, in question order, with token usage.
#
# The client sends POST <endpoint base URL>decisions over llm-http with the credential the
# target's account declares, to the route target the caller selected (the first compatible target
# of a turn route served on a responses or chat-completions endpoint; any other protocol is
# refused `unsupported` before I/O). The body is {model, input, questions, safety_identifier?,
# prompt_cache_key?, prompt_cache_options?} and nothing else; its model is the target's upstream
# model. A request is refused `invalid-request` before I/O, naming the path of the member, when:
# it has no question or more than 400; a choice question has fewer than 2 or more than 255
# choices, or one typed value twice (the text "true" and the boolean true are distinct); a score
# question has fewer than 2 or more than 10 levels; a name, an instruction, a choice value, a
# description or a level label is longer than 1048576 characters; the input is longer than
# 10485760 characters; safety_identifier is longer than 128 or prompt_cache_key longer than 64
# characters. A request read from JSON is one whole document whose members are the reference's:
# a member the reference does not name is refused `invalid-request` by its path
# (`questions[0].threshold`), as is a repeated member; a form the reference names and this client
# does not send (an input given as items, instructions given as content parts) is refused
# `unsupported` by its path.
#
# An answer body is read whole from the transport and then as one JSON document. A body the
# transport reports as cut (short of its declared length, or a chunked body without its end) is
# the transport's own failure, handed on unchanged: `transport`, dispatch `accepted`, retriable.
# A body that arrived whole by the transport's account and is not one JSON document is refused
# `protocol`, dispatch `accepted`: a document that ends early (so also a body delimited only by
# the connection's end and cut there), bytes after the document, a second document, a repeated
# member at any depth and a nesting deeper than 16; nothing is read leniently.
# The document must name `model` (text) and `answers`: exactly one answer per question, in
# order, each of its question's type or `refusal`, each carrying its question's name (null when
# the question has none). A type outside predicate, choice, score and refusal is refused
# `protocol` naming its path (`answers[0].type`), never guessed; so is an answer of another
# question's type, a missing member and a member of the wrong JSON type. A message names a path
# and never a value. A member of an answer the reference does not name is left alone.
#
# Usage is read apart from the answers, so a refused answer still reports its tokens. Each
# counter is taken only when the body reports it as a non-negative integer; a counter that is
# absent, null, negative or fractional is unknown, never zero. The reference's bound of each
# counter (-2147483648 to 2147483647) is not enforced. Counters that contradict each
# other (cache tokens above input tokens, reasoning tokens above output tokens) are all unknown.
#
# Each call that reached credential resolution yields one llm.calls.CallRecord of kind
# Classification with the caller's id: the route, the route target, the upstream model the body
# named, one attempt, the usage as read and, under a price book, its cost from the price declared
# for the target's serving model and binding revision. An unknown counter leaves that cost
# incomplete. A request refused before the credential is resolved writes no record.
#
# A classifier on the DecisionEndpoint path asks one choice question: the classifier's
# instructions, and one choice per label of the set, in the set's order, the label as its text
# value. It makes one call, with no retry and no fallback, to the first compatible target of its
# route, under the chain's deadline like the other model paths. A refusal answer abstains
# `OffLabel`. A choice answer decides its `choice` when that is a text and a label of the set.
# Its `probabilities` become the confidences: a probability p is taken only when it is finite and
# 0 <= p <= 1, and becomes the whole number of basis points nearest to p * 10000, computed
# exactly on the binary value the document's number parses to, a tie rounding up (0.03125 is
# 313). The probabilities are not normalized and their sum is not checked. A label the answer
# gives no probability has an unknown confidence. A probability outside 0 to 1, a value that is
# not a text, a value that is no label of the set and a label given twice abstain `OffLabel`. The
# answer's own `confidence` member is not used.
types:
  - name: llm.decisions.Path
    kind: enum
    # JsonSchema: a turn with controls.output_format (llm.inference.OutputFormat), strict.
    # ForcedTool: a turn forcing one named tool (llm-tool-call call_tool).
    # DecisionEndpoint: a provider's closed-label decision endpoint (POST /v1/decisions).
    # Lexical: a caller-supplied classifier; no model call.
    variants: [JsonSchema, ForcedTool, DecisionEndpoint, Lexical]
  - name: llm.decisions.AbstentionCause
    kind: enum
    # Timeout: the classifier's deadline passed. ProviderError: the call failed with a typed
    # llm error (its code is kept in `error_code`). OffLabel: the answer named no label of the
    # set, did not decode as the path's schema, was not the one whole answer of its turn (cut,
    # split, a key given twice, a refusal beside it), or its label's confidence was under the
    # classifier's floor.
    variants: [Timeout, ProviderError, OffLabel]
  - name: llm.decisions.LabelConfidence
    kind: struct
    fields:
      - {name: label, type: String}
      # 0 to 10000. Unknown stays absent, never 0.
      - {name: confidence_bps, type: Optional<Integer>}
  - name: llm.decisions.QuestionKind
    kind: enum
    # The provider decision endpoint's question kinds; a classifier asks Choice.
    variants: [Predicate, Choice, Score]
  - name: llm.decisions.AnswerKind
    kind: enum
    variants: [Predicate, Choice, Score, Refusal]
  - name: llm.decisions.ChoiceValue
    kind: struct
    # A typed choice value: exactly one of the two is present.
    fields:
      - {name: text, type: Optional<String>}
      - {name: flag, type: Optional<Boolean>}
  - name: llm.decisions.ChoiceOption
    kind: struct
    fields:
      - {name: value, type: llm.decisions.ChoiceValue}
      - {name: description, type: Optional<String>}
  - name: llm.decisions.ScoreLevel
    kind: struct
    fields:
      - {name: label, type: String}
      - {name: description, type: Optional<String>}
  - name: llm.decisions.Question
    kind: struct
    fields:
      - {name: kind, type: llm.decisions.QuestionKind}
      # The caller's correlation name; the answer carries it back.
      - {name: name, type: Optional<String>}
      - {name: instructions, type: String}
      # 2 to 255 distinct typed values; present exactly for Choice.
      - {name: choices, type: List<llm.decisions.ChoiceOption>}
      # 2 to 10 ordered levels; present exactly for Score.
      - {name: levels, type: List<llm.decisions.ScoreLevel>}
  - name: llm.decisions.PromptCacheTtl
    kind: enum
    # The wire writes `30m`.
    variants: [ThirtyMinutes]
  - name: llm.decisions.PromptCacheMode
    kind: enum
    variants: [Implicit, Explicit]
  - name: llm.decisions.PromptCacheOptions
    kind: struct
    fields:
      - {name: ttl, type: Optional<llm.decisions.PromptCacheTtl>}
      - {name: mode, type: Optional<llm.decisions.PromptCacheMode>}
  - name: llm.decisions.ChoiceProbability
    kind: struct
    fields:
      - {name: value, type: llm.decisions.ChoiceValue}
      - {name: probability, type: Decimal}
  - name: llm.decisions.ScoreProbability
    kind: struct
    fields:
      - {name: value, type: Integer}
      - {name: label, type: String}
      - {name: probability, type: Decimal}
  - name: llm.decisions.QuestionAnswer
    kind: struct
    fields:
      - {name: kind, type: llm.decisions.AnswerKind}
      - {name: name, type: Optional<String>}
      # Predicate: how likely the statement is true.
      - {name: probability, type: Optional<Decimal>}
      # Choice: the value chosen and a probability per value the answer lists.
      - {name: choice, type: Optional<llm.decisions.ChoiceValue>}
      - {name: choice_probabilities, type: List<llm.decisions.ChoiceProbability>}
      # Score: the score and a probability per level the answer lists.
      - {name: score, type: Optional<Decimal>}
      - {name: score_probabilities, type: List<llm.decisions.ScoreProbability>}
      # Choice and Score: the answer's own confidence, kept as written.
      - {name: confidence, type: Optional<Decimal>}
entities:
  - name: llm.decisions.DecisionRequest
    identity: {name: id, type: String}
    fields:
      # The catalog route alias the request names; the wire body carries the upstream model.
      - {name: route_alias, type: String}
      - {name: input, type: String}
      # 1 to 400, in the caller's order.
      - {name: questions, type: List<llm.decisions.Question>}
      - {name: safety_identifier, type: Optional<String>}
      - {name: prompt_cache_key, type: Optional<String>}
      - {name: prompt_cache_options, type: Optional<llm.decisions.PromptCacheOptions>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.decisions.DecisionResponse
    identity: {name: id, type: String}
    fields:
      - {name: request_id, type: String}
      # The model the body named.
      - {name: upstream_model, type: String}
      # One per question, in question order.
      - {name: answers, type: List<llm.decisions.QuestionAnswer>}
      # Each counter as the body reported it; unknown stays absent, never 0.
      - {name: input_tokens, type: Optional<Integer>}
      - {name: output_tokens, type: Optional<Integer>}
      - {name: cached_input_tokens, type: Optional<Integer>}
      - {name: cache_creation_input_tokens, type: Optional<Integer>}
      - {name: reasoning_output_tokens, type: Optional<Integer>}
      - {name: call_record_id, type: Optional<String>}
    relations:
      - {name: request, kind: references, target: llm.decisions.DecisionRequest, cardinality: one, via: request_id}
      - {name: call, kind: references, target: llm.calls.CallRecord, cardinality: one, via: call_record_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.decisions.LabelSet
    identity: {name: id, type: String}
    fields:
      - {name: version, type: String}
      # Distinct, non-empty, in the caller's order; at least two.
      - {name: labels, type: List<String>}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.decisions.Chain
    identity: {name: id, type: String}
    fields:
      - {name: label_set_id, type: String}
      - {name: deadline_ms, type: Integer}
    relations:
      - {name: label_set, kind: references, target: llm.decisions.LabelSet, cardinality: one, via: label_set_id}
      - {name: classifiers, kind: owns, target: llm.decisions.Classifier, cardinality: many, via: chain_id}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.decisions.Classifier
    identity: {name: id, type: String}
    fields:
      - {name: chain_id, type: String}
      - {name: position, type: Integer}
      - {name: path, type: llm.decisions.Path}
      # The catalog route alias a model path's turn or decision request names; absent exactly
      # for Lexical.
      - {name: route_alias, type: Optional<String>}
      # A decision below this confidence is an abstention OffLabel; absent admits every one.
      - {name: min_confidence_bps, type: Optional<Integer>}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.decisions.Decision
    identity: {name: id, type: String}
    fields:
      - {name: chain_id, type: String}
      - {name: classifier_id, type: String}
      - {name: label_set_version, type: String}
      - {name: label, type: String}
      - {name: confidences, type: List<llm.decisions.LabelConfidence>}
      - {name: latency_ms, type: Integer}
      # Absent exactly when the deciding classifier is Lexical.
      - {name: call_record_id, type: Optional<String>}
    relations:
      - {name: classifier, kind: references, target: llm.decisions.Classifier, cardinality: one, via: classifier_id}
      - {name: call, kind: references, target: llm.calls.CallRecord, cardinality: one, via: call_record_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.decisions.Abstention
    identity: {name: id, type: String}
    fields:
      - {name: chain_id, type: String}
      - {name: classifier_id, type: String}
      - {name: cause, type: llm.decisions.AbstentionCause}
      # The llm error code for ProviderError; absent otherwise.
      - {name: error_code, type: Optional<String>}
      # True when no later classifier in the chain decided: the chain's answer.
      - {name: final, type: Boolean}
      - {name: latency_ms, type: Integer}
      - {name: call_record_id, type: Optional<String>}
    relations:
      - {name: classifier, kind: references, target: llm.decisions.Classifier, cardinality: one, via: classifier_id}
      - {name: call, kind: references, target: llm.calls.CallRecord, cardinality: one, via: call_record_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.decisions.Rubric
    identity: {name: id, type: String}
    fields:
      - {name: version, type: String}
      # sha256 of the rubric text and its verdict schema, as the result pins it.
      - {name: digest, type: String}
      - {name: route_id, type: String}
    relations:
      - {name: route, kind: references, target: llm.catalog.Route, cardinality: one, via: route_id}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm.decisions.Verdict
    identity: {name: id, type: String}
    fields:
      - {name: rubric_id, type: String}
      - {name: rubric_version, type: String}
      - {name: rubric_digest, type: String}
      # The route target and upstream model that answered; a verdict names exactly one.
      - {name: route_target_id, type: String}
      - {name: upstream_model, type: String}
      # Canonical JSON (sorted keys) of the answer, valid against the rubric's verdict schema.
      - {name: verdict_json, type: Optional<String>}
      # Set when the answer did not decode as the schema; then verdict_json is absent.
      - {name: error_code, type: Optional<String>}
      - {name: call_record_id, type: String}
    relations:
      - {name: rubric, kind: references, target: llm.decisions.Rubric, cardinality: one, via: rubric_id}
      - {name: target, kind: references, target: llm.catalog.RouteTarget, cardinality: one, via: route_target_id}
      - {name: call, kind: references, target: llm.calls.CallRecord, cardinality: one, via: call_record_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.decisions.ClassificationObservation
    identity: {name: observation_id, type: String}
    fields: &classification_facts
      - {name: valid_program, type: Boolean}
      # The refusal before any classifier ran (an llm error code, or a label set or chain
      # refusal: duplicate-label, too-few-labels, ...), else the final abstention's llm error code.
      - {name: error_code, type: Optional<String>}
      # Classifier ids in the order the chain tried them.
      - {name: tried, type: List<String>}
      # Per tried classifier: id:decided, or id:abstained:<cause> with :<llm error code> after
      # ProviderError.
      - {name: results, type: List<String>}
      - {name: label, type: Optional<String>}
      - {name: confidences, type: List<llm.decisions.LabelConfidence>}
      - {name: final_cause, type: Optional<llm.decisions.AbstentionCause>}
      - {name: call_record_ids, type: List<String>}
      # Every record the sink received, as canonical JSON (llm.calls.CallRecord), in order.
      - {name: records, type: List<String>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.decisions.VerdictObservation
    identity: {name: observation_id, type: String}
    fields: &verdict_facts
      - {name: valid_program, type: Boolean}
      # The refusal before any call (an llm error code, or a rubric refusal: route-not-pinned,
      # unsupported-schema, ...), a failed call's llm error code, or the last verdict's error code.
      - {name: error_code, type: Optional<String>}
      # The pins and the answer of the last run's verdict.
      - {name: rubric_version, type: Optional<String>}
      - {name: rubric_digest, type: Optional<String>}
      - {name: route_target_id, type: Optional<String>}
      - {name: upstream_model, type: Optional<String>}
      - {name: verdict_json, type: Optional<String>}
      - {name: call_record_id, type: Optional<String>}
      # The last request a scripted model received: the lowercase hex sha256 of that turn request
      # serialized as JSON, so two runs can be compared.
      - {name: request_digest, type: Optional<String>}
      # That digest for every request a scripted model received, over all runs, in order.
      - {name: request_digests, type: List<String>}
      # The canonical JSON of every run's verdict that holds one, in order.
      - {name: verdict_jsons, type: List<String>}
      # Every record the sink received over all runs, as canonical JSON (llm.calls.CallRecord),
      # in order.
      - {name: records, type: List<String>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.decisions.DecideObservation
    identity: {name: observation_id, type: String}
    fields: &decide_facts
      - {name: valid_program, type: Boolean}
      # The refusal of the request or the call (an llm error code), a label set or chain refusal,
      # else the final abstention's llm error code.
      - {name: error_code, type: Optional<String>}
      # The refusal's fixed message, which names a path and never a value.
      - {name: error_message, type: Optional<String>}
      # A direct request: each answer as canonical JSON in the reference's shape, in order.
      - {name: answers, type: List<String>}
      - {name: upstream_model, type: Optional<String>}
      # A direct request: the usage the client returned.
      - {name: input_tokens, type: Optional<Integer>}
      - {name: output_tokens, type: Optional<Integer>}
      - {name: cached_input_tokens, type: Optional<Integer>}
      - {name: cache_creation_input_tokens, type: Optional<Integer>}
      - {name: reasoning_output_tokens, type: Optional<Integer>}
      # Per request the fixture server received, in order: its request line's path, and its body
      # as the client wrote it.
      - {name: request_paths, type: List<String>}
      - {name: request_bodies, type: List<String>}
      # A chain: as llm.decisions.ClassificationObservation.
      - {name: tried, type: List<String>}
      - {name: results, type: List<String>}
      - {name: label, type: Optional<String>}
      - {name: confidences, type: List<llm.decisions.LabelConfidence>}
      - {name: final_cause, type: Optional<llm.decisions.AbstentionCause>}
      - {name: call_record_ids, type: List<String>}
      # Every record the sink received, as canonical JSON (llm.calls.CallRecord), in order.
      - {name: records, type: List<String>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm.decisions.Decide
    # Run the real decision endpoint client over a loopback fixture server scripted by
    # program_json; the catalog's `http://fixture.invalid` is the server's address, and a price
    # whose binding revision is `fixture-binding-revision` is priced under the revision its
    # serving model's binding has at that address. A frozen clock stamps the records, and the
    # last authored answer repeats. request_json is one decision request in the
    # reference's shape whose model is the route alias; or label_set_json, chain_json and
    # input_text run a chain of DecisionEndpoint classifiers through the same client.
    # program_json holds request_id, input_tokens (the caller's estimate routing admits a target
    # against), start_unix_ms and answers: per request the server receives, in order, its status
    # and its body as JSON (`body`) or as the exact text to write (`body_text`).
    input:
      - {name: catalog_toml, type: String}
      - {name: prices_toml, type: Optional<String>}
      - {name: request_json, type: Optional<String>}
      - {name: label_set_json, type: Optional<String>}
      - {name: chain_json, type: Optional<String>}
      - {name: input_text, type: Optional<String>}
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.decisions.Decided]
        payload:
          llm.decisions.Decided:
            valid_program: {generated: true}
        summary: Return the answers, usage, decision or abstention, records and refusal the client reported.
  - name: llm.decisions.Classify
    # Run the real chain over in-process scripted models and an optional scripted lexical
    # classifier, a scripted clock and an optional price book; no network. program_json scripts
    # each serving model's answer, failure, delay or hang, and each lexical classifier's answer.
    # A model's answer is its assistant texts (`answer`, then each of `answers`, one item each)
    # followed by its calls to the turn's first tool (`tool_arguments`, then each of `tool_calls`)
    # under `stop_reason`; without one the turn stops for its tool call when it has a call and
    # ends normally when it has none. A call's arguments are JSON text: a program in which they
    # are not one JSON value is not a valid program, and no call is made.
    input:
      - {name: catalog_toml, type: String}
      - {name: label_set_json, type: String}
      - {name: chain_json, type: String}
      - {name: input_text, type: String}
      - {name: prices_toml, type: Optional<String>}
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.decisions.Classified]
        payload:
          llm.decisions.Classified:
            valid_program: {generated: true}
        summary: Return the chain's decision or abstention and every attempt; not model quality.
  - name: llm.decisions.Judge
    # Run the real judge over in-process scripted models, a scripted clock and an in-memory
    # record sink; no network. rubric_json is the rubric (id, version, text, schema,
    # route_alias). program_json lists one or more runs over the same rubric and subject, each
    # with its request id, its clock start and its scripted answer per serving model, so that two
    # runs can be compared in one observation.
    input:
      - {name: catalog_toml, type: String}
      - {name: rubric_json, type: String}
      - {name: subject_text, type: String}
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.decisions.Judged]
        payload:
          llm.decisions.Judged:
            valid_program: {generated: true}
        summary: Return the verdict the library produced from a scripted answer, with its pins.
events:
  # Test-adapter notifications only; no production event transport.
  - name: llm.decisions.Classified
    fields:
      - {name: valid_program, type: Boolean}
  - name: llm.decisions.Judged
    fields:
      - {name: valid_program, type: Boolean}
  - name: llm.decisions.Decided
    fields:
      - {name: valid_program, type: Boolean}
views:
  - name: llm.decisions.LastDecide
    source: llm.decisions.DecideObservation
    consistency: read_your_writes
    fields: *decide_facts
  - name: llm.decisions.LastClassification
    source: llm.decisions.ClassificationObservation
    consistency: read_your_writes
    fields: *classification_facts
  - name: llm.decisions.LastVerdict
    source: llm.decisions.VerdictObservation
    consistency: read_your_writes
    fields: *verdict_facts
