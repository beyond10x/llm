name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@04b0ddbf70c22b1a5bd0cb26c57f268c69edc690
    secrets:
      B10X_GATES_POLICY_GZ: ${{ secrets.B10X_GATES_POLICY_GZ }}
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
