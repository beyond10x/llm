name: Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  libraries-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action revision; toolchain is pinned below
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Rust libraries
        run: |
          cargo test --workspace --locked
          cargo test -p b10x-llm-credentials --all-features --locked
          cargo check -p b10x-llm-credentials --no-default-features --locked
          cargo test -p b10x-llm-cost --all-features --locked
          cargo check -p b10x-llm-cost --no-default-features --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Generated documentation
        run: cargo run --locked -p llm-docs -- generate --check
      - name: Install pinned planning tool
        run: |
          cargo install --locked --git https://github.com/beyond10x/aep.git --rev 6d7a44d3607d2d9a6ffdf0a165993c546c43d0db aep-cli --bin aep
      - name: Install ess
        env:
          ESS_VERSION: "0.55.0"
          ESS_SHA256: 1d2c0f0ad6871eafa452d738d2bc978e748349683f77667371cefebc7f646a8c
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Specification and plan
        run: |
          ess specify validate --path spec
          cargo run --locked -p b10x-llm-conformance -- check
          aep plan artifact validate
      - name: Conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-conformance
          path: target/conformance
          if-no-files-found: error
  native-adapter-builds:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The ESS git dependency checks out a planning tree whose paths exceed Windows' default
      # limit; cargo fetches through the git CLI so core.longpaths applies.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Allow long paths in Git checkouts
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action revision; toolchain is pinned below
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Native credentials and local ledger fixtures
        run: |
          cargo test -p b10x-llm-credentials --all-features --locked
          cargo clippy -p b10x-llm-credentials --all-targets --all-features --locked -- -D warnings
          cargo test -p b10x-llm-cost --all-features --locked
          cargo clippy -p b10x-llm-cost --all-targets --all-features --locked -- -D warnings
