name: Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  libraries-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action revision; toolchain is pinned below
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Rust libraries
        run: |
          cargo test --workspace --locked
          cargo test -p b10x-llm-credentials --all-features --locked
          cargo check -p b10x-llm-credentials --no-default-features --locked
          cargo test -p b10x-llm-cost --all-features --locked
          cargo check -p b10x-llm-cost --no-default-features --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Install pinned planning tools
        run: |
          cargo install --locked --git https://github.com/beyond10x/aep.git --rev 99ad0b51b748629ddf3708c366f18d69fe86cf5e aep-cli --bin aep
          cargo install --locked --git https://github.com/beyond10x/ess.git --rev a86579e13385476e324a1550aab2a5e207048ee2 ess-cli --bin ess
      - name: Specification and plan
        run: |
          ess specify validate --path spec
          cargo run --locked -p b10x-llm-conformance -- check
          aep plan artifact validate
      - name: Conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-conformance
          path: target/conformance
          if-no-files-found: error
  native-adapter-builds:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The ESS git dependency checks out a planning tree whose paths exceed Windows' default
      # limit; cargo fetches through the git CLI so core.longpaths applies.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Allow long paths in Git checkouts
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action revision; toolchain is pinned below
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Native credentials and local ledger fixtures
        run: |
          cargo test -p b10x-llm-credentials --all-features --locked
          cargo clippy -p b10x-llm-credentials --all-targets --all-features --locked -- -D warnings
          cargo test -p b10x-llm-cost --all-features --locked
          cargo clippy -p b10x-llm-cost --all-targets --all-features --locked -- -D warnings
