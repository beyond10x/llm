name: Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scaffold-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Rust scaffold
        run: |
          cargo test --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install pinned planning tools
        run: |
          cargo install --locked --git https://github.com/beyond10x/aep.git --rev 28abe09bb6e5b0a6b4db839f6bf5693957d39324 aep-cli --bin aep
          cargo install --locked --git https://github.com/beyond10x/ess.git --rev a5f1bea13294510819b266561c83be9509e6ba57 ess-cli --bin ess
      - name: Specification and plan
        run: |
          ess specify validate --path spec
          aep plan artifact validate
