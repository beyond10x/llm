domain: llm.embeddings

# Draft (2026-11-05), not yet part of spec/system.yaml. The wave that implements it moves this
# file to spec/domains/embeddings.yaml and adds `llm.embeddings` to the system.
#
# An embed route is a catalog route whose kind is Embed (llm.catalog.Route gains an optional
# `kind`, absent meaning Turn, so a catalog from before keeps its bytes and digest). A turn is
# never sent to an embed route and an embed request never to a turn route; either is refused
# before I/O as `unsupported`.
#
# embed(texts) returns one vector per text in input order, with token usage (unknown stays
# unknown, never zero) and within the caller's timeout. A request larger than the target's
# declared batch limit is split into batches in order; the vectors come back in input order.
types:
  - name: llm.embeddings.Wire
    kind: enum
    # OpenAiEmbeddings: POST /v1/embeddings (OpenAI and OpenAI-compatible servers).
    variants: [OpenAiEmbeddings]
entities:
  - name: llm.embeddings.EmbedRequest
    identity: {name: id, type: String}
    fields:
      - {name: route_id, type: String}
      - {name: texts, type: Integer}
      - {name: timeout_ms, type: Integer}
      # Dimensions the caller asks for; absent leaves the model's default.
      - {name: dimensions, type: Optional<Integer>}
    relations:
      - {name: route, kind: references, target: llm.catalog.Route, cardinality: one, via: route_id}
      - {name: batches, kind: owns, target: llm.embeddings.EmbedBatch, cardinality: many, via: request_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.embeddings.EmbedBatch
    identity: {name: id, type: String}
    fields:
      - {name: request_id, type: String}
      - {name: position, type: Integer}
      - {name: route_target_id, type: String}
      - {name: wire, type: llm.embeddings.Wire}
      - {name: texts, type: Integer}
      - {name: input_tokens, type: Optional<Integer>}
      - {name: call_record_id, type: String}
    relations:
      - {name: target, kind: references, target: llm.catalog.RouteTarget, cardinality: one, via: route_target_id}
      - {name: call, kind: references, target: llm.calls.CallRecord, cardinality: one, via: call_record_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.embeddings.Embedding
    identity: {name: id, type: String}
    fields:
      - {name: request_id, type: String}
      # Index of the text in the caller's input.
      - {name: index, type: Integer}
      - {name: dimensions, type: Integer}
      - {name: vector, type: List<Decimal>}
    relations:
      - {name: request, kind: references, target: llm.embeddings.EmbedRequest, cardinality: one, via: request_id}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm.embeddings.EmbedObservation
    identity: {name: observation_id, type: String}
    fields: &embed_facts
      - {name: valid_program, type: Boolean}
      - {name: error_code, type: Optional<String>}
      - {name: vectors, type: Integer}
      - {name: dimensions, type: List<Integer>}
      # Per batch: target:texts.
      - {name: batches, type: List<String>}
      - {name: input_tokens, type: Optional<Integer>}
      # The request bodies sent, in order, as the wire wrote them.
      - {name: request_bodies, type: List<String>}
      - {name: ended_within, type: Optional<Boolean>}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm.embeddings.Embed
    # Run the real embed path over a loopback fixture server scripted by program_json.
    input:
      - {name: catalog_toml, type: String}
      - {name: request_json, type: String}
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm.embeddings.Embedded]
        payload:
          llm.embeddings.Embedded:
            valid_program: {generated: true}
        summary: Return the vectors, batches, usage and refusal the library reported.
events:
  - name: llm.embeddings.Embedded
    fields:
      - {name: valid_program, type: Boolean}
views:
  - name: llm.embeddings.LastEmbed
    source: llm.embeddings.EmbedObservation
    consistency: read_your_writes
    fields: *embed_facts
