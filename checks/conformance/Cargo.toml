[package]
name = "b10x-llm-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
llm-core.workspace = true
llm-cost = { package = "b10x-llm-cost", path = "../../crates/llm-cost", features = ["sqlite"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
llm-credentials = { workspace = true, features = ["file", "keychain"] }
keyring-core = "1.0.0"
tempfile = "3.27"
tokio.workspace = true
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
llm-routing = { package = "b10x-llm-routing", path = "../../crates/llm-routing" }
llm-messages = { package = "b10x-llm-messages", path = "../../crates/llm-messages" }
llm-responses = { package = "b10x-llm-responses", path = "../../crates/llm-responses" }
llm-chat = { package = "b10x-llm-chat", path = "../../crates/llm-chat" }
llm-provision = { package = "b10x-llm-provision", path = "../../crates/llm-provision" }
llm-runpod = { package = "b10x-llm-runpod", path = "../../crates/llm-runpod" }
llm-gateway = { package = "b10x-llm-gateway", path = "../../crates/llm-gateway" }
llm-providers.workspace = true
llm-http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ess-conformance = { git = "https://github.com/beyond10x/ess.git", rev = "be44a3365eb273cb3d447b74cd5b0e75181d284e" }
ess-primitives = { git = "https://github.com/beyond10x/ess.git", rev = "be44a3365eb273cb3d447b74cd5b0e75181d284e" }
